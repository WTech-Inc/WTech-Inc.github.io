<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大清風華 · 九州人生模擬</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#151311;--bg2:#1c1916;--card:#221e1a;--card2:#2b2621;--line:#363029;--line2:#463e35;--ink:#e5dfd3;--ink2:#a89f91;--ink3:#756d62;--amber:#d9a45b;--amber2:#a6783a;--sage:#84a591;--rust:#c76d5d;--sky:#7b9cb8;--plum:#a686b5}
html,body{height:100%}
body{font-family:"PingFang TC","Songti TC","Microsoft JhengHei",serif;background:var(--bg);color:var(--ink);padding:0 14px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;overflow-x:hidden;font-feature-settings:"tnum";line-height:1.55}
body.locked{overflow:hidden}
#app{width:100%;max-width:680px;padding-top:calc(14px + env(safe-area-inset-top))}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line2);border-radius:12px;margin-bottom:8px}
.hud-bars{display:flex;flex-direction:column;gap:5px;width:128px;flex-shrink:0}
.hbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.hbar i{font-style:normal;width:14px;text-align:center}
.hbar .bg{flex:1;height:6px;background:#2a2520;border-radius:99px;overflow:hidden}
.hbar .bg b{display:block;height:100%;border-radius:99px;transition:width .4s}
.hud-mid{text-align:center;flex:1;min-width:0}
.hud-mid .yr{font-size:20px;color:var(--ink);font-weight:700;line-height:1.15;letter-spacing:.5px}
.hud-mid .era{font-size:10.5px;color:var(--ink3);margin-top:1px}
.hud-mid .loc{font-size:11px;color:var(--amber);margin-top:2px;cursor:pointer;display:inline-block;border-bottom:1px dashed var(--amber2)}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.hud-cash{font-size:13.5px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;position:relative}
.hud-cash.zero{color:var(--rust)}
.hud-ap{font-size:11px;color:var(--ink2);background:var(--bg2);padding:2px 7px;border-radius:99px;border:1px solid var(--line2)}
.hud-ap b{color:var(--sage)}
.reset{width:26px;height:26px;flex-shrink:0;border-radius:7px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-size:13px;display:grid;place-items:center;transition:.15s}
.reset:hover{border-color:var(--rust);color:var(--rust)}
.fnum{position:absolute;right:0;top:-1px;font-size:11.5px;font-weight:700;pointer-events:none;white-space:nowrap;animation:fnum 1.1s ease-out forwards}
.fnum.up{color:var(--sage)}.fnum.down{color:var(--rust)}
@keyframes fnum{0%{opacity:0;transform:translateY(3px)}20%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}

.fam-strip{display:flex;gap:10px;overflow-x:auto;padding:8px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;align-items:center}
.fam-strip::-webkit-scrollbar{height:3px}
.fam-node{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;cursor:pointer;flex-shrink:0}
.fam-node .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;color:#151311;background:var(--amber);border:2px solid var(--line2);transition:.15s}
.fam-node .av.f{background:var(--plum)}
.fam-node .av.me{border-color:var(--sage);box-shadow:0 0 0 2px rgba(132,165,145,.25)}
.fam-node .av.dead{background:#38322c;color:var(--ink3);opacity:.65}
.fam-node .nm{font-size:10.5px;color:var(--ink2);white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis}

.profile-card{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:12px}
.p-meta{display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line);padding-right:10px}
.p-meta .item{display:flex;justify-content:space-between;gap:6px;color:var(--ink3)}
.p-meta .item b{color:var(--ink);font-weight:500;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.p-meta .item b.link{color:var(--amber);cursor:pointer;text-decoration:underline dotted}
.p-bars{display:flex;flex-direction:column;justify-content:center;gap:6px}
.p-bar-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.p-bar-row span:first-child{width:32px;flex-shrink:0}
.p-bar-row .trk{flex:1;height:6px;background:#2a2520;border-radius:99px;overflow:hidden}
.p-bar-row .trk i{display:block;height:100%;border-radius:99px;transition:width .4s}
.p-bar-row .num{width:24px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-size:10.5px}

.diary{border-top:1px solid var(--line);border-bottom:1px solid var(--line);height:224px;overflow-y:auto;margin-bottom:10px;padding:2px 0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
.diary::-webkit-scrollbar{width:4px}
.diary::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.e{display:flex;gap:10px;padding:7px 2px 7px 0;font-size:12.8px;line-height:1.55;animation:fe .3s ease;border-bottom:1px dashed rgba(70,62,53,.45)}
.e:last-child{border-bottom:0}
.e .t{flex-shrink:0;width:42px;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:2px;text-align:right}
.e .x{flex:1;color:var(--ink2)}
.e.good .x{color:#a8c7b3}.e.bad .x{color:#d99b90}.e.big .x{color:var(--ink);font-weight:600}.e.big .t{color:var(--amber)}
@keyframes fe{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.diary:empty::after{content:'九州風雲起，你的人生於大清天下啟程。';color:var(--ink3);font-size:12.5px;display:flex;align-items:center;justify-content:center;height:100%}

.nav-dock{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:9px}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;border-radius:11px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);cursor:pointer;transition:.16s;font-family:inherit}
.nav-btn:hover:not(:disabled){border-color:var(--amber2);color:var(--amber);background:rgba(217,164,91,.09);transform:translateY(-1px)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn .ico{font-size:18px;line-height:1.1}
.nav-btn .lbl{font-size:11.5px;font-weight:700;color:var(--ink);letter-spacing:.3px}
.nav-btn .sub{font-size:9.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
.nav-btn.primary{border-color:var(--amber2);background:linear-gradient(180deg,rgba(217,164,91,.18),rgba(217,164,91,.06))}

.advance{width:100%;padding:14px;font-size:14.5px;font-weight:700;border-radius:9px;cursor:pointer;border:1px solid var(--amber2);color:var(--amber);background:rgba(217,164,91,.1);letter-spacing:2px;font-family:inherit;transition:.15s}
.advance:hover:not(:disabled){background:rgba(217,164,91,.2)}
.advance:disabled{opacity:.3;cursor:not-allowed}
.advance.ready{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{background:rgba(217,164,91,.09)}50%{background:rgba(217,164,91,.22)}}

#ov{position:fixed;inset:0;background:rgba(10,9,8,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
#ov.show{display:flex}
.sheet{width:100%;max-width:480px;max-height:85vh;overflow-y:auto;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:20px;animation:sp .22s cubic-bezier(.34,1.3,.64,1);box-shadow:0 24px 60px rgba(0,0,0,.65);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
.sheet::-webkit-scrollbar{width:4px}
.sheet::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
@keyframes sp{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.sheet h2{font-family:"Songti TC",Georgia,serif;font-size:17.5px;font-weight:700;color:var(--ink);margin-bottom:14px;letter-spacing:.8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sheet .body{font-size:13px;line-height:1.7;color:var(--ink2)}
.sheet .body p{margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink2);font-size:12.5px}
.row .v{color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row .v.neg{color:var(--rust)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btnrow button{flex:1;min-width:100px;font-family:inherit;font-size:12.5px;padding:10px 9px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;font-weight:500;transition:.15s}
.btnrow button:hover:not(:disabled){border-color:var(--amber2);color:var(--amber)}
.btnrow button:disabled{opacity:.3;cursor:not-allowed}
.btnrow button.pri{border-color:var(--amber2);color:var(--amber);background:rgba(217,164,91,.1)}
.btnrow button.pri:hover:not(:disabled){background:rgba(217,164,91,.2)}
.btnrow button.warn{border-color:rgba(199,109,93,.55);color:var(--rust)}
.btnrow button.warn:hover:not(:disabled){background:rgba(199,109,93,.14)}
.btnrow button.on{border-color:var(--amber2);color:var(--amber);background:rgba(217,164,91,.14)}

.person{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .ava{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-family:"Songti TC",serif;font-size:15px;color:#151311;font-weight:700;background:var(--amber);opacity:.88}
.person .ava.f{background:var(--plum)}
.person .ava.dead{background:#38322c;color:var(--ink3)}
.person .info{flex:1;min-width:0}
.person .n{font-size:13.5px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.person .n .tag{font-size:10px;font-weight:500;color:var(--ink3);padding:1px 6px;border:1px solid var(--line2);border-radius:3px}
.person .n .tag.fam{color:var(--plum);border-color:rgba(166,134,181,.4)}
.person .n .tag.par{color:var(--amber);border-color:rgba(217,164,91,.4)}
.person .n .tag.chi{color:var(--sage);border-color:rgba(132,165,145,.4)}
.person .meta{font-size:11.5px;color:var(--ink3);margin:2px 0 6px;line-height:1.4}
.person .meta .dead{color:var(--rust)}
.person .relbar{height:3px;background:#2a2520;border-radius:2px;overflow:hidden}
.person .relbar i{display:block;height:100%;border-radius:2px;transition:width .4s}
.person .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.person .acts button{font:inherit;font-size:11.5px;padding:5px 10px;border-radius:5px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;transition:.15s}
.person .acts button:hover:not(:disabled){border-color:var(--amber2);color:var(--amber)}
.person .acts button:disabled{opacity:.3;cursor:not-allowed}
.person .acts button.pri{border-color:var(--amber2);color:var(--amber)}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:8px;overflow-x:auto}
.tabs button{font:inherit;font-size:12.5px;padding:8px 11px;border:0;background:none;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;white-space:nowrap}
.tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
.tabs button .cnt{font-size:10.5px;color:var(--ink3);margin-left:3px}
.empty{color:var(--ink3);font-size:12.5px;padding:22px 0;text-align:center}
.acts-list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.acts-list .it:last-child{border-bottom:0}
.acts-list .it:hover:not(.off){padding-left:4px}
.acts-list .it.off{opacity:.35;cursor:not-allowed}
.acts-list .it .l{flex:1;min-width:0}
.acts-list .it .nm{font-size:13px;color:var(--ink)}
.acts-list .it .ds{font-size:11.5px;color:var(--ink3);margin-top:1px}
.acts-list .it .dg{font-size:11.5px;color:var(--amber);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;line-height:1.35}
.acts-list .it .dg .w{color:var(--rust)}
input[type=number],input[type=text]{width:100%;padding:10px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font-size:14px;font-family:inherit;outline:none;margin:8px 0;font-variant-numeric:tabular-nums}
input:focus{border-color:var(--amber2)}
.note{font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.6}
.origin{padding:12px 14px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;transition:.15s;background:var(--bg2)}
.origin:hover{border-color:var(--amber2);background:rgba(217,164,91,.06)}
.origin .h{font-size:14px;color:var(--ink);font-weight:700;margin-bottom:3px;font-family:"Songti TC",serif;letter-spacing:.5px}
.origin .d{font-size:11.5px;color:var(--ink3);margin-bottom:6px}
.origin .b{font-size:11.5px;color:var(--amber)}
.origins{display:flex;flex-direction:column;gap:8px}
.gsel{display:flex;gap:8px;margin-bottom:14px}
.gsel button{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;transition:.15s}
.gsel button.on{border-color:var(--amber2);color:var(--amber);background:rgba(217,164,91,.1)}
.bizstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bizstat .b{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.bizstat .b .l{font-size:10.5px;color:var(--ink3)}
.bizstat .b .v{font-size:13px;color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
.biz-card{padding:12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg2);margin-bottom:8px}
.biz-card .t{font-size:13.5px;color:var(--ink);font-weight:600;margin-bottom:4px}
.biz-card .m{font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.asset-card{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.asset-card:last-child{border-bottom:0}
.asset-card .l{flex:1}
.asset-card .nm{color:var(--ink);font-weight:600}
.asset-card .ds{color:var(--ink3);font-size:11px;margin-top:2px}
.asset-card .v{color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap;margin-right:4px}
.asset-card button{font:inherit;font-size:11px;padding:4px 8px;border-radius:4px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer}
.asset-card button:hover{border-color:var(--amber2);color:var(--amber)}
.cat-title{font-size:12px;color:var(--ink3);letter-spacing:1px;margin:12px 0 4px;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.cat-title:first-child{margin-top:0}
.sec{font-size:13px;color:var(--ink);margin:14px 0 8px;font-family:"Songti TC",serif;font-weight:700}
.prop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.prop-box{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.prop-box .k{font-size:11px;color:var(--ink3);display:block}
.prop-box .v{font-size:13.5px;color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;display:block}
.prop-box .v.neg{color:var(--rust)}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);background:var(--card2);border:1px solid var(--line2);color:var(--ink);padding:10px 18px;border-radius:7px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:84vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.ms-card{border-radius:10px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;border:1px solid var(--line2)}
.ms-card.news{background:linear-gradient(135deg,#28221c,#181512);border-color:var(--amber2);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.ms-card.news .ms-tag{display:inline-block;background:var(--rust);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:1px;margin-bottom:8px}
.ms-card.news .ms-head{font-family:"Songti TC",serif;font-size:19px;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:8px;border-bottom:1px solid var(--line2);padding-bottom:8px}
.ms-card.cert{background:linear-gradient(135deg,#1d2621,#151a17);border:1.5px solid var(--sage)}
.ms-card.cert .ms-tag{display:inline-block;background:rgba(132,165,145,.2);color:var(--sage);border:1px solid var(--sage);font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:1px;margin-bottom:8px}
.ms-card.cert .ms-head{font-family:"Songti TC",serif;font-size:18px;font-weight:700;color:#d6ebe0;line-height:1.35;margin-bottom:8px}
.ms-card.court{background:linear-gradient(135deg,#2b1a18,#191312);border:1.5px solid var(--rust)}
.ms-card.court .ms-tag{display:inline-block;background:var(--rust);color:#151311;font-size:10px;font-weight:800;padding:2px 8px;border-radius:3px;letter-spacing:1px;margin-bottom:8px}
.ms-card.court .ms-head{font-family:"Songti TC",serif;font-size:18px;font-weight:700;color:#f0b8ae;line-height:1.35;margin-bottom:8px}
.ms-card.gold{background:linear-gradient(135deg,#2e2416,#1b1712);border:1.5px solid var(--amber)}
.ms-card.gold .ms-tag{display:inline-block;background:rgba(217,164,91,.22);color:var(--amber);border:1px solid var(--amber);font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:1px;margin-bottom:8px}
.ms-card.gold .ms-head{font-family:"Songti TC",serif;font-size:18.5px;font-weight:700;color:#f5d59b;line-height:1.35;margin-bottom:8px}
.ms-card .ms-body{font-size:13px;color:var(--ink2);line-height:1.65}
.ms-card .ms-foot{margin-top:10px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.12);font-size:11px;color:var(--ink3);display:flex;justify-content:space-between}
@media(max-width:400px){.hud-bars{width:105px}.profile-card{grid-template-columns:1fr}.p-meta{border-right:0;border-bottom:1px solid var(--line);padding-bottom:6px;padding-right:0}}
</style>
</head>
<body>
<div id="app">
  <header class="hud-top">
    <div class="hud-bars" id="hudBars"></div>
    <div class="hud-mid">
      <div class="yr"><span id="ageNum">0</span> 歲</div>
      <div class="era" id="eraTxt">乾隆年間 · 九州天下</div>
      <div class="loc" id="hudLoc" onclick="openTravelModal()">📍 順天府（京師）</div>
    </div>
    <div class="hud-right">
      <div style="display:flex;align-items:center;gap:6px">
        <div class="hud-cash" id="purseCash"><span id="moneyTxt">0 兩</span></div>
        <button class="reset" id="resetBtn" title="重開一世">↺</button>
      </div>
      <div id="purseDebt" style="display:none;font-size:10.5px;color:var(--rust)">欠債 <b id="debtTxt">0</b> 兩</div>
      <div class="hud-ap">精力 <b><span id="apTxt">8</span>/<span id="apMax">8</span></b></div>
    </div>
  </header>

  <div class="fam-strip" id="famStrip"></div>

  <div class="profile-card">
    <div class="p-meta" id="pMeta"></div>
    <div class="p-bars" id="pBars"></div>
  </div>

  <div class="diary" id="diary"></div>

  <div class="nav-dock">

let S,_prev={},_prevAgeShown,_prevMoneyShown,_uid=1,_relTab='fam',_sv;
const uid=()=>_uid++;
const absentP=(role,g)=>({id:uid(),name:'—',gender:g,age:0,rel:0,alive:false,role,job:null,absent:true});

function blankState(){return{
  name:'',gender:'M',orientation:'hetero',origin:'commoner',isBanner:false,startEraIdx:3,age:0,
  money:0,mood:74,health:90,iq:50,eq:50,moral:55,renown:0,
  ap:8,maxAp:8,apps:5,
  eduLevel:0,eduName:'一介布衣（平民）',inSchool:false,studyProg:0,
  job:null,salary:0,jobYears:0,
  soldier:null, // {rankIndex, yearsServed, yir, merit, kills, injured}
  civil:null,
  prison:null,crimeRecord:[],
  businesses:[],assets:{houses:[],cars:[]},
  deposit:0,debt:0,cpi:1,landIdx:1,lifestyle:1,home:'parents',
  region:'suzhou',welfare:{charityGrain:false,forged:false},
  illness:null,cured:false,married:false,partner:null,will:null,
  originPay:true,parentWealth:0,
  people:{dad:absentP('父親','M'),mom:absentP('母親','F'),siblings:[],friends:[],children:[]},
  logs:[],over:false,retired:false,lastYear:null,ach:{},
}}

function log(text,cls=''){S.logs.unshift({age:S.age,text,cls});if(S.logs.length>200)S.logs.length=200}
function snap(){return{mood:S.mood,health:S.health,iq:S.iq,eq:S.eq,moral:S.moral}}
function ensureSiblingsArr(){if(!S.people.siblings)S.people.siblings=[]}
function sibRoleLabel(sb){const older=sb.age>=S.age;return sb.gender==='M'?(older?'兄長':'胞弟'):(older?'姊姊':'胞妹')}
function parentsAlive(){return[S.people.dad,S.people.mom].some(p=>p&&!p.absent&&p.alive)}
function hasChildUnder(n){return S.people.children.some(c=>c.alive&&c.age<n)}

function normalize(){
  S.mood=clamp(S.mood,0,100);S.health=clamp(S.health,0,100);S.iq=clamp(S.iq,0,100);S.eq=clamp(S.eq,0,100);S.moral=clamp(S.moral,0,100);
  if(S.money<0){S.debt+=Math.round(-S.money);S.money=0}
  S.deposit=Math.max(0,S.deposit);S.debt=Math.max(0,S.debt);S.renown=clamp(S.renown,0,100);
  const p=S.people;
  [p.dad,p.mom].forEach(x=>{if(x&&!x.absent)x.rel=clamp(x.rel,0,100)});
  (p.siblings||[]).forEach(x=>x.rel=clamp(x.rel,0,100));
  p.friends.forEach(f=>f.rel=clamp(f.rel,0,100));
  p.children.forEach(c=>c.rel=clamp(c.rel,0,100));
  if(S.partner)S.partner.rel=clamp(S.partner.rel,0,100);
}

function netWorth(){
  const h=S.assets.houses.reduce((a,x)=>a+x.price,0);
  const c=S.assets.cars.reduce((a,x)=>a+x.price,0);
  const b=S.businesses.reduce((a,x)=>a+bizValue(x),0);
  return Math.round(S.money+S.deposit+h+c+b-S.debt);
}
const bizValue=c=>{
  const licVal=((c.licenses&&c.licenses.piaohao)?3000:0)+((c.licenses&&c.licenses.hong)?5000:0)+((c.licenses&&c.licenses.salt)?1500:0);
  return Math.round(licVal+Math.max(c.capital*(0.7+(c.rd||0)*0.2),(c.lastProfit>0?c.lastProfit*3.5:0)));
};

function currentPositionName(){
  if(S.soldier)return SOLDIER_RANKS[S.soldier.rankIndex].name;
  if(S.civil)return S.civil.rank.name;
  if(S.job)return S.job.name;
  if(S.retired)return'告老還鄉';
  if(S.eduLevel>0)return S.eduName;
  return S.age<14?'蒙童少年':'自由百姓';
}

/* ══════ 開局與繼承 ══════ */
function newGameWithOrigin(origin,inh,forcedGender,forcedOri){
  const g=inh?inh.gender:(forcedGender||'M');
  const ori=inh?(inh.orientation||'hetero'):(forcedOri||'hetero');
  const base=inh?ORIGINS[3]:(ORIGINS.find(o=>o.id===origin)||ORIGINS[3]);
  const isBan=inh?!!inh._isBanner:!!base.isBanner;
  const me=inh?{name:inh.name,surname:inh.name.charAt(0)}:randPerson(g,isBan);
  S=blankState();_uid=100;_q.length=0;
  S.name=me.name;S.gender=g;S.orientation=ori;S.origin=inh?'inherit':base.id;S.isBanner=isBan;
  S.startEraIdx=inh?(inh._eraIdx??3):pick([1,2,3,4,5]);
  S.region=inh?(inh._region||'suzhou'):(base.id==='banner'?pick(['peking','shengjing']):base.id==='scholar'?pick(['suzhou','hangzhou','xinan']):base.id==='merchant'?pick(['tianjin','guangzhou','wuchang']):base.id==='wanderer'?pick(['chengdu','wuchang','fuzhou']):pick(REGIONS).id);
  const orphan=!inh&&base.dadJob===null;
  if(inh){
    if(inh._dad)S.people.dad={...inh._dad,id:uid(),role:'父親'};
    if(inh._mom)S.people.mom={...inh._mom,id:uid(),role:'母親'};
  }else if(!orphan){
    S.people.dad={id:uid(),name:me.surname+pick(NAME_M),gender:'M',age:ri(25,38),rel:base.dadRel,alive:true,role:'父親',job:base.dadJob};
    S.people.mom={id:uid(),name:pick(SURNAME_HAN)+pick(NAME_F),gender:'F',age:ri(23,35),rel:base.momRel,alive:true,role:'母親',job:base.momJob};
  }
  S.money=inh?Math.round(inh._money||0):base.money;
  S.health=inh?clamp(92-Math.max(0,inh._age-30)*0.7,45,95):base.health;
  S.iq=inh?58:base.iq;S.eq=inh?58:base.eq;S.moral=inh?60:base.moral;S.mood=75;
  if(isBan){S.eduName='八旗子弟';S.renown=8;}
  S.parentWealth=orphan?0:base.wealth;
  S.originPay=!orphan&&base.pay;
  S.home=orphan&&!inh?'rent':'parents';

  if(inh){
    S.age=inh._age;S.cpi=inh._cpi||1;S.landIdx=inh._landIdx||1;
    S.assets.houses=(inh._houses||[]).map(h=>({...h}));
    S.deposit=Math.round(inh._deposit||0);
    S.businesses=(inh._biz||[]).map(b=>({...b,id:uid()}));
    if(inh._partner){S.partner={...inh._partner,id:uid()};S.married=true;}
    if(inh._children)S.people.children=inh._children.map(ch=>({...ch,id:uid()}));
    if(inh._siblings)S.people.siblings=inh._siblings.map(sb=>({...sb,id:uid(),role:sibRoleLabel(sb)}));
    log(`你以${S.name}（${S.age}歲）之身承繼門戶，繼承紋銀 ${fmt(S.money)}、田產房屋 ${S.assets.houses.length} 處、商號 ${S.businesses.length} 間。`,'big');
  }else if(orphan){
    log(`你在【${getRegion(S.region).name.split('（')[0]}】街頭孤身一人長大，吃百家飯穿百家衣，卻練就一身機靈與膽識。`,'big');
  }else{
    const r=Math.random();const cnt=r<0.50?0:(r<0.88?1:2);
    for(let k=0;k<cnt;k++){
      const sg=Math.random()<.5?'M':'F';
      const sb={id:uid(),name:me.surname+(sg==='M'?pick(NAME_M):pick(NAME_F)),gender:sg,age:ri(2,8),rel:ri(70,86),alive:true,job:null};
      sb.role=sibRoleLabel(sb);S.people.siblings.push(sb);
    }
    const sibStr=S.people.siblings.length?`家中還有${S.people.siblings.map(x=>`${x.role}${x.name}（${x.age}歲）`).join('、')}。`:'你是家中獨子／獨女。';
    log(`你降生於【${getRegion(S.region).name.split('（')[0]}】的${base.name}。父親${S.people.dad.name}（${S.people.dad.job}），母親${S.people.mom.name}。${sibStr}`,'big');
  }
  closeSheet();normalize();render();_prev=snap();
}

  $('famStrip').innerHTML=nodes.join('');

  `;

  $('pBars').innerHTML=[

/* ══════ 彈窗與視覺卡片 ══════ */
function sheet({title,body,buttons,onMount,closable=true}){
  const ov=$('ov');
  ov.innerHTML=`<div class="sheet"><h2>${title}</h2><div class="body">${body}</div><div class="btnrow"></div></div>`;
  const row=ov.querySelector('.btnrow');
  (buttons||[{text:'合上'}]).forEach(b=>{
    const el=document.createElement('button');el.textContent=b.text;if(b.cls)el.className=b.cls;if(b.disabled)el.disabled=true;
    el.onclick=()=>{const keep=b.onClick?b.onClick()===true:false;if(!keep)closeSheet()};
    row.appendChild(el);
  });
  ov.classList.add('show');document.body.classList.add('locked');
  ov.onclick=e=>{if(e.target===ov&&closable)closeSheet()};
  if(onMount)onMount();
}
function closeSheet(){$('ov').classList.remove('show');$('ov').innerHTML='';document.body.classList.remove('locked');setTimeout(flushQueue,160)}

function openJobAndStudyModal(){
  const byCat={};
  JOBS.forEach(j=>{(byCat[j.cat]=byCat[j.cat]||[]).push(j)});
  const nextEx=EXAMS.find(e=>e.level===S.eduLevel+1);
  const canExam=nextEx&&S.age>=nextEx.minAge&&S.iq>=nextEx.needIq&&S.money>=nextEx.fee&&S.ap>=1;

  let jobsHtml='';
  ['軍旅','平民農漁','市井手藝','梨園江湖','醫道算命','市井商賈','文教幕僚','朝廷文官','自立營商'].forEach(cat=>{
    if(!byCat[cat])return;
    jobsHtml+=`<div class="cat-title">${cat}</div>`;
    byCat[cat].forEach(j=>{
      let blk='';
      if(S.age<14)blk='未滿 14 歲';
      else if(S.eduLevel<j.needEdu)blk=`需功名 Lv.${j.needEdu}`;
      else if(j.minHealth&&S.health<j.minHealth)blk=`健康需 ${j.minHealth}`;
      else if(j.minIq&&S.iq<j.minIq)blk=`才學需 ${j.minIq}`;
      else if(j.minEq&&S.eq<j.minEq)blk=`世故需 ${j.minEq}`;
      else if(j.startup&&S.money<120)blk='起家需 120 兩';
      jobsHtml+=`<div class="it ${blk?'off':''}" data-jid="${j.id}">
        <div class="l"><div class="nm">${j.name}</div><div class="ds">${j.startup?'開茶館、作坊、當舖或票號（本銀 120 兩起）':j.isSoldier?'從普通守兵／戰兵做起，立戰功可一路升為官兵將領！':`年收約 ${fmt(j.y*S.cpi)}`}</div></div>
        <div class="dg">${blk?`<span class="w">${blk}</span>`:'入行'}</div>
      </div>`;
    });
  });

  const html=`
    <p style="font-size:12px;color:var(--ink3);margin-bottom:8px">在大清天下，你既可以做一名踏實的普通百姓、手藝人、戲子、鏢師，也可以投軍吃糧從普通士兵做起，或者寒窗苦讀走科舉仕途！</p>
    <div class="acts-list" id="qAllJobs">${jobsHtml}</div>
    <div class="sec">📖 科舉功名（可選之路 · 當前：${S.eduName}）</div>
    <div class="btnrow" style="margin-top:0">
      <button id="btnStudyQing" ${S.ap<1?'disabled':''}>🕯️ 讀書識字 (-1精力 · +才學)</button>
      <button id="btnTakeExam" ${!canExam?'disabled':''}>${nextEx?`✍️ 赴考【${nextEx.name}】(${fmt(nextEx.fee)})`:'🏆 已金榜題名'}</button>
    </div>`;

  sheet({title:'🏮 九州百業謀生與軍旅科舉',body:html,buttons:[{text:'合上'}],onMount(){
    $('btnStudyQing').onclick=()=>{
      if(S.ap<1)return toast('精力不足');
      S.ap--;S.iq+=ri(3,5);S.studyProg=Math.min(10,S.studyProg+2);S.mood-=1;
      log(`你抽空研讀詩書，才學增至 ${Math.round(S.iq)}（備考進度 ${S.studyProg}/10）。`,'good');
      normalize();render();openJobAndStudyModal();
    };
    const exBtn=$('btnTakeExam');
    if(exBtn)exBtn.onclick=()=>{
      if(!canExam)return;
      S.ap--;S.money-=nextEx.fee;
      const chance=clamp(0.24+S.studyProg*0.055+(S.iq-nextEx.needIq)*0.015+(S.origin==='scholar'?0.12:0),0.12,0.92);
      if(Math.random()<chance){
        S.eduLevel=nextEx.level;S.eduName=nextEx.title;S.studyProg=0;S.renown+=nextEx.level*7;S.mood+=22;
        if(nextEx.level===4)S.eduName=pick(['狀元及第','榜眼及第','探花及第','二甲進士']);
        log(`🎉 捷報傳來！你通過【${nextEx.name}】，高中【${S.eduName}】！`,'big');
        closeSheet();normalize();render();
        if(nextEx.level>=2)showMilestoneCard({theme:'gold',tag:'大清禮部捷報',headline:`${S.name}高中【${S.eduName}】！`,body:`十年寒窗一舉成名，捷報傳遍九州鄉里！`});
      }else{
        S.mood-=8;log(`你在【${nextEx.name}】中名落孫山，未能中榜。`,'bad');
        normalize();render();openJobAndStudyModal();
      }
    };
    $('qAllJobs').addEventListener('click',e=>{
      const it=e.target.closest('.it');if(!it||it.classList.contains('off'))return;
      const j=JOBS.find(x=>x.id===it.dataset.jid);if(!j)return;
      if(j.startup){closeSheet();startBusiness();return;}
      if(S.apps<=0)return toast('今年求職次數已用盡');
      S.apps--;
      if(j.isSoldier){
        const startIdx=S.isBanner?2:0; // 八旗子弟起步為伍長，普通百姓從普通守兵做起
        S.soldier={rankIndex:startIdx,yearsServed:0,yir:0,merit:startIdx*25,battles:0};
        S.salary=Math.round(SOLDIER_RANKS[startIdx].m*S.cpi);
        log(`⚔️ 你前往【${getRegion(S.region).name.split('（')[0]}】兵營報名投軍，正式成為一名【${SOLDIER_RANKS[startIdx].name}】，年餉紋銀 ${fmt(S.salary)}！`,'big');
      }else if(j.isCivil){
        const rIdx=S.eduLevel>=4?2:(S.eduLevel>=3?1:0);
        S.civil={rank:{...CIVIL_RANKS[rIdx]},rankIndex:rIdx,yir:0,score:70,treasury:5000,approval:68};
        S.salary=Math.round(CIVIL_RANKS[rIdx].m*S.cpi);
        log(`🏛️ 你獲吏部掣籤授官，出任【${CIVIL_RANKS[rIdx].name}】，年俸紋銀 ${fmt(S.salary)}！`,'big');
      }else{
        S.job=j;S.jobYears=0;S.salary=Math.round(j.y*S.cpi);
        log(`你開始以【${j.name}】為生，每年進項約紋銀 ${fmt(S.salary)}。`,'big');
      }
      closeSheet();normalize();render();
    });
  }});
}

function openCareerModal(){
  // 1. 士兵／官兵軍旅面板（支援從普通士兵一步步立戰功升為官兵將領！）
  if(S.soldier){
    const m=S.soldier;const rk=SOLDIER_RANKS[m.rankIndex];
    const nextRk=SOLDIER_RANKS[m.rankIndex+1];
    const isOfficer=m.rankIndex>=3; // 把總以上正式成為「官兵」武官
    const html=`
      <div class="bizstat">
        <div class="b"><div class="l">軍中身分</div><div class="v" style="font-size:11.5px">${rk.name}</div></div>
        <div class="b"><div class="l">年餉銀兩</div><div class="v">${fmt(S.salary)}</div></div>
        <div class="b"><div class="l">累積戰功</div><div class="v">${m.merit} 分${nextRk?` (下階需${nextRk.meritNeed})`:''}</div></div>
        <div class="b"><div class="l">軍旅年資 / 身分</div><div class="v">${m.yearsServed}年 · ${isOfficer?'朝廷官兵':'普通士兵'}</div></div>
      </div>
      <p class="note" style="margin-top:0;margin-bottom:8px">${rk.desc}</p>
      <div class="sec">⚔️ 軍營操練與出征立功（消耗 1 精力）</div>
      <div class="btnrow" style="margin-top:0">
        <button data-sol="drill" class="pri" ${S.ap<1?'disabled':''}>🏹 校場操練弓馬火器 (+戰功/健康)</button>
        <button data-sol="mission" class="pri" ${S.ap<1?'disabled':''}>🔥 奉命剿匪／平叛／海防巡哨 (+大量戰功/賞銀)</button>
        <button data-sol="guard" ${S.ap<1?'disabled':''}>🛡️ 駐守城門關隘當差 (+微薄賞錢)</button>
      </div>
      ${isOfficer?`<div class="sec">⚠️ 官兵將領暗盤</div><div class="btnrow" style="margin-top:0"><button data-sol="skimp" class="warn">💸 剋扣兵餉／虛報兵額</button></div>`:''}`;
    sheet({title:isOfficer?'🎖️ 大清官兵將領軍帳':'⚔️ 大清軍營士兵名冊',body:html,buttons:[
      {text:'解甲歸田（退伍回鄉）',cls:'warn',onClick:()=>{S.soldier=null;S.salary=0;log('你卸下盔甲兵器，解甲歸田做回普通百姓。','big');normalize();render()}},
      {text:'合上'}
    ],onMount(){
      document.querySelectorAll('[data-sol]').forEach(b=>{b.onclick=()=>{
        const op=b.dataset.sol;
        if(op==='skimp'){
          const gain=Math.round(ri(80,600)*S.cpi);S.money+=gain;S.moral-=15;
          log(`你暗中剋扣麾下士兵糧餉 ${fmt(gain)} 入私囊！`,'bad');
          if(Math.random()<0.28){closeSheet();goPrison('剋扣軍餉及激起兵變重罪',ri(4,10),gain*1.5);normalize();render();return;}
          normalize();render();openCareerModal();return;
        }
        if(S.ap<1)return toast('精力不足');
        S.ap--;
        if(op==='drill'){
          const g=ri(6,12);m.merit+=g;S.health+=3;
          log(`你在校場頂著烈日苦練刀槍弓箭，體魄更健，戰功 +${g}！`,'good');
        }else if(op==='guard'){
          const tip=Math.round(ri(3,10)*S.cpi);S.money+=tip;m.merit+=4;S.eq+=1;
          log(`你在城門盤查往來商旅，得過路茶水錢 ${fmt(tip)}，戰功 +4。`);
        }else if(op==='mission'){
          m.battles++;
          const winProb=clamp(0.48+(S.health-50)*0.004+(S.iq-50)*0.002+m.rankIndex*0.02,0.35,0.88);
          if(Math.random()<winProb){
            const g=ri(18,35);const prize=Math.round(ri(15,80)*(1+m.rankIndex*0.4)*S.cpi);
            m.merit+=g;S.money+=prize;S.renown+=3;
            const foes=['南海海盜','川楚白蓮教匪','西北馬賊','太湖水寇'];
            log(`⚔️ 捷報！你隨軍清剿「${pick(foes)}」奮勇殺敵，立下戰功 +${g}，獲頒賞銀 ${fmt(prize)}！`,'big');
          }else{
            const inj=ri(8,18);S.health-=inj;m.merit+=5;
            log(`🩸 戰事慘烈！你在陣前搏殺負傷（健康 −${inj}），所幸大難不死，記戰功 +5。`,'bad');
          }
        }
        // 檢查是否達成晉升條件（從普通士兵一路晉升為官兵將領！）
        if(nextRk&&m.merit>=nextRk.meritNeed){
          m.rankIndex++;S.salary=Math.round(SOLDIER_RANKS[m.rankIndex].m*S.cpi);S.mood+=18;S.renown+=5;
          const becameOfficer=m.rankIndex===3;
          log(`🎖️ 軍功累積達標！你獲主帥保舉，正式晉升為【${SOLDIER_RANKS[m.rankIndex].name}】${becameOfficer?'，從普通士兵一躍成為朝廷命官「官兵」將領！':'！'}`,'big');
          if(becameOfficer||m.rankIndex===8){
            closeSheet();normalize();render();
            showMilestoneCard({theme:'gold',tag:'兵部軍功捷報',headline:`${S.name} 戰功彪炳，晉升【${SOLDIER_RANKS[m.rankIndex].name}】！`,body:becameOfficer?'從一介普通守兵在刀光劍影中拼殺而出，正式授朝廷武官銜，光宗耀祖！':'執掌一省水陸兵馬，威震九州！'});
            return;
          }
        }
        normalize();render();openCareerModal();
      }});
    }});
    return;
  }

  // 2. 文官衙門面板
  if(S.civil){
    const c=S.civil;const rk=CIVIL_RANKS[c.rankIndex];
    const unitCost=Math.round((c.rankIndex+1)*350*S.cpi);
    const html=`
      <div class="bizstat">
        <div class="b"><div class="l">現任官職</div><div class="v" style="font-size:12px">${rk.name}</div></div>
        <div class="b"><div class="l">年俸（含養廉銀）</div><div class="v">${fmt(S.salary)}</div></div>
        <div class="b"><div class="l">官庫銀兩</div><div class="v">${fmt(c.treasury)}</div></div>
        <div class="b"><div class="l">百姓口碑 / 政績</div><div class="v">${Math.round(c.approval)}% / ${Math.round(c.score)}</div></div>
      </div>
      <div class="btnrow">
        <button data-off="judge" class="pri" ${S.ap<1?'disabled':''}>🔨 升堂斷案 (+口碑/政績)</button>
        <button data-off="water" ${S.ap<1||c.treasury<unitCost?'disabled':''}>🌊 興修水利 (${fmt(unitCost)})</button>
        <button data-off="embezzle" class="warn" ${c.treasury<unitCost?'disabled':''}>💸 貪墨庫銀</button>
      </div>`;
    sheet({title:'🏛️ 衙門理政',body:html,buttons:[
      {text:'辭官歸隱',cls:'warn',onClick:()=>{S.civil=null;S.salary=0;log('你掛冠辭官，回歸平民生活。','bad');normalize();render()}},
      {text:'合上'}
    ],onMount(){
      document.querySelectorAll('[data-off]').forEach(b=>{b.onclick=()=>{
        const op=b.dataset.off;
        if(op==='embezzle'){
          const steal=Math.round(Math.min(c.treasury*0.3,ri(300,2000)*S.cpi));
          c.treasury-=steal;S.money+=steal;S.moral-=18;
          log(`你暗中截留庫銀 ${fmt(steal)} 入私囊……`,'bad');
          if(Math.random()<0.30){closeSheet();goPrison('貪墨庫銀重罪（都察院參奏拿問）',ri(5,12),steal*1.5);normalize();render();return;}
          normalize();render();openCareerModal();return;
        }
        if(S.ap<1)return toast('精力不足');
        S.ap--;
        if(op==='judge'){c.score=clamp(c.score+8,0,100);c.approval=clamp(c.approval+7,0,100);S.moral+=2;log('你公正斷案，百姓稱頌！','good');}
        else{c.treasury-=unitCost;c.score=clamp(c.score+10,0,100);c.approval=clamp(c.approval+9,0,100);log('你撥款修築水利堤防，民生大安！','good');}
        normalize();render();openCareerModal();
      }});
    }});
    return;
  }

  // 3. 普通百業生計面板（農夫、手藝人、戲班、鏢師、郎中、說書人等）
  const j=S.job;
  const actLabel=j.cat==='平民農漁'?'🌾 下田辛勤耕作／出海捕魚':j.cat==='梨園江湖'?'🎭 登台獻藝／走鏢護送':j.cat==='醫道算命'?'🌿 坐堂施診／擺攤測字':'🔨 精進手藝多接活計';
  sheet({title:`💼 平民生計：${j.name}`,body:`<p>你是一名 <b>${j.name}</b>（${j.cat}），已從業 <b>${S.jobYears} 年</b>，年進項約 <b>${fmt(S.salary)}</b>。</p><p class="note">在市井民間勤懇營生，雖無官袍加身，卻也自在安樂、積少成多！</p><div class="btnrow"><button id="btnWorkHard" class="pri" ${S.ap<1?'disabled':''}>${actLabel} (-1精力 · 賺外快)</button><button id="btnQuitJob" class="warn">改行（重新擇業／投軍／趕考）</button></div>`,buttons:[{text:'合上'}],onMount(){
    $('btnWorkHard').onclick=()=>{
      if(S.ap<1)return toast('精力不足');
      S.ap--;
      const ex=Math.round(S.salary*rnd(0.20,0.45));
      S.money+=ex;S.jobYears+=0.5;
      if(j.cat==='梨園江湖')S.renown+=2;
      if(j.cat==='平民農漁')S.health+=1;
      log(`你勤懇幹活（${actLabel.replace(/^[^\s]+\s/,'')}），額外賺得銀兩 ${fmt(ex)}！`,'good');
      normalize();render();openCareerModal();
    };
    $('btnQuitJob').onclick=()=>{S.job=null;S.salary=0;log(`你辭去了「${j.name}」的營生，準備另謀出路。`);closeSheet();normalize();render()};
  }});
}

/* ══════ 家產、商號、宗族、九州地方、刑部大牢與年度推進 ══════ */
let _wTab='bank';
function openWealthHub(tab){
  if(S.age<14)return toast('年滿 14 歲後方可掌管銀兩家產');
  if(S.over)return;
  if(tab)_wTab=tab;
  const nav=`<div class="tabs" style="margin:-6px 0 12px">
    <button data-wt="bank" class="${_wTab==='bank'?'on':''}">🏦 銀號借貸</button>
    <button data-wt="land" class="${_wTab==='land'?'on':''}">🏡 田產房屋</button>
    <button data-wt="biz" class="${_wTab==='biz'?'on':''}">🏮 商號行棧(${S.businesses.length})</button>
  </div>`;
  const reg=getRegion(S.region);
  let body='';
  if(_wTab==='bank'){
    const maxLoan=Math.max(0,Math.round(((S.salary||60)*2+netWorth()*0.25)*S.cpi)-S.debt);
    body=`
      <div class="prop-grid">
        <div class="prop-box"><span class="k">🪙 隨身紋銀</span><span class="v">${fmt(S.money)}</span></div>
        <div class="prop-box"><span class="k">💎 家產總值</span><span class="v">${fmt(netWorth())}</span></div>
        <div class="prop-box"><span class="k">🏦 銀號存銀 (年息2分)</span><span class="v">${fmt(S.deposit)}</span></div>
        <div class="prop-box"><span class="k">📉 印子錢欠債 (年息8分)</span><span class="v ${S.debt>0?'neg':''}">${fmt(S.debt)}</span></div>
      </div>
      <input type="number" id="wAmt" placeholder="輸入銀兩數目" min="1" inputmode="numeric">
      <div class="btnrow" style="margin-top:4px">
        <button data-wa="dep" class="pri">存入銀號</button>
        <button data-wa="wd">提取存銀</button>
        <button data-wa="loan" ${maxLoan<=0?'disabled':''}>借貸周轉 (上限${fmt(maxLoan)})</button>
        ${S.debt>0?'<button data-wa="repay" class="warn">償還欠債</button>':''}
      </div>
      <div class="btnrow">
        <button data-wa="will">${S.will?'修改分家遺囑':'立分家遺囑'}</button>
        <button data-wa="rob_pawn" class="warn" ${S.ap<1?'disabled':''}>🎭 蒙面打劫大當舖 (-1精力)</button>
      </div>`;
  }else if(_wTab==='land'){
    const hList=S.assets.houses.length?S.assets.houses.map((h,i)=>`<div class="asset-card"><div class="l"><div class="nm">${h.name}</div><div class="ds">${h.isFarm?'年收田租 '+fmt(h.price*0.06):(h.rented?'出租收銀 '+fmt(h.price*0.04):'自住宅院')}</div></div><div class="v">${fmt(h.price)}</div>${!h.isFarm?`<button data-rh="${i}">${h.rented?'改自住':'出租'}</button>`:''}<button data-sh="${i}">變賣</button></div>`).join(''):'<div class="empty" style="padding:10px">名下尚無田產房屋</div>';
    const cList=S.assets.cars.length?S.assets.cars.map((c,i)=>`<div class="asset-card"><div class="l"><div class="nm">${c.name}</div><div class="ds">年養護銀 ${fmt(c.cost*S.cpi)}</div></div><div class="v">${fmt(c.price)}</div><button data-sc="${i}">變賣</button></div>`).join(''):'<div class="empty" style="padding:10px">名下尚無騾馬船隻</div>';
    body=`
      <div class="sec" style="margin-top:0">🏡 置辦田產與房屋（當前地段：${reg.name.split('（')[0]}）</div>
      ${hList}
      <div class="btnrow" style="margin-top:8px">${HOUSE_TYPES.map(h=>{const pr=Math.round(h.price*S.landIdx*reg.landMod);return `<button data-bh="${h.id}" ${S.money<pr?'disabled':''}>${h.name} (${fmt(pr)})</button>`}).join('')}</div>
      <div class="sec">🐎 騾馬官轎與海船</div>
      ${cList}
      <div class="btnrow" style="margin-top:8px">${CAR_TYPES.map(c=>{const pr=Math.round(c.price*S.cpi);return `<button data-bc="${c.id}" ${S.money<pr?'disabled':''}>${c.name} (${fmt(pr)})</button>`}).join('')}</div>
      <div class="sec">🍵 日常排場用度</div>
      <div class="btnrow" style="margin-top:0">${['粗茶淡飯','小康溫飽','鐘鳴鼎食'].map((n,i)=>`<button data-lf="${i}" class="${S.lifestyle===i?'on':''}">${n}</button>`).join('')}</div>`;
  }else{
    const bList=S.businesses.length?S.businesses.map((c,i)=>`<div class="biz-card"><div class="t">${c.name}</div><div class="m">${c.typeName} · 經營 ${c.years} 年 · 夥計 ${c.employees.length} 人 · 去年${c.lastProfit>=0?'盈餘':'虧損'} ${fmt(Math.abs(c.lastProfit))}</div><div class="row" style="border:0;padding:4px 0"><span class="k">字號聲望 / 估值</span><span class="v">${Math.round(c.reputation)} / ${fmt(bizValue(c))}</span></div><div class="btnrow" style="margin-top:6px"><button data-bi="${i}" data-bo="manage" class="pri">掌櫃經營</button><button data-bi="${i}" data-bo="sell">盤出套現</button></div></div>`).join(''):'<div class="empty">尚未開立任何小店或商號</div>';
    body=bList+(S.businesses.length<3?`<div class="btnrow"><button id="btnNewQingBiz" class="pri">➕ 開立新茶館／作坊／商號／票號</button></div>`:'');
  }

  const redo=()=>{normalize();render();openWealthHub(_wTab)};
  sheet({title:'🪙 銀兩家產與商號',body:nav+body,buttons:[{text:'合上'}],onMount(){
    document.querySelectorAll('[data-wt]').forEach(b=>{b.onclick=()=>{_wTab=b.dataset.wt;openWealthHub(_wTab)}});
    const nb=$('btnNewQingBiz');if(nb)nb.onclick=()=>{closeSheet();startBusiness()};
    document.querySelectorAll('[data-bi]').forEach(b=>{b.onclick=()=>{
      const idx=+b.dataset.bi;const c=S.businesses[idx];if(!c)return;
      if(b.dataset.bo==='manage')manageBusiness(idx);
      else{const v=bizValue(c);S.money+=v;S.businesses.splice(idx,1);log(`你將「${c.name}」盤讓與他人，得銀 ${fmt(v)}。`,'big');redo();}
    }});
    document.querySelectorAll('[data-wa]').forEach(b=>{b.onclick=()=>{
      const a=b.dataset.wa;
      if(a==='will'){openWill();return;}
      if(a==='rob_pawn'){
        if(S.ap<1)return toast('精力不足');S.ap--;S.moral-=25;
        if(Math.random()<clamp(0.18+(S.health-50)*0.004,0.12,0.38)){
          const loot=Math.round(ri(400,2200)*S.cpi);S.money+=loot;
          log(`🚨 你夜闖${reg.name.split('（')[0]}大當舖洗劫銀庫，得手贓銀 ${fmt(loot)}！`,'big');
          closeSheet();normalize();render();
        }else{
          closeSheet();goPrison('蒙面持械劫掠當舖重罪（官府拿辦）',ri(5,12),500);normalize();render();
        }
        return;
      }
      const v=Math.floor(parseFloat($('wAmt').value));if(!v||v<=0)return toast('請輸入銀兩數目');
      if(a==='dep'){if(v>S.money)return toast('隨身紋銀不足');S.money-=v;S.deposit+=v;log(`你將 ${fmt(v)} 存入銀號。`);}
      if(a==='wd'){if(v>S.deposit)return toast('存銀不足');S.deposit-=v;S.money+=v;log(`你從銀號取出 ${fmt(v)}。`);}
      if(a==='loan'){S.money+=v;S.debt+=v;log(`你向銀號借銀 ${fmt(v)}（年息八分）。`,'bad');}
      if(a==='repay'){const x=Math.min(v,S.money,S.debt);S.money-=x;S.debt-=x;log(`你償還了 ${fmt(x)} 欠債。`,'good');}
      redo();
    }});
    document.querySelectorAll('[data-bh]').forEach(b=>{b.onclick=()=>{
      const h=HOUSE_TYPES.find(x=>x.id===b.dataset.bh);const pr=Math.round(h.price*S.landIdx*reg.landMod);
      if(S.money<pr)return toast('紋銀不足');
      S.money-=pr;S.assets.houses.push({...h,name:reg.name.split('（')[0]+h.name,price:pr,rented:false});
      if(!h.isFarm)S.home='own';
      log(`你斥資 ${fmt(pr)} 置辦了【${reg.name.split('（')[0]}${h.name}】！`,'big');redo();
    }});
    document.querySelectorAll('[data-rh]').forEach(b=>{b.onclick=()=>{const h=S.assets.houses[+b.dataset.rh];h.rented=!h.rented;redo()}});
    document.querySelectorAll('[data-sh]').forEach(b=>{b.onclick=()=>{const i=+b.dataset.sh;const h=S.assets.houses[i];const sp=Math.round(h.price*0.95);S.money+=sp;S.assets.houses.splice(i,1);log(`你變賣了「${h.name}」，得銀 ${fmt(sp)}。`);redo()}});
    document.querySelectorAll('[data-bc]').forEach(b=>{b.onclick=()=>{const c=CAR_TYPES.find(x=>x.id===b.dataset.bc);const pr=Math.round(c.price*S.cpi);if(S.money<pr)return toast('紋銀不足');S.money-=pr;S.assets.cars.push({...c,price:pr});log(`你購置了【${c.name}】，花費 ${fmt(pr)}。`,'big');redo()}});
    document.querySelectorAll('[data-sc]').forEach(b=>{b.onclick=()=>{const i=+b.dataset.sc;const c=S.assets.cars[i];S.money+=Math.round(c.price*0.85);S.assets.cars.splice(i,1);redo()}});
    document.querySelectorAll('[data-lf]').forEach(b=>{b.onclick=()=>{S.lifestyle=+b.dataset.lf;redo()}});
  }});
}

      <button data-bo="lic_hong" ${!canHong?'disabled':''}>${c.licenses.hong?'✅ 十三行行商':'捐納十三行行商 (1,800兩)'}</button>

      <button data-bo="hire" class="pri" ${S.money<30?'disabled':''}>招募夥計 (30兩)</button>

    </div>
    <div class="btnrow" style="margin-top:6px">
      <button data-bo="embezzle" class="warn" ${c.capital<300?'disabled':''}>💸 挪用字號公銀</button>
      <button data-bo="burn_ledger" class="warn" ${!c.ledgerIntact?'disabled':''}>🔥 焚毀陰陽流水帳簿</button>
    </div>`;
  sheet({title:`🏮 ${c.name}`,body:html,buttons:[{text:'返回',onClick:()=>{setTimeout(()=>openWealthHub('biz'),60);return true}},{text:'合上'}],onMount(){

      if(op==='inject'){S.money-=150;c.capital+=150;c.reputation=clamp(c.reputation+3,0,100);log(`你向「${c.name}」增資 150 兩本銀。`,'good');}
      if(op==='market'){S.money-=100;c.reputation=clamp(c.reputation+8,0,100);log(`「${c.name}」張燈結彩酬賓，聲望大增！`,'good');}
      if(op==='lic_salt'){S.money-=250;c.licenses.salt=true;log(`「${c.name}」獲鹽運使司頒發官鹽引票！`,'big');}
      if(op==='lic_piaohao'){S.money-=700;c.licenses.piaohao=true;log(`「${c.name}」獲准開辦匯兌票號！`,'big');}
      if(op==='lic_hong'){S.money-=1800;c.licenses.hong=true;S.renown+=12;log(`「${c.name}」躋身廣州十三行行商之列！`,'big');}
      if(op==='embezzle'){
        const st=Math.round(Math.min(c.capital*0.4,ri(200,1500)));c.capital-=st;S.money+=st;S.moral-=15;c.complianceRisk=(c.complianceRisk||10)+30;

      if(op==='burn_ledger'){c.ledgerIntact=false;c.complianceRisk=Math.max(5,(c.complianceRisk||10)-20);S.moral-=10;log('你深夜將舊帳冊付之一炬，銷毀了異常往來痕跡！','bad');}
      normalize();render();manageBusiness(i);
    }});
  }});
}

function companyYear(c){
  c.years++;const bt=BIZ_TYPES.find(b=>b.id===c.type)||BIZ_TYPES[0];
  let rev=bt.base*S.cpi*(1+c.employees.length*0.45)*(0.5+c.reputation/100)*Math.max(0.35,1+gauss()*0.2);
  if(c.licenses&&c.licenses.salt)rev+=450*S.cpi;
  if(c.licenses&&c.licenses.piaohao)rev+=1200*S.cpi;
  if(c.licenses&&c.licenses.hong)rev+=2500*S.cpi;
  const wages=c.employees.reduce((a,e)=>a+e.salary,0)*S.cpi;
  const profit=rev*bt.margin-bt.base*0.25*S.cpi-wages;
  c.lastProfit=profit;
  log(`【${c.name}】今年營生${profit>=0?'淨賺':'虧蝕'}紋銀 ${fmt(Math.abs(profit))}。`,profit>=0?'good':'bad');
  if(!c.ledgerIntact&&Math.random()<0.20){S.businesses=S.businesses.filter(x=>x.id!==c.id);goPrison('蓄意焚毀商號帳簿抗拒官府稽查罪',ri(2,6),500);}
  return profit;
}

function openTransferMoneyModal(personId){
  const p=findPerson(personId);if(!p||!p.alive)return;
  if(S.money<=0)return toast('隨身並無紋銀可贈');
  const label=p.role||(p===S.partner?(S.married?'正室':'紅顏'):'親友');
  const presets=[5,20,100,500].filter(v=>v<=S.money);
  const html=`
    <div class="prop-grid">
      <div class="prop-box"><span class="k">👤 受贈之人</span><span class="v" style="font-size:12.5px">${p.name}（${label}）</span></div>
      <div class="prop-box"><span class="k">🪙 隨身紋銀</span><span class="v">${fmt(S.money)}</span></div>
    </div>
    <input type="number" id="giftSilverAmt" placeholder="輸入贈送紋銀兩數" min="1" max="${S.money}" inputmode="numeric">
    ${presets.length?`<div class="btnrow" style="margin-top:0">${presets.map(v=>`<button data-pa="${v}">${fmt(v)}</button>`).join('')}<button data-pa="${S.money}">傾囊相贈</button></div>`:''}`;
  sheet({title:`💸 贈送紋銀予 ${p.name}`,body:html,buttons:[
    {text:'確認贈銀',cls:'pri',onClick:()=>{
      const amt=Math.floor(parseFloat($('giftSilverAmt').value));
      if(!amt||amt<=0||amt>S.money){toast('銀兩數目有誤');return true}
      S.money-=amt;
      const gain=clamp(Math.round(3+Math.log10(1+amt/15)*14),2,30);
      p.rel=clamp(p.rel+gain,0,100);S.moral+=1;
      if(p===S.people.dad||p===S.people.mom)S.parentWealth+=Math.round(amt*0.7);
      log(`💸 你贈予${label}${p.name}紋銀 ${fmt(amt)}，對方感激涕零，情誼 +${gain}！`,'good');
      normalize();render();setTimeout(()=>openRelations(_relTab),60);return true;
    }},
    {text:'返回',onClick:()=>{setTimeout(()=>openRelations(_relTab),60);return true}}
  ],onMount(){document.querySelectorAll('[data-pa]').forEach(b=>{b.onclick=()=>{$('giftSilverAmt').value=b.dataset.pa}})}});
}

function openRelations(tab){
  if(S.over)return;if(tab)_relTab=tab;
  ensureSiblingsArr();const p=S.people;
  const famCnt=(p.dad&&!p.dad.absent?1:0)+(p.mom&&!p.mom.absent?1:0)+p.siblings.length;
  const tabs=[{k:'fam',label:'宗族家人',n:famCnt},{k:'fri',label:'街坊同袍',n:p.friends.filter(f=>f.alive).length},{k:'par',label:'良緣伴侶',n:S.partner?1:0},{k:'chi',label:'膝下子嗣',n:p.children.length}];
  sheet({title:'🏮 宗族人倫與同袍知交',body:`<div class="tabs">${tabs.map(t=>`<button data-rt="${t.k}" class="${_relTab===t.k?'on':''}">${t.label}<span class="cnt">${t.n}</span></button>`).join('')}</div><div id="rBody"></div>`,buttons:[{text:'合上'}],onMount(){
    const draw=()=>{
      $('rBody').innerHTML=_relTab==='fam'?tabFamily():_relTab==='fri'?tabFriends():_relTab==='par'?tabPartner():tabChildren();
      document.querySelectorAll('.person .acts button').forEach(btn=>{btn.onclick=()=>handlePersonAction(btn.dataset.act,+btn.dataset.id)});
    };
    document.querySelectorAll('[data-rt]').forEach(b=>{b.onclick=()=>{_relTab=b.dataset.rt;document.querySelectorAll('[data-rt]').forEach(x=>x.classList.toggle('on',x.dataset.rt===_relTab));draw()}});
    draw();
  }});
}
function personCard({name,gender,tag,tagCls,meta,rel,acts,dead}){
  const avaCls=dead?'ava dead':(gender==='F'?'ava f':'ava');
  const col=rel>=66?'var(--sage)':rel>=33?'var(--amber)':'var(--rust)';
  return `<div class="person"><div class="${avaCls}">${dead?'—':name.charAt(0)}</div><div class="info"><div class="n">${name}${tag?`<span class="tag ${tagCls||''}">${tag}</span>`:''}</div><div class="meta">${meta}</div><div class="relbar"><i style="width:${rel}%;background:${col}"></i></div><div class="acts">${acts||''}</div></div></div>`;
}
function tabFamily(){
  ensureSiblingsArr();const p=S.people;
  const pars=[p.dad,p.mom].filter(w=>!w.absent);
  if(!pars.length&&!p.siblings.length)return '<div class="empty">父母雙親俱已不在，亦無兄弟姊妹。</div>';
  return pars.map(w=>{
    const meta=w.alive?`${w.age} 歲 · ${w.job||'居家'}`:'<span class="dead">已故</span>';
    const acts=w.alive?`<button data-act="chat" data-id="${w.id}">請安問好</button><button class="pri" data-act="transfer" data-id="${w.id}">💸 孝敬銀兩</button>${S.age<16?`<button data-act="ask" data-id="${w.id}">討零用錢</button>`:''}`:'';
    return personCard({name:w.name,gender:w.gender,tag:w.role,tagCls:'par',meta,rel:Math.round(w.rel),acts,dead:!w.alive});
  }).join('')+p.siblings.map(sb=>{
    const rl=sibRoleLabel(sb);sb.role=rl;
    const meta=sb.alive?`${sb.gender==='M'?'♂':'♀'} ${sb.age} 歲 · ${sb.job||'在家做活'}`:'<span class="dead">已故</span>';
    const acts=sb.alive?`<button data-act="chat" data-id="${sb.id}">手足敘舊</button><button class="pri" data-act="transfer" data-id="${sb.id}">💸 贈銀</button>`:'';
    return personCard({name:sb.name,gender:sb.gender,tag:rl,tagCls:'fam',meta,rel:Math.round(sb.rel),acts,dead:!sb.alive});
  }).join('');
}
function tabFriends(){
  if(!S.people.friends.length)return '<div class="empty">尚無結交好友，可往「九州 → 民間活動」結識同袍街坊。</div>';
  return S.people.friends.map(f=>{
    const meta=f.alive?`${f.gender==='M'?'♂':'♀'} ${f.age} 歲 · ${f.job||'布衣'}`:'<span class="dead">已故</span>';
    const acts=f.alive?`<button data-act="chat" data-id="${f.id}">把酒言歡</button><button data-act="transfer" data-id="${f.id}">💸 贈銀</button>${!S.partner&&S.age>=15&&f.age>=15&&f.rel>=55?`<button class="pri" data-act="confess" data-id="${f.id}">媒妁提親</button>`:''}`:'';
    return personCard({name:f.name,gender:f.gender,meta,rel:Math.round(f.rel),acts,dead:!f.alive});
  }).join('');
}
function tabPartner(){
  if(!S.partner)return '<div class="empty">尚無婚配對象。</div>';
  const p=S.partner;
  let acts=`<button data-act="date" data-id="${p.id}">逛廟會賞燈 (3兩)</button><button class="pri" data-act="transfer" data-id="${p.id}">💸 贈銀</button>`;
  if(!S.married)acts+=`<button class="pri" data-act="propose" data-id="${p.id}" ${p.rel<75?'disabled':''}>三書六禮成親 (30兩)</button>`;
  else acts+=`<button class="pri" data-act="birth" data-id="${p.id}">祈求添丁開枝散葉</button>`;
  acts+=`<button data-act="breakup" data-id="${p.id}" style="color:var(--rust)">${S.married?'和離':'斷絕往來'}</button>`;
  return personCard({name:p.name,gender:p.gender,tag:S.married?'正室':'定情',tagCls:'fam',meta:`${p.gender==='M'?'♂':'♀'} ${p.age} 歲`,rel:Math.round(p.rel),acts});
}
function tabChildren(){
  if(!S.people.children.length)return '<div class="empty">膝下尚無子嗣。</div>';
  return S.people.children.map(ch=>{
    const meta=ch.alive?`${ch.gender==='M'?'♂':'♀'} ${ch.age} 歲 · ${ch.job||'幼童'}`:'<span class="dead">夭折／已故</span>';
    const acts=ch.alive?`<button data-act="chat" data-id="${ch.id}">親子談心</button><button class="pri" data-act="transfer" data-id="${ch.id}">💸 賞賜銀兩</button>`:'';
    return personCard({name:ch.name,gender:ch.gender,tag:ch.gender==='M'?'兒子':'女兒',tagCls:'chi',meta,rel:Math.round(ch.rel),acts,dead:!ch.alive});
  }).join('');
}
function findPerson(id){const p=S.people;return [p.dad,p.mom,...(p.siblings||[]),...p.friends,...p.children,S.partner].filter(Boolean).find(x=>x.id===id)}
function handlePersonAction(act,id){
  const p=findPerson(id);if(!p)return;
  if(act==='transfer'){openTransferMoneyModal(id);return;}
  if(S.ap<1)return toast('精力不足');
  S.ap--;
  if(act==='chat'){p.rel=clamp(p.rel+7,0,100);S.mood+=4;S.eq+=1;log(`你與${p.name}促膝長談，情誼更篤。`,'good');}
  if(act==='ask'){const m=ri(1,6);S.money+=m;p.rel-=5;log(`你向${p.role}討得零用紋銀 ${fmt(m)}。`);}
  if(act==='confess'){
    S.partner={...p,rel:clamp(p.rel+12,0,100)};S.people.friends=S.people.friends.filter(x=>x.id!==p.id);
    log(`你託媒人向${p.name}提親納采，兩家喜結秦晉之好！`,'big');
  }
  if(act==='date'){if(S.money<3){S.ap++;return toast('紋銀不足')}S.money-=3;p.rel=clamp(p.rel+10,0,100);S.mood+=10;log(`你與${p.name}攜手逛廟會看花燈，感情升溫。`,'good');}
  if(act==='propose'){
    if(S.money<30){S.ap++;return toast('成親禮金需 30 兩')}
    S.money-=30;S.married=true;S.mood+=28;S.renown+=4;
    log(`🎊 花燭之喜！你與${p.name}依大清禮制拜堂成親，宴請街坊鄰里！`,'big');
  }
  if(act==='birth'){
    const g=Math.random()<.5?'M':'F';
    const ch={id:uid(),name:S.name.charAt(0)+(g==='M'?pick(NAME_M):pick(NAME_F)),gender:g,age:0,rel:85,alive:true,job:null};
    S.people.children.push(ch);S.mood+=25;
    log(`👶 喜獲${g==='M'?'兒子':'女兒'}「${ch.name}」，家門添丁進口！`,'big');
  }
  if(act==='breakup'){S.partner=null;S.married=false;S.mood-=20;log('你們寫下和離書，從此各自安好。','bad');}
  normalize();render();openRelations(_relTab);
}

function goPrison(reason,years,fine=0){
  const fac=years>=5?'省城按察使司重監':'州縣衙門大牢';
  S.prison={yearsLeft:years,reason,facility:fac,behavior:50};
  S.crimeRecord=S.crimeRecord||[];S.crimeRecord.push({age:S.age,reason,years});
  S.soldier=null;S.civil=null;S.job=null;S.salary=0;
  if(fine>0){const f=Math.round(fine*S.cpi);S.money-=f;log(`⚖️ 升堂宣判：你因「${reason}」罪名成立，判入【${fac}】監禁 ${years} 年，並抄沒罰銀 ${fmt(f)}！`,'bad');}
  else log(`⚖️ 升堂宣判：你因「${reason}」罪名成立，押入【${fac}】監禁 ${years} 年！`,'bad');
  S.mood-=35;S.renown=Math.max(0,S.renown-20);
  showMilestoneCard({theme:'court',tag:`${fac} · 刑部判詞`,headline:`罪名成立：判監 ${years} 年`,body:`人犯 <b>${S.name}</b> 因「<b>${reason}</b>」罪證確鑿，即時戴枷押入【<b>${fac}</b>】服刑！`});
}

/* ══════ 年度推進結算 ══════ */
function nextYear(){
  if(S.over)return;
  if(S.ap>0&&S.age>=6&&!S.prison){
    sheet({title:'度過此年？',body:`<p>尚餘 <b style="color:var(--amber)">${S.ap}</b> 點精力未用，確定直接度過今年嗎？</p>`,buttons:[{text:'先去安排'},{text:'確定度過',cls:'pri',onClick:()=>{setTimeout(doNextYear,60)}}]});
    return;
  }
  doNextYear();
}
function doNextYear(){
  if(S.over)return;closeSheet();
  S.age++;S.apps=5;
  let baseAp=hasChildUnder(3)?5:8;
  if(S.health<30)baseAp=4;else if(S.health>=85||S.lifestyle===2)baseAp=9;
  S.maxAp=baseAp;S.ap=S.maxAp;
  S.cpi*=1+clamp(0.012+gauss()*0.008,-0.01,0.04);
  S.landIdx*=1+clamp(0.02+gauss()*0.04,-0.12,0.15);
  if(S.age>35)S.health-=0.5;if(S.age>55)S.health-=0.8;if(S.age>70)S.health-=1.2;

  let income=0,expense=0;
  if(S.prison){
    S.prison.yearsLeft--;S.mood-=6;S.health-=3;
    log(`你在【${S.prison.facility}】戴枷服刑，尚餘刑期 ${S.prison.yearsLeft} 年。`,'bad');
    if(S.prison.yearsLeft<=0){S.prison=null;log('你刑滿出獄，重見天日！','big');}
  }else{
    if(S.soldier){
      const m=S.soldier;m.yearsServed++;m.yir++;m.merit+=4;
      const pay=Math.round(SOLDIER_RANKS[m.rankIndex].m*S.cpi);
      income+=pay;S.salary=pay;
      const nextRk=SOLDIER_RANKS[m.rankIndex+1];
      if(nextRk&&m.merit>=nextRk.meritNeed){
        m.rankIndex++;S.salary=Math.round(SOLDIER_RANKS[m.rankIndex].m*S.cpi);
        log(`🎖️ 軍中論功行賞，你晉升為【${SOLDIER_RANKS[m.rankIndex].name}】！`,'big');
      }
    }else if(S.civil){
      const c=S.civil;c.yir++;
      const pay=Math.round(CIVIL_RANKS[c.rankIndex].m*S.cpi);income+=pay;S.salary=pay;
      if(c.yir>=CIVIL_RANKS[c.rankIndex].years&&c.score>=75&&c.rankIndex<CIVIL_RANKS.length-1){
        c.rankIndex++;c.yir=0;S.salary=Math.round(CIVIL_RANKS[c.rankIndex].m*S.cpi);
        log(`🎉 吏部考績上上，你獲朝廷擢升為【${CIVIL_RANKS[c.rankIndex].name}】！`,'big');
      }
    }else if(S.job){
      S.jobYears++;const pay=Math.round(S.job.y*(1+Math.min(S.jobYears,15)*0.02)*S.cpi);
      income+=pay;S.salary=pay;
    }else if(S.eduLevel>=1&&S.age>=15){
      const stip=Math.round(EXAMS[S.eduLevel-1].stipend*S.cpi);
      income+=stip;log(`領取朝廷廩膳膏火銀 ${fmt(stip)}。`,'good');
    }

    S.businesses.slice().forEach(b=>{income+=companyYear(b)});
    S.assets.houses.forEach(h=>{
      if(h.isFarm)income+=Math.round(h.price*0.06);
      else if(h.rented)income+=Math.round(h.price*0.04);
      h.price=Math.round(h.price*(1+clamp(0.02+gauss()*0.03,-0.1,0.12)));
    });
    if(S.welfare&&S.welfare.charityGrain){
      if(S.welfare.forged&&Math.random()<0.18){
        S.welfare.charityGrain=false;S.welfare.forged=false;
        goPrison('官府清查常平倉揭發冒領賑濟罪',ri(2,5),120);
      }else{income+=Math.round(16*S.cpi);log(`領取官府常平倉賑濟糧銀 ${fmt(16*S.cpi)}。`,'good');}
    }
    if(S.age>=16){
      const lm=[0.65,1,1.8][S.lifestyle];
      const regMod=getRegion(S.region).costMod;
      const baseCost=(S.home==='parents'&&parentsAlive())?6:Math.round(24*S.cpi*regMod*lm*(S.married?1.5:1));
      const carCost=S.assets.cars.reduce((a,c)=>a+Math.round(c.cost*S.cpi),0);
      expense+=baseCost+carCost;
    }
    S.money+=income-expense;
    S.lastYear={income:Math.round(income),expense:Math.round(expense),net:Math.round(income-expense)};
    if(income>0||expense>0)log(`【歲末盤帳】進項 ${fmt(income)}，用度 ${fmt(expense)} → 結餘 ${fmt(income-expense)}`,income>=expense?'good':'bad');
    if(S.deposit>0){const it=Math.round(S.deposit*0.02);S.deposit+=it;if(it>0)log(`銀號存銀生息 ${fmt(it)}。`,'good')}
    if(S.debt>0){S.debt=Math.round(S.debt*1.08);log(`印子錢利滾利，欠債增至 ${fmt(S.debt)}。`,'bad')}
  }

  const p=S.people;ensureSiblingsArr();
  [p.dad,p.mom].forEach(w=>{
    if(w.absent||!w.alive)return;w.age++;
    if(w.age>=62&&Math.random()<0.08){
      w.alive=false;S.mood-=25;log(`${w.role}${w.name}壽終正寢（享年 ${w.age} 歲）。`,'bad');
      if(!parentsAlive()&&S.parentWealth>0){
        const heirs=1+p.siblings.filter(x=>x.alive).length;
        const share=Math.round(S.parentWealth*S.cpi/heirs);
        S.money+=share;S.parentWealth=0;
        log(`雙親俱逝，祖產田銀${heirs>1?`與 ${heirs-1} 位手足均分後`:''}你承繼了 ${fmt(share)}。`,'big');
      }
    }
  });
  p.siblings.forEach(sb=>{if(!sb.alive)return;sb.age++;sb.role=sibRoleLabel(sb);if(sb.age>=18&&!sb.job)sb.job=pick(['綠營戰兵','鐵匠','商號夥計','自耕農','私塾先生']);});
  p.friends.forEach(f=>{if(f.alive)f.age++});
  p.children.forEach(c=>{if(c.alive)c.age++});
  if(S.partner)S.partner.age++;

  normalize();checkAch();render();
  if(S.health<=0||S.age>=95){
    S.over=true;clearSave();render();
    const kids=S.people.children.filter(c=>c.alive);
    const heir=S.will?kids.find(k=>k.id===S.will.heirId):kids[0];
    const btns=[];
    if(heir){
      btns.push({text:`👶 繼承子嗣 ${heir.name}（${heir.age}歲）`,cls:'pri',onClick:()=>{
        const sibs=kids.filter(x=>x.id!==heir.id).map(x=>({name:x.name,gender:x.gender,age:x.age,rel:75,alive:true,job:x.job}));
        newGameWithOrigin(null,{name:heir.name,gender:heir.gender,orientation:S.orientation,_isBanner:S.isBanner,_eraIdx:S.startEraIdx,_region:S.region,_money:S.money,_deposit:S.deposit,_houses:S.assets.houses,_biz:S.businesses,_age:heir.age,_cpi:S.cpi,_landIdx:S.landIdx,_siblings:sibs});
        return true;
      }});
    }
    btns.push({text:'重開大清一世',onClick:()=>{setTimeout(openOriginSelect,60)}});
    sheet({title:'🕯️ 百年歸寂',body:`<p>享年 <b>${S.age}</b> 歲，終老於【${getRegion(S.region).name}】。</p><div class="row"><span class="k">生前最高身分</span><span class="v">${currentPositionName()}</span></div><div class="row"><span class="k">傳世家產總值</span><span class="v">${fmt(netWorth())}</span></div>`,closable:false,buttons:btns});
  }
}

function save(){try{if(S&&S.name&&!S.over)localStorage.setItem(SAVE_KEY,JSON.stringify({S,uid:_uid}))}catch(e){}}
function loadSave(){try{const t=localStorage.getItem(SAVE_KEY);if(!t)return false;const d=JSON.parse(t);if(!d||!d.S||d.S.over)return false;S=Object.assign(blankState(),d.S);_uid=d.uid||_uid;return true}catch(e){return false}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}

$('resetBtn').onclick=()=>sheet({title:'重開一世',body:'<p>確定要結束當前人生，重新投胎大清九州嗎？</p>',buttons:[{text:'罷了'},{text:'確定重開',cls:'warn',onClick:()=>{clearSave();setTimeout(openOriginSelect,50)}}]});
$('btnRoleModal').onclick=openRoleModal;
$('btnWealthHub').onclick=()=>openWealthHub('bank');
$('btnSocialHub').onclick=()=>openRelations('fam');
$('btnCityHub').onclick=openCityHub;
$('btnDossierHub').onclick=openDossierHub;
$('btnNext').onclick=nextYear;

S=blankState();
if(loadSave()){normalize();render();_prev=snap();toast('已載入大清九州前塵舊檔')}
else{render();openOriginSelect()}
</script>
</body>
</html>
