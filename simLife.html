<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>年歲 · 人生模擬</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#14161a;--bg2:#191c21;--card:#1e2126;--card2:#252931;--line:#2e333b;--line2:#3a404a;--ink:#dcd8d0;--ink2:#989da4;--ink3:#686d75;--amber:#d4a05a;--amber2:#a87c42;--sage:#8aa896;--rust:#c07a6d;--sky:#7d9cc0;--plum:#a88ab8}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);padding:0 14px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;overflow-x:hidden;font-feature-settings:"tnum";line-height:1.5}
body.locked{overflow:hidden}
#app{width:100%;max-width:680px;padding-top:calc(14px + env(safe-area-inset-top))}
.top{display:flex;align-items:flex-end;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.who{flex:1;min-width:0}
.who-name{font-size:11.5px;color:var(--ink3);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-age{display:flex;align-items:baseline;gap:4px;line-height:1}
.who-age b{font-family:Georgia,"Songti TC",serif;font-size:38px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.who-age i{font-style:normal;font-size:12px;color:var(--ink3);padding-bottom:5px}
.who-age b.bump{animation:bump .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.purses{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;color:var(--ink2)}
.purses .p{display:flex;gap:6px;align-items:baseline;position:relative}
.purses .p b{color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
.purses .p.zero b{color:var(--rust)}
.purses .p .lbl{font-size:11px;color:var(--ink3)}
.reset{width:32px;height:32px;flex-shrink:0;border-radius:8px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-size:15px;display:grid;place-items:center;transition:.15s;margin-bottom:1px}
.reset:hover{border-color:var(--rust);color:var(--rust)}
.fnum{position:absolute;right:0;top:-1px;font-size:11.5px;font-weight:700;pointer-events:none;white-space:nowrap;animation:fnum 1.1s ease-out forwards}
.fnum.up{color:var(--sage)}.fnum.down{color:var(--rust)}
@keyframes fnum{0%{opacity:0;transform:translateY(3px)}20%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.idbar{display:flex;flex-wrap:wrap;gap:0;align-items:center;font-size:12px;color:var(--ink2);padding:10px 0 12px}
.idbar .cell{padding:0 10px;border-right:1px solid var(--line);white-space:nowrap}
.idbar .cell:first-child{padding-left:0}
.idbar .cell:last-child{border-right:0}
.idbar .cell button{font:inherit;background:none;border:0;color:var(--amber);cursor:pointer;padding:0;border-bottom:1px dashed var(--amber2)}
.idbar .warn{color:var(--rust)}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-bottom:14px}
.attr-h{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:4px}
.attr-h .v{color:var(--ink);font-variant-numeric:tabular-nums;font-size:12.5px}
.attr-h .v .d{font-size:10.5px;font-weight:700;margin-left:3px;animation:dp 1.6s ease-out forwards}
.attr-h .v .d.up{color:var(--sage)}.attr-h .v .d.down{color:var(--rust)}
@keyframes dp{0%{opacity:0}20%{opacity:1}75%{opacity:1}100%{opacity:0}}
.track{height:4px;background:#262b32;border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.diary{border-top:1px solid var(--line);border-bottom:1px solid var(--line);height:214px;overflow-y:auto;margin-bottom:14px;padding:2px 0}
.diary::-webkit-scrollbar{width:4px}
.diary::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.e{display:flex;gap:10px;padding:7px 2px 7px 0;font-size:12.8px;line-height:1.55;animation:fe .3s ease;border-bottom:1px dashed rgba(58,64,74,.45)}
.e:last-child{border-bottom:0}
.e .t{flex-shrink:0;width:40px;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:2px;text-align:right}
.e .x{flex:1;color:var(--ink2)}
.e.good .x{color:#a8c4b4}.e.bad .x{color:#d4a29a}.e.big .x{color:var(--ink);font-weight:600}.e.big .t{color:var(--amber)}
@keyframes fe{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.diary:empty::after{content:'你的人生剛剛開始。';color:var(--ink3);font-size:12.5px;display:flex;align-items:center;justify-content:center;height:100%;font-family:Georgia,"Songti TC",serif;letter-spacing:.5px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.menu button,.advance{font-family:inherit;font-size:12px;padding:11px 3px;border-radius:8px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-weight:500;transition:.15s;letter-spacing:.2px}
.menu button:hover:not(:disabled){border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.06)}
.menu button:active:not(:disabled){transform:scale(.97)}
.menu button:disabled{opacity:.28;cursor:not-allowed}
.menu button .sub{display:block;font-size:9.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.advance{width:100%;padding:14px;font-size:14px;font-weight:600;border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.08);letter-spacing:1.5px;font-family:Georgia,"Songti TC",serif}
.advance:hover:not(:disabled){background:rgba(212,160,90,.18)}
.advance:disabled{opacity:.3;cursor:not-allowed}
.advance.ready{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{background:rgba(212,160,90,.08)}50%{background:rgba(212,160,90,.2)}}
#ov{position:fixed;inset:0;background:rgba(10,11,13,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
#ov.show{display:flex}
.sheet{width:100%;max-width:470px;max-height:84vh;overflow-y:auto;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:20px;animation:sp .22s cubic-bezier(.34,1.3,.64,1);box-shadow:0 24px 60px rgba(0,0,0,.6)}
.sheet::-webkit-scrollbar{width:4px}
.sheet::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
@keyframes sp{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.sheet h2{font-family:Georgia,"Songti TC",serif;font-size:17px;font-weight:500;color:var(--ink);margin-bottom:14px;letter-spacing:.8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sheet .body{font-size:13px;line-height:1.7;color:var(--ink2)}
.sheet .body p{margin-bottom:8px}
.sheet .body p:last-child{margin-bottom:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink2);font-size:12.5px}
.row .v{color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btnrow button{flex:1;min-width:100px;font-family:inherit;font-size:12.5px;padding:11px 10px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;font-weight:500;transition:.15s}
.btnrow button:hover:not(:disabled){border-color:var(--amber2);color:var(--amber)}
.btnrow button:disabled{opacity:.3;cursor:not-allowed}
.btnrow button.pri{border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.09)}
.btnrow button.pri:hover:not(:disabled){background:rgba(212,160,90,.2)}
.btnrow button.warn{border-color:rgba(192,122,109,.55);color:var(--rust)}
.btnrow button.warn:hover:not(:disabled){background:rgba(192,122,109,.12)}
.person{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .ava{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-family:Georgia,"Songti TC",serif;font-size:15px;color:#14161a;font-weight:600;background:var(--amber);opacity:.85}
.person .ava.f{background:var(--plum)}
.person .ava.dead{background:#3a404a;color:var(--ink3)}
.person .info{flex:1;min-width:0}
.person .n{font-size:13.5px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.person .n .tag{font-size:10px;font-weight:500;color:var(--ink3);padding:1px 6px;border:1px solid var(--line2);border-radius:3px}
.person .n .tag.fam{color:var(--plum);border-color:rgba(168,138,184,.4)}
.person .n .tag.par{color:var(--amber);border-color:rgba(212,160,90,.4)}
.person .n .tag.chi{color:var(--sage);border-color:rgba(138,168,150,.4)}
.person .meta{font-size:11.5px;color:var(--ink3);margin:2px 0 6px;line-height:1.4}
.person .meta .dead{color:var(--rust)}
.person .relbar{height:3px;background:#262b32;border-radius:2px;overflow:hidden}
.person .relbar i{display:block;height:100%;border-radius:2px;transition:width .4s}
.person .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.person .acts button{font:inherit;font-size:11.5px;padding:5px 10px;border-radius:5px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;transition:.15s}
.person .acts button:hover:not(:disabled){border-color:var(--amber2);color:var(--amber)}
.person .acts button:disabled{opacity:.3;cursor:not-allowed}
.person .acts button.pri{border-color:var(--amber2);color:var(--amber)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:6px;overflow-x:auto}
.tabs button{font:inherit;font-size:12.5px;padding:9px 12px;border:0;background:none;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;white-space:nowrap}
.tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
.tabs button .cnt{font-size:10.5px;color:var(--ink3);margin-left:3px}
.empty{color:var(--ink3);font-size:12.5px;padding:22px 0;text-align:center}
.acts-list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.acts-list .it:last-child{border-bottom:0}
.acts-list .it:hover:not(.off){padding-left:4px}
.acts-list .it.off{opacity:.35;cursor:not-allowed}
.acts-list .it .l{flex:1;min-width:0}
.acts-list .it .nm{font-size:13px;color:var(--ink)}
.acts-list .it .ds{font-size:11.5px;color:var(--ink3);margin-top:1px}
.acts-list .it .dg{font-size:11.5px;color:var(--amber);white-space:nowrap;font-variant-numeric:tabular-nums}
.acts-list .it .dg .w{color:var(--rust)}
input[type=number],input[type=text]{width:100%;padding:11px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font-size:14px;font-family:inherit;outline:none;margin:10px 0;font-variant-numeric:tabular-nums}
input:focus{border-color:var(--amber2)}
.note{font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.6}
.origin{padding:12px 14px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;transition:.15s;background:var(--bg2)}
.origin:hover{border-color:var(--amber2);background:rgba(212,160,90,.05)}
.origin .h{font-size:14px;color:var(--ink);font-weight:600;margin-bottom:3px;font-family:Georgia,"Songti TC",serif;letter-spacing:.5px}
.origin .d{font-size:11.5px;color:var(--ink3);margin-bottom:6px}
.origin .b{font-size:11.5px;color:var(--amber)}
.origins{display:flex;flex-direction:column;gap:8px}
.gsel{display:flex;gap:8px;margin-bottom:16px}
.gsel button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;transition:.15s}
.gsel button.on{border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.09)}
.bizstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bizstat .b{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.bizstat .b .l{font-size:10.5px;color:var(--ink3)}
.bizstat .b .v{font-size:13px;color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
.emp{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px}
.emp:last-child{border-bottom:0}
.biz-card{padding:12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg2);margin-bottom:8px}
.biz-card .t{font-size:13.5px;color:var(--ink);font-weight:600;margin-bottom:4px}
.biz-card .m{font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.asset-card{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.asset-card:last-child{border-bottom:0}
.asset-card .l{flex:1}
.asset-card .nm{color:var(--ink);font-weight:600}
.asset-card .ds{color:var(--ink3);font-size:11px;margin-top:2px}
.asset-card .v{color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap;margin-right:8px}
.asset-card button{font:inherit;font-size:11px;padding:4px 8px;border-radius:4px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer}
.asset-card button:hover{border-color:var(--amber2);color:var(--amber)}
.cat-title{font-size:12px;color:var(--ink3);letter-spacing:1px;margin:12px 0 4px;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.cat-title:first-child{margin-top:0}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);background:var(--card2);border:1px solid var(--line2);color:var(--ink);padding:10px 18px;border-radius:7px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:84vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:400px){.who-age b{font-size:32px}.attrs{gap:7px 14px}.menu{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="who"><div class="who-name" id="whoName">—</div><div class="who-age"><b id="ageNum">0</b><i>歲</i></div></div>
    <div class="purses">
      <div class="p" id="purseCash"><span class="lbl">現金</span><b id="moneyTxt">0</b></div>
      <div class="p" id="purseAP"><span class="lbl">行動</span><b><span id="apTxt">3</span>/3</b></div>
    </div>
    <button class="reset" id="resetBtn" title="重新開始">↺</button>
  </header>
  <div class="idbar" id="idbar"></div>
  <div class="attrs" id="attrs"></div>
  <div class="diary" id="diary"></div>
  <div class="menu">
    <button id="btnPartner">伴侶</button>
    <button id="btnProperty">財產</button>
    <button id="btnRelation">關係</button>
    <button id="btnActivity">活動</button>
    <button id="btnBusiness">產業</button>
    <button id="btnCareer">職涯</button>
  </div>
  <button class="advance" id="btnNext">度 過 這 一 年</button>
</div>
<div id="ov"></div><div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[ri(0,a.length-1)];
function fmt(n){n=Math.round(n);const neg=n<0?'−':'';n=Math.abs(n);if(n>=1e8)return neg+(n/1e8).toFixed(2)+'億';if(n>=1e4)return neg+(n/1e4).toFixed(1)+'萬';return neg+n.toLocaleString()}
let _t;function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_t);_t=setTimeout(()=>el.classList.remove('show'),1800)}

const SURNAME=['王','李','張','劉','陳','楊','黃','趙','吳','周','徐','孫','馬','朱','胡','郭','何','高','林','羅','鄭','梁','謝','宋','許','鄧','馮','曹','彭','曾','蔡','葉','蘇','潘','蕭','江','洪'];
const NAME_M=['志明','建宏','俊傑','家豪','冠宇','柏翰','承恩','品睿','子軒','宥廷','承翰','冠廷','宇軒','柏均','子毅','明遠','嘉文','書維','廷宇','冠霖','振業','文彬','俊宏','冠豪','世傑'];
const NAME_F=['淑芬','美玲','雅婷','怡君','佳穎','詠晴','詩涵','子晴','語彤','品妍','芯羽','采潔','姵妤','思穎','若曦','雅雯','怡安','書瑤','庭瑄','心怡','淑惠','美華','慧敏','雅芳','怡婷'];
function randPerson(g){const s=pick(SURNAME);return{name:s+(g==='M'?pick(NAME_M):pick(NAME_F)),gender:g,surname:s}}

const ORIGINS=[
  {id:'rich',name:'富商之家',desc:'父母經商，家底殷實',dadJob:'企業主',momJob:'家庭主婦',money:800000,dadRel:72,momRel:70,iq:50,eq:65,moral:45,health:85,bonus:'💰 起始 80 萬 · 父母經商'},
  {id:'scholar',name:'書香門第',desc:'父母執教，重視學問',dadJob:'大學教授',momJob:'中學教師',money:80000,dadRel:80,momRel:85,iq:68,eq:55,moral:65,health:85,bonus:'🧠 智商 +18 · 父母高關係'},
  {id:'normal',name:'小康家庭',desc:'父母上班，溫飽無虞',dadJob:'公司職員',momJob:'會計',money:30000,dadRel:75,momRel:80,iq:52,eq:52,moral:50,health:90,bonus:'⚖️ 各項均衡'},
  {id:'poor',name:'貧困家庭',desc:'父母務農或打零工',dadJob:'農民',momJob:'家庭主婦',money:3000,dadRel:82,momRel:85,iq:45,eq:45,moral:72,health:82,bonus:'⚖️ 道德 +22 · 家庭關係極好'},
  {id:'orphan',name:'孤兒',desc:'無父無母，由親戚撫養長大',dadJob:null,momJob:null,money:5000,dadRel:0,momRel:0,iq:55,eq:62,moral:50,health:78,bonus:'💬 情商 +12 · 無父母陪伴'},
];

const MAJORS=[
  {id:'med',name:'醫學院',score:650,level:3,tag:'六年制 · 高強度'},
  {id:'law',name:'法學院',score:620,level:3,tag:'四年制 · 需口才'},
  {id:'biz',name:'商學院',score:580,level:3,tag:'四年制 · 商業思維'},
  {id:'tech',name:'理工學院',score:560,level:3,tag:'四年制 · 技術導向'},
  {id:'art',name:'文學院',score:500,level:3,tag:'四年制 · 人文素養'},
  {id:'edu',name:'教育學院',score:480,level:3,tag:'四年制 · 培養師資'},
  {id:'artperf',name:'藝術學院',score:420,level:3,tag:'四年制 · 表演藝術'},
  {id:'college',name:'專科院校',score:400,level:2,tag:'三年制 · 實用取向'},
  {id:'voc',name:'職業學校',score:300,level:1,tag:'三年制 · 技能為主'},
];

const CAREER_LADDERS={
  waiter:['見習服務生','服務生','資深服務生','領班','餐廳經理'],
  factory:['作業員','技術員','資深技術員','組長','廠長'],
  delivery:['外送員','資深外送員','組長','站長'],
  clerk:['實習文員','文員','資深文員','主任','部門主管'],
  sales:['銷售助理','銷售專員','資深銷售','銷售主管','銷售經理'],
  mechanic:['學徒','技師','資深技師','技術主管','廠長'],

function newGameWithOrigin(origin,inheritFrom,forcedGender,forcedOrientation){
  let myGender,myOrientation;
  if(inheritFrom){myGender=inheritFrom.gender;myOrientation=inheritFrom.orientation||'hetero';}
  else{myGender=forcedGender||(Math.random()<.5?'M':'F');myOrientation=forcedOrientation||'hetero';}
  let me,base;
  if(inheritFrom){me={name:inheritFrom.name,gender:inheritFrom.gender,surname:inheritFrom.name.charAt(0)};base=ORIGINS[2];}
  else{me=randPerson(myGender);base=ORIGINS.find(o=>o.id===origin)||ORIGINS[2];}
  const dadAge=ri(28,38),momAge=ri(26,36);
  let dad,mom;
  if(inheritFrom||base.dadJob===null){
    dad={id:uid(),name:'—',gender:'M',age:0,rel:0,alive:false,role:'父親',job:null,absent:true};
    mom={id:uid(),name:'—',gender:'F',age:0,rel:0,alive:false,role:'母親',job:null,absent:true};
  }else{
    dad={id:uid(),...randPerson('M'),name:me.surname+pick(NAME_M),age:dadAge,rel:base.dadRel,alive:true,role:'父親',job:base.dadJob};
    mom={id:uid(),...randPerson('F'),name:pick(SURNAME)+pick(NAME_F),age:momAge,rel:base.momRel,alive:true,role:'母親',job:base.momJob};
  }
  const startMoney=inheritFrom?Math.round(inheritFrom._inheritMoney||0):base.money;
  S={
    name:me.name,gender:myGender,orientation:myOrientation,origin:inheritFrom?'inherit':base.id,
    age:0,money:startMoney,mood:75,health:inheritFrom?90:base.health,iq:inheritFrom?60:base.iq,eq:inheritFrom?60:base.eq,moral:inheritFrom?60:base.moral,
    ap:3,maxAp:3,eduName:'嬰兒',eduLevel:0,school:'',major:null,
    job:null,salary:0,working:false,startup:false,jobPosition:0,workYears:0,renown:0,
    civil:null,official:null,politician:null,military:null,militaryDone:false,militaryDeferred:false,
    prison:null,businesses:[],licenses:{driver:false},assets:{houses:[],cars:[]},
    deposit:0,invest:0,trust:0,trustActive:false,
    married:false,partner:null,
    will:null,
    people:{dad,mom,friends:[],children:[]},
    logs:[],over:false,pendingOffer:false,civilExamAt:-1,gradSchool:false,pet:false,
    inheritance:inheritFrom||null,
  };
  _prev={};_uid=100;

  if(inheritFrom){
    // 繼承：維持原本歲數與人生狀態
    S.age=inheritFrom._inheritAge||0;
    // 繼承學歷
    if(inheritFrom.eduLevel){
      S.eduLevel=inheritFrom.eduLevel;
      S.eduName=inheritFrom.eduName||'畢業';
      if(inheritFrom.major)S.major=inheritFrom.major;
    }
    // 繼承工作
    if(inheritFrom.job){
      const job=JOBS.find(j=>j.name===inheritFrom.job);
      if(job){S.job=job;S.salary=job.salary;S.working=true;}
    }
    log(`你以${inheritFrom.name}的身份開始了新的人生。繼承了上一代的 ${fmt(startMoney)} 元。`,'big');
  }else if(base.id==='orphan'){
    log(`你是個孤兒，由親戚撫養長大。沒有父母陪伴，但你很獨立。`,'big');
  }else{
    log(`你出生在一個${base.name}。父親是${dad.name}（${dad.age}歲，${dad.job}），母親是${mom.name}（${mom.age}歲，${mom.job}）。`,'big');
  }
  closeSheet();render();_prev=snap();
}
function snap(){return{mood:S.mood,health:S.health,iq:S.iq,eq:S.eq,moral:S.moral}}
function log(text,cls=''){S.logs.unshift({age:S.age,text,cls});if(S.logs.length>200)S.logs.length=200}
function normalize(){
  S.mood=clamp(S.mood,0,100);S.health=clamp(S.health,0,100);S.iq=clamp(S.iq,0,100);S.eq=clamp(S.eq,0,100);S.moral=clamp(S.moral,0,100);
  S.money=Math.max(0,S.money);S.deposit=Math.max(0,S.deposit);S.invest=Math.max(0,S.invest);S.trust=Math.max(0,S.trust);
  S.renown=clamp(S.renown,0,100);
  const p=S.people;
  if(p.dad&&!p.dad.absent)p.dad.rel=clamp(p.dad.rel,0,100);
  if(p.mom&&!p.mom.absent)p.mom.rel=clamp(p.mom.rel,0,100);
  p.friends.forEach(f=>f.rel=clamp(f.rel,0,100));
  p.children.forEach(c=>c.rel=clamp(c.rel,0,100));
  if(S.partner)S.partner.rel=clamp(S.partner.rel,0,100);
}

  }).join('')+(S.renown>0?`<div class="attr" style="grid-column:1/-1"><div class="attr-h"><span>🌟 知名度</span><span class="v">${Math.round(S.renown)}</span></div><div class="track"><i style="width:${S.renown}%;background:var(--plum)"></i></div></div>`:'');

function currentPositionName(){
  if(S.politician){const ranks=S.politician.path==='central'?CENTRAL_RANKS:LOCAL_RANKS;return ranks[S.politician.rankIndex].name}
  if(S.official)return S.official.rank.name;
  if(S.civil)return S.civil.rank.name;
  if(S.military)return S.military.rank.name;
  if(S.job&&CAREER_LADDERS[S.job.id])return CAREER_LADDERS[S.job.id][Math.min(S.jobPosition,CAREER_LADDERS[S.job.id].length-1)];
  if(S.job)return S.job.name;
  return '無業';
}

function sheet({title,body,buttons,onMount,closable=true}){
  const ov=$('ov');
  ov.innerHTML=`<div class="sheet"><h2>${title}</h2><div class="body">${body}</div><div class="btnrow"></div></div>`;
  const row=ov.querySelector('.btnrow');
  (buttons||[{text:'關閉'}]).forEach(b=>{
    const el=document.createElement('button');el.textContent=b.text;if(b.cls)el.className=b.cls;if(b.disabled)el.disabled=true;
    el.onclick=()=>{const keep=b.onClick?b.onClick()===true:false;if(!keep)closeSheet()};
    row.appendChild(el);
  });
  ov.classList.add('show');document.body.classList.add('locked');
  ov.onclick=e=>{if(e.target===ov&&closable)closeSheet()};
  if(onMount)onMount();
}

function addNewFriend(active){
  if(S.people.friends.length>=10)return;
  const g=Math.random()<.5?'M':'F';
  const base={id:uid(),...randPerson(g),age:clamp(S.age+ri(-2,3),6,90),rel:active?ri(45,60):ri(30,50),alive:true,job:null};
  if(base.age>=22&&base.age<65)base.job=pick(JOB_POOL);
  S.people.friends.push(base);
  log(`你認識了新朋友${base.name}（${base.gender==='M'?'男':'女'}，${base.age}歲，${identityOf(base.age,base.job)}）。`,'good');
}
function actReason(a){if(S.ap<a.ap)return'行動點不足';if(a.cost&&S.money<a.cost)return'金錢不足';return''}

function openActivities(){
  if(S.over)return;
  const list=ACTIONS.filter(a=>S.age>=a.min&&(!a.max||S.age<=a.max));
  const byCat={};
  list.forEach(a=>{if(!byCat[a.cat])byCat[a.cat]=[];byCat[a.cat].push(a)});
  const order=['daily','leisure','learn','social','life','career'];
  let html=`<p style="color:var(--ink3);font-size:12px;margin-bottom:8px">剩餘行動點 <b style="color:var(--amber)" id="apLine">${S.ap}</b> / ${S.maxAp}</p><div id="actList">`;
  order.forEach(cat=>{
    if(!byCat[cat])return;
    html+=`<div class="cat-title">${ACT_CATS[cat]}</div>`;
    byCat[cat].forEach(a=>{
      const r=actReason(a);
      html+=`<div class="it ${r?'off':''}" data-id="${a.id}" style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s"><div class="l" style="flex:1;min-width:0"><div class="nm" style="font-size:13px;color:var(--ink)">${a.name}</div><div class="ds" style="font-size:11.5px;color:var(--ink3);margin-top:1px">${a.desc}</div></div><div class="dg" style="font-size:11.5px;color:${r?'var(--rust)':'var(--amber)'};white-space:nowrap">${r?r:`−${a.ap}`}</div></div>`;
    });
  });
  html+='</div>';
  sheet({title:'做點什麼',body:html,buttons:[{text:'關閉'}],onMount(){
    $('actList').addEventListener('click',e=>{
      const it=e.target.closest('.it');if(!it||it.classList.contains('off'))return;
      const a=ACTIONS.find(x=>x.id===it.dataset.id);if(!a)return;
      if(S.ap<a.ap)return toast('行動點不足');
      if(a.cost&&S.money<a.cost)return toast('金錢不足');
      if(a.cost)S.money-=a.cost;S.ap-=a.ap;a.run(S);normalize();render();refreshActList();
    });
  }});
}
function refreshActList(){
  const el=$('apLine');if(el)el.textContent=S.ap;
  document.querySelectorAll('#actList .it').forEach(it=>{
    const a=ACTIONS.find(x=>x.id===it.dataset.id);if(!a)return;
    const r=actReason(a);it.classList.toggle('off',!!r);
    const dg=it.querySelector('.dg');if(dg){dg.innerHTML=r||`−${a.ap}`;dg.style.color=r?'var(--rust)':'var(--amber)'}
  });
}

/* ══════ 关系 ══════ */
function openRelations(tab){
  if(S.over)return;
  if(tab)_relTab=tab;
  const p=S.people;
  const famCount=(p.dad&&!p.dad.absent?1:0)+(p.mom&&!p.mom.absent?1:0);
  const tabs=[
    {k:'fam',label:'家人',n:famCount},
    {k:'fri',label:'朋友',n:p.friends.filter(f=>f.alive).length},
    {k:'par',label:'伴侶',n:S.partner?1:0},
    {k:'chi',label:'子女',n:p.children.length},
  ];
  const body=`<div class="tabs">${tabs.map(t=>`<button data-tab="${t.k}" class="${_relTab===t.k?'on':''}">${t.label}<span class="cnt">${t.n}</span></button>`).join('')}</div><div id="tabBody"></div>`;
  sheet({title:'關係',body,buttons:[{text:'關閉'}],onMount(){
    const renderTab=()=>{
      let html='';
      if(_relTab==='fam')html=tabFamily();
      else if(_relTab==='fri')html=tabFriends();
      else if(_relTab==='par')html=tabPartner();
      else html=tabChildren();
      $('tabBody').innerHTML=html;bindTabButtons();
    };
    document.querySelectorAll('.tabs button').forEach(b=>{
      b.onclick=()=>{_relTab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===_relTab));renderTab()};
    });
    renderTab();
  }});
}
function personCard({name,gender,tag,tagCls,meta,rel,acts,dead}){
  const avaCls=dead?'ava dead':(gender==='F'?'ava f':'ava');
  const relColor=rel>=66?'var(--sage)':rel>=33?'var(--amber)':'var(--rust)';
  return `<div class="person"><div class="${avaCls}">${dead?'—':name.charAt(0)}</div><div class="info"><div class="n">${name}${tag?`<span class="tag ${tagCls||''}">${tag}</span>`:''}</div><div class="meta">${meta}</div><div class="relbar"><i style="width:${rel}%;background:${relColor}"></i></div><div class="acts">${acts||''}</div></div></div>`;
}
function tabFamily(){
  const p=S.people;
  if(p.dad.absent&&p.mom.absent)return `<div class="empty">你沒有父母，一路走來都是靠自己。</div>`;
  const out=[];
  [p.dad,p.mom].forEach(who=>{
    if(who.absent)return;
    const ageTxt=who.alive?`${who.age} 歲 · ${identityOf(who.age,who.job)}`:`<span class="dead">已故</span>`;
    const acts=who.alive?`<button data-act="chat" data-id="${who.id}">聊天</button><button data-act="gift" data-id="${who.id}">送禮 500</button>${S.age<16?`<button data-act="ask" data-id="${who.id}">要零用錢</button>`:''}`:'';
    out.push(personCard({name:who.name,gender:who.gender,tag:who.role,tagCls:'par',meta:ageTxt,rel:Math.round(who.rel),acts,dead:!who.alive}));
  });
  return out.join('');
}
function tabFriends(){
  const list=S.people.friends;
  if(!list.length)return `<div class="empty">你還沒有朋友。在「活動」中認識新朋友吧。</div>`;
  return list.map(f=>{
    const dead=!f.alive;
    const acts=dead?'':`<button data-act="fri_chat" data-id="${f.id}">聯絡</button>${canConfess(f)?`<button class="pri" data-act="confess" data-id="${f.id}">告白</button>`:''}`;
    const meta=dead?`<span class="dead">已故</span>`:`${f.gender==='M'?'♂':'♀'} ${f.age} 歲 · ${identityOf(f.age,f.job)}`;
    return personCard({name:f.name,gender:f.gender,meta,rel:Math.round(f.rel),acts,dead});

function bindTabButtons(){document.querySelectorAll('.person .acts button').forEach(btn=>{btn.onclick=()=>handlePersonAction(btn.dataset.act,parseInt(btn.dataset.id))})}
function findPerson(id){const p=S.people;return [p.dad,p.mom,...p.friends,...p.children,S.partner].filter(Boolean).find(x=>x.id===id)}
function canConfess(f){
  if(S.married||S.partner)return false;if(S.age<16)return false;if(!f.alive)return false;
  if(f.rel<50)return false;if(Math.abs(f.age-S.age)>10)return false;
  const o=S.orientation||'hetero';
  if(o==='hetero'&&f.gender===S.gender)return false;
  if(o==='homo'&&f.gender!==S.gender)return false;
  return true;
}

function examScore(){return Math.round(clamp(300+S.iq*3+S.eq+rnd(-30,30),0,750))}
function examZhongkao(){
  const sc=examScore();
  if(sc>=620){S.school='重點高中';S.eduName='重點高中';S.eduLevel=1;S.iq+=3;log(`中考成績 ${sc} 分，你考上了重點高中。`,'big')}
  else if(sc>=500){S.school='普通高中';S.eduName='普通高中';S.eduLevel=1;log(`中考成績 ${sc} 分，你考上了普通高中。`,'big')}
  else{S.school='職業學校';S.eduName='職業學校';S.eduLevel=1;log(`中考成績 ${sc} 分，你進入了職業學校。`,'bad')}
}
function examGaokao(){
  if(S.school==='職業學校'){S.school='';S.eduName='畢業';S.eduLevel=1;log('你從職業學校畢業，準備進入社會。','big');S.pendingOffer=true;if(!S.militaryDone&&!S.militaryDeferred)setTimeout(()=>openMilitaryEnlist(),700);return}
  const sc=examScore();log(`高考成績出爐：${sc} 分。`,'big');
  const available=MAJORS.filter(m=>m.score<=sc);
  if(!available.length){S.school='';S.eduName='畢業';S.eduLevel=1;log('你的分數未達任何學校的錄取線，決定先進入社會工作。','bad');S.pendingOffer=true;if(!S.militaryDone&&!S.militaryDeferred)setTimeout(()=>openMilitaryEnlist(),700);return}
  setTimeout(()=>openMajorSelect(sc,available),340);
}
function openMajorSelect(score,list){
  const html=`<p style="margin-bottom:6px">你的高考成績為 <b style="color:var(--amber)">${score}</b> 分。</p><p style="color:var(--ink3);font-size:12px;margin-bottom:12px">以下科系可供你選擇：</p><div class="acts-list" id="majorList">${list.map(m=>`<div class="it" data-id="${m.id}"><div class="l"><div class="nm">${m.name}</div><div class="ds">${m.tag} · 錄取線 ${m.score} 分</div></div><div class="dg">選擇</div></div>`).join('')}</div>`;
  sheet({title:'選擇科系',body:html,closable:false,buttons:[{text:'放棄升學，直接就業',cls:'warn',onClick:()=>{
    S.school='';S.eduName='畢業';S.eduLevel=1;log('你放棄升學，選擇直接就業。','bad');S.pendingOffer=true;closeSheet();
    if(!S.militaryDone&&!S.militaryDeferred)setTimeout(()=>openMilitaryEnlist(),400);else setTimeout(()=>openJobSearch(),400);
  }}],onMount(){

      const it=e.target.closest('.it');if(!it)return;

      S.major=m.id;S.school=m.name;S.eduName=m.name;S.eduLevel=m.level;
      if(m.id==='med')S.iq+=5;if(m.id==='law')S.eq+=5;if(m.id==='biz')S.eq+=3;if(m.id==='tech')S.iq+=3;
      if(m.id==='art'){S.eq+=2;S.moral+=3}if(m.id==='edu'){S.eq+=3;S.moral+=2}
      if(m.id==='artperf'){S.eq+=4;S.renown+=5}
      log(`你選擇了${m.name}，開啟大學生活。`,'big');normalize();render();closeSheet();
    });
  }});
}
function graduate(){
  S.school='';S.eduName='畢業';
  const major=S.major?MAJORS.find(m=>m.id===S.major):null;
  if(major&&major.id==='med')S.iq+=8;if(major&&major.id==='law')S.eq+=8;
  log('你大學畢業了，是時候找份工作了。','big');S.pendingOffer=true;
  if(!S.militaryDone&&!S.militaryDeferred&&S.age<=24)setTimeout(()=>openMilitaryEnlist(),600);
}

/* ══════ 求职 ══════ */
function jobAvailable(j){
  if(j.need>S.eduLevel)return false;
  if(j.major&&S.major!==j.major)return false;
  if(j.startup&&S.money<50000)return false;
  if(j.renown&&S.renown<j.renown)return false;
  return true;
}
function openJobSearch(){

function openBusinesses(){

  const html=S.businesses.map((c,i)=>{const totalSalary=c.employees.reduce((a,e)=>a+e.salary,0);return `<div class="biz-card"><div class="t">${c.name}</div><div class="m">${c.typeName} · 第 ${c.years} 年 · 員工 ${c.employees.length} 人 · 年人事 ${fmt(totalSalary)}</div><div class="row" style="border:0;padding:4px 0"><span class="k">聲譽</span><span class="v">${Math.round(c.reputation)}</span></div><div class="btnrow" style="margin-top:8px"><button data-biz="${i}" data-op="manage">管理</button><button data-biz="${i}" data-op="close" class="warn">結業</button></div></div>`}).join('');

        if(op==='fire'){if(!c.employees.length)return toast('沒有員工');const e=c.employees.pop();S.money-=5000;log(`「${c.name}」裁掉了 ${e.name}，支付資遣費 5000 元。`,'bad');normalize();render();manageBusiness(i)}

    buttons.push({text:'入伍服役',cls:'pri',onClick:()=>{const r=MILITARY_RANKS[0];S.military={rank:{...r},rankIndex:0,yearsServed:0,yearsInRank:0,performance:60,volunteer:false};S.militaryDone=true;S.working=false;S.job=null;S.salary=r.salary;S.working=true;log('你入伍服役，成為一名二兵。','big');normalize();render();closeSheet()}});
    buttons.push({text:'延後入伍',cls:'warn',onClick:()=>{S.militaryDeferred=true;log('你申請延後入伍，明年再報到。','bad');S.mood-=5;normalize();render();closeSheet()}});
  }
  sheet({title:'兵役通知',body:html,closable:false,buttons});
}
function militaryYear(){
  const m=S.military;if(!m)return;
  m.yearsServed++;m.yearsInRank++;S.money+=m.rank.salary;log(`軍中薪資入帳 ${fmt(m.rank.salary)} 元。`);
  const perf=rnd(-5,14)+S.health*0.04+S.iq*0.02+S.eq*0.02;m.performance=clamp(m.performance+perf,0,100);
  if(m.yearsInRank>=m.rank.years&&m.performance>55&&m.rankIndex<MILITARY_RANKS.length-1){
    m.rankIndex++;m.rank={...MILITARY_RANKS[m.rankIndex]};m.yearsInRank=0;S.salary=m.rank.salary;
    const isGeneral=m.rankIndex>=12;
    log(`表現優異，晉升為「${m.rank.name}」${isGeneral?'，將星閃耀！':''}年薪 ${fmt(m.rank.salary)} 元。`,'big');
    S.mood+=isGeneral?25:15;
  }
  if(!m.volunteer&&m.yearsServed>=2)log('兩年義務役期滿。你可以選擇退伍或轉服志願役（點擊職涯）。','big');
}

/* ══════ 公务员年度 ══════ */
function civilYearlyReview(){
  const c=S.civil;if(!c)return;
  c.budget+=30+c.rankIndex*20+ri(0,20);
  const perf=c.score+c.perfBonus+c.budget*0.05+rnd(-10,15);
  if(perf>75&&c.rankIndex<CIVIL_RANKS.length-1){
    c.rankIndex++;c.rank={...CIVIL_RANKS[c.rankIndex]};S.salary=c.rank.salary;
    log(`公務員考核優秀，晉升為「${c.rank.name}」，年薪 ${fmt(c.rank.salary)} 元。`,'big');S.mood+=12;
    if(c.rank.official&&!S.official){S.official={unit:c.unit,rank:{...c.rank},rankIndex:c.rankIndex,score:c.score};log(`你升任${c.unit}${c.rank.name}，正式成為政務官。`,'big')}
  }else if(perf>50){log('公務員考核通過，維持原職。')}
  else{c.score=clamp(c.score-5,0,100);log('公務員考核成績不理想，表現受到影響。','bad');S.mood-=6}
  if(S.official){const o=S.official;o.score=clamp(o.score+rnd(-3,5),0,100);if(o.score>75&&o.rankIndex<CIVIL_RANKS.length-1){o.rankIndex++;o.rank={...CIVIL_RANKS[o.rankIndex]};S.salary=o.rank.salary;log(`政務官考核優秀，升任「${o.rank.name}」！`,'big')}}
}

/* ══════ 政治家年度 ══════ */
function politicianYear(){
  const p=S.politician;if(!p)return;
  const ranks=p.path==='central'?CENTRAL_RANKS:LOCAL_RANKS;
  S.money+=ranks[p.rankIndex].salary;
  log(`${p.path==='central'?'中央':'地方'}官職薪資入帳 ${fmt(ranks[p.rankIndex].salary)} 元。`);
  const perf=p.score+rnd(-10,15)+S.eq*0.04;
  if(perf>70&&p.rankIndex<ranks.length-1){
    p.rankIndex++;S.salary=ranks[p.rankIndex].salary;
    log(`政治聲望提升，晉升為「${ranks[p.rankIndex].name}」！年薪 ${fmt(S.salary)} 元。`,'big');
    S.mood+=15;S.renown=clamp(S.renown+5,0,100);
  } else if(perf>40){
    log('政治生涯平穩，維持原職。');
  } else {
    p.score=clamp(p.score-5,0,100);

/* ══════ 员工升职 ══════ */
function careerYear(){
  if(!S.job||S.civil||S.military||S.official||S.politician)return;
  const ladder=CAREER_LADDERS[S.job.id];if(!ladder)return;
  S.workYears=(S.workYears||0)+1;
  const perf=rnd(-5,15)+S.iq*0.04+S.eq*0.04+S.mood*0.02+S.renown*0.02;
  if(perf>12&&S.jobPosition<ladder.length-1){
    S.jobPosition++;const mult=1+S.jobPosition*0.2;S.salary=Math.round(S.job.salary*mult);
    log(`工作表現出色，升職為「${ladder[S.jobPosition]}」，年薪 ${fmt(S.salary)} 元。`,'big');S.mood+=12;
  }else{log('今年工作平順，沒有升職機會。')}
}

/* ══════ 人物年度 ══════ */
function ageUpPeople(){
  const p=S.people;
  [p.dad,p.mom].forEach(who=>{
    if(who.absent||!who.alive)return;
    who.age++;if(who.age>=65&&who.job!=='退休')who.job='退休';
    if(who.age>=62&&Math.random()<(who.age-62)*0.014){who.alive=false;S.mood-=30;S.moral+=3;log(`${who.role}${who.name}過世了。你悲痛萬分。`,'bad')}
    else{who.rel=clamp(who.rel-1,0,100)}
  });
  p.friends.forEach(f=>{
    if(!f.alive)return;
    f.age++;if(f.age>=22&&!f.job&&f.age<65)f.job=pick(JOB_POOL);if(f.age>=65)f.job='退休';
    f.rel=clamp(f.rel-2,0,100);
    if(f.age>=75&&Math.random()<0.03){f.alive=false;f.rel=0;log(`朋友${f.name}離開了人世。`,'bad');S.mood-=8}
  });
  p.children.forEach(c=>{
    c.age++;childLifeChoices(c);
    if(c.age>=22&&!c.job&&c.age<65&&!c.military&&c.alive)c.job=pick(JOB_POOL);
    if(c.age>=65)c.job='退休';c.rel=clamp(c.rel-1,0,100);
  });
  if(S.partner){
    S.partner.age++;if(S.partner.age>=22&&!S.partner.job&&S.partner.age<65)S.partner.job=pick(JOB_POOL);
    if(S.partner.age>=65)S.partner.job='退休';S.partner.rel=clamp(S.partner.rel-1,0,100);
    if(S.partner.age>=80&&Math.random()<0.04){log(`${S.partner.name}安詳地離開了。`,'bad');S.partner=null;S.married=false;S.mood-=40}
  }
}
function childLifeChoices(c){
  if(!c.alive)return;
  if(c.age===18&&!c.job&&!c.major&&!c.military){
    if(Math.random()<0.5){c.major=pick(['biz','tech','art','edu','college','voc']);log(`${c.name} 考上了大學，選擇了就讀${MAJORS.find(m=>m.id===c.major)?.name||'大學'}。`,'good')}
    else{c.job=pick(JOB_POOL);log(`${c.name} 決定不升學，開始工作，成為了一名${c.job}。`,'good')}
  }
  if(c.age>=22&&c.age<=24&&c.major&&!c.job&&!c.military){c.job=pick(JOB_POOL);log(`${c.name} 大學畢業，開始工作，成為了一名${c.job}。`,'good')}
  if(c.age>=25&&c.age<=35&&!c.spouse&&Math.random()<0.25){c.spouse=pick(['一位溫柔的伴侶','一位開朗的伴侶','一位踏實的伴侶','一位體貼的伴侶']);log(`${c.name} 結婚了，對象是${c.spouse}。`,'good')}
  if(c.spouse&&c.age>=25&&c.age<=42&&(c.kids||0)<3&&Math.random()<0.2){c.kids=(c.kids||0)+1;log(`${c.name} 有了第 ${c.kids} 個孩子，你升格當祖父母了。`,'big');S.mood+=15}
  if(c.age>=75&&Math.random()<0.05){c.alive=false;log(`你的孩子${c.name}過世了。白髮人送黑髮人，你悲痛不已。`,'bad');S.mood-=25}
}
function maybeNewFriend(){
  const rate=S.age>=6&&S.age<=22?0.22:(S.age>22&&S.age<55?0.1:0.04);
  if(S.people.friends.length>=10)return;if(Math.random()>=rate)return;
  const g=Math.random()<.5?'M':'F';const base={id:uid(),...randPerson(g),age:clamp(S.age+ri(-2,2),6,90),rel:ri(32,55),alive:true,job:null};
  if(base.age>=22&&base.age<65)base.job=pick(JOB_POOL);
  S.people.friends.push(base);log(`你認識了新朋友${base.name}（${base.gender==='M'?'男':'女'}，${base.age}歲，${identityOf(base.age,base.job)}）。`,'good');
}

/* ══════ 家庭开销 ══════ */
function calcFamilyCost(){
  let dependents=0,income=0;
  S.people.children.forEach(c=>{
    if(!c.alive)return;
    const independent=c.age>=22&&(c.job||c.military||c.spouse);
    if(independent){if(c.rel>50)income+=ri(2000,8000)}
    else dependents++;
  });
  const cost=12000+dependents*15000;
  return {cost,income,dependents};
}

/* ══════ 监狱 ══════ */
function checkPrison(){
  if(S.prison)return;

  }
}
function prisonYear(){

  {w:3,min:18,run:s=>{s.moral+=5;s.mood+=8;log('你幫助了一位陌生人，內心感到溫暖。','good')}},

  {w:2,min:8,run:s=>{s.mood+=8;s.health+=2;log('你遇到一隻可愛的流浪狗，陪牠玩了一下午，心情 +8。','good')}},

function fireEvent(){
  const pool=EVENTS.filter(e=>(!e.min||S.age>=e.min)&&(!e.max||S.age<=e.max)&&(!e.cond||e.cond(S)));
  if(!pool.length)return;const total=pool.reduce((a,b)=>a+(b.w||1),0);let r=Math.random()*total;
  for(const e of pool){r-=(e.w||1);if(r<=0){e.run(S);return}}
}

/* ══════ 年度推进 ══════ */
function nextYear(){
  if(S.over)return;
  if(S.ap>0&&S.age>=6&&!S.prison){
    sheet({title:'度過這一年？',body:`<p>你還有 <b style="color:var(--amber)">${S.ap}</b> 個行動點沒有使用。</p><p>確定要直接迎接下一年嗎？</p>`,buttons:[{text:'先去安排'},{text:'確定度過',cls:'pri',onClick:()=>{setTimeout(doNextYear,60)}}]});
    return;
  }
  doNextYear();
}
function doNextYear(){
  if(S.over)return;closeSheet();
  S.age++;S.ap=S.maxAp;S.pendingOffer=false;
  if(S.age>25)S.mood-=2;
  if(S.age>30)S.health-=0.8;
  if(S.age>45)S.health-=1.2;
  if(S.age>65)S.health-=2.0;
  if(S.age>80)S.health-=2.5;

  if(S.prison){prisonYear()}
  else{
    if(S.military){militaryYear()}
    else if(S.politician){politicianYear()}
    else if(S.civil){civilYearlyReview();const sal=S.official?S.official.rank.salary:S.civil.rank.salary;S.money+=sal;log(`公務員薪資入帳 ${fmt(sal)} 元。`)}
    else if(S.job){careerYear();S.money+=S.salary;log(`你工作一年，獲得薪水 ${fmt(S.salary)} 元。`)}
    else if(S.age<=18){const pocket=200*S.age;S.money+=pocket;log(`父母給了你 ${fmt(pocket)} 元零用錢。`)}

    S.businesses.forEach(b=>companyYear(b));
    S.assets.houses.forEach(h=>{if(h.rented){S.money+=h.rent;log(`房產「${h.name}」收租 ${fmt(h.rent)} 元。`,'good')}});
    S.assets.cars.forEach(c=>{S.money-=c.cost;log(`車輛「${c.name}」維護費 ${fmt(c.cost)} 元。`)});

    if(S.deposit>0){const it=S.deposit*0.035;S.deposit+=it;log(`定期存款產生利息 ${fmt(it)} 元。`,'good')}
    if(S.trust>0){const it=S.trust*0.03;S.trust+=it;log(`信託基金產生收益 ${fmt(it)} 元。`,'good')}
    if(S.invest>0){const rate=rnd(-0.45,0.65);const before=S.invest;S.invest=Math.max(0,S.invest*(1+rate));const diff=S.invest-before;
      if(diff>=0){log(`投資組合上漲，獲利 ${fmt(diff)} 元。`,'good');S.mood+=5}else{log(`投資組合下跌，虧損 ${fmt(-diff)} 元。`,'bad');S.mood-=8}}

    if(S.married||S.people.children.length>0){
      const fam=calcFamilyCost();
      if(fam.cost>0){S.money-=fam.cost;log(`家庭開銷 ${fmt(fam.cost)} 元。`)}
      if(fam.income>0){S.money+=fam.income;log(`已獨立的子女給了孝親費 ${fmt(fam.income)} 元。`,'good')}
    }

    if(S.pet){S.money-=8000;log('寵物的飼料與醫療花費 8000 元。')}
    S.assets.houses.forEach(h=>{h.price=Math.round(h.price*rnd(0.95,1.08))});
  }

  ageUpPeople();

  switch(S.age){
    case 3:S.school='幼兒園';S.eduName='幼兒園';log('你進入了幼兒園。','big');break;
    case 6:S.school='小學';S.eduName='小學';log('你上小學了。','big');break;
    case 12:S.school='初中';S.eduName='初中';log('你升上了初中。','big');break;
    case 15:examZhongkao();break;
    case 18:examGaokao();break;
    case 21:if(S.school==='專科院校')graduate();break;
    case 22:if(S.school==='本科大學'||S.school==='名牌大學'||(S.major&&['biz','law','tech','art','edu','artperf'].includes(S.major)))graduate();break;
    case 23:if(S.major==='med')graduate();break;
    case 24:if(S.major==='med')graduate();break;
    case 60:if(S.military&&S.military.volunteer){log('你達到了服役年齡上限，光榮退役。','big');S.military=null;S.working=false;S.salary=0}
      else if(S.working&&S.businesses.length===0&&!S.civil&&!S.official&&!S.politician){log('你退休了，開始享受退休生活。','big');S.working=false;S.job=null;S.salary=0;S.startup=false}
      break;
  }

  if(S.mood<20){S.health-=3;log('心情長期低落，健康受到影響。','bad')}
  if(S.health<30){S.mood-=3}

  maybeNewFriend();checkPrison();
  if(!S.prison)fireEvent();

  normalize();render();

  if(S.health<=0){gameOver('你的健康徹底崩潰，人生畫下了句點。');return}
  if(S.age>=100){gameOver('你活到了 100 歲，安詳地走完了這一生。');return}

  if(S.pendingOffer&&!S.job&&!S.school&&!S.civil&&!S.official&&!S.military&&S.businesses.length===0){setTimeout(()=>openJobSearch(),340)}

  if(!S.militaryDone&&!S.military&&!S.prison&&!S.school&&S.age>=18&&S.age<=27){
    if(S.militaryDeferred||Math.random()<0.3){S.militaryDeferred=false;setTimeout(()=>openMilitaryEnlist(),600)}
  }
}
function companyYear(c){
  c.years++;const btype=BIZ_TYPES.find(b=>b.id===c.type);
  const staffCount=c.employees.length;const staffCapacity=1+staffCount*0.35;const repFactor=0.5+c.reputation/100;
  let revenue=btype.base*staffCapacity*repFactor*rnd(0.7,1.3);
  const totalSalary=c.employees.reduce((a,e)=>a+e.salary,0);const fixedCost=btype.base*0.15;const expense=totalSalary+fixedCost;const profit=revenue-expense;
  log(`【${c.name}】年營收 ${fmt(revenue)}，支出 ${fmt(expense)}，${profit>=0?'淨利':'虧損'} ${fmt(Math.abs(profit))} 元。`,profit>=0?'good':'bad');
  S.money+=profit;
  if(profit>0){const tax=profit*0.15;S.money-=tax;log(`公司繳納營所稅 ${fmt(tax)} 元。`)}
  c.reputation=clamp(c.reputation+ri(-3,3),0,100);
  if(S.money<-200000){log(`「${c.name}」資金鏈斷裂，宣告破產。`,'bad');S.businesses=S.businesses.filter(x=>x.id!==c.id);S.mood-=40;S.money=0}
}

/* ══════ 结局 ══════ */
function evaluate(){
  const total=S.money+S.deposit+S.invest+S.trust+S.assets.houses.reduce((a,h)=>a+h.price,0)+S.assets.cars.reduce((a,c)=>a+c.price,0);
  const avg=(S.mood+S.health+S.iq+S.eq+S.moral)/5;
  let title='平凡的一生';
  if(total>2e7&&avg>70)title='傳奇人生';
  else if(total>1e7)title='億萬富豪';
  else if(total>2e6&&avg>60)title='人生勝利組';
  else if(total>2e6)title='事業有成';
  else if(avg>75)title='幸福知足';
  else if(avg<40)title='坎坷的一生';
  return{total,title};
}
function gameOver(reason){
  S.over=true;render();
  const{total,title}=evaluate();
  // 按照遗嘱分配
  const aliveChildren=S.people.children.filter(c=>c.alive);
  let heirPool=aliveChildren;
  let heirLabel='子女';
  if(S.will&&S.will.type==='single'){
    const chosen=aliveChildren.find(c=>c.id===S.will.heirId);
    if(chosen){heirPool=[chosen];heirLabel=chosen.name}
  }
  const businessesCount=S.businesses.length;
  const html=`
    <p style="font-size:14px;color:var(--ink);margin-bottom:14px">${reason}</p>
    <div class="row"><span class="k">人生評價</span><span class="v">${title}</span></div>
    <div class="row"><span class="k">享年</span><span class="v">${S.age} 歲</span></div>
    <div class="row"><span class="k">總資產</span><span class="v">${fmt(total)} 元</span></div>
    <div class="row"><span class="k">房產 / 車輛</span><span class="v">${S.assets.houses.length} / ${S.assets.cars.length}</span></div>
    <div class="row"><span class="k">信託基金</span><span class="v">${fmt(S.trust)} 元</span></div>
    <div class="row"><span class="k">企業</span><span class="v">${businessesCount} 間</span></div>
    <div class="row"><span class="k">最高學歷</span><span class="v">${S.eduName}${S.major?' · '+(MAJORS.find(m=>m.id===S.major)?.name||''):''}</span></div>
    <div class="row"><span class="k">最後職業</span><span class="v">${S.politician?(S.politician.path==='central'?CENTRAL_RANKS:LOCAL_RANKS)[S.politician.rankIndex].name:S.official?S.official.unit+' '+S.official.rank.name:S.civil?S.civil.unit+' '+S.civil.rank.name:S.military?S.military.rank.name:S.job?S.job.name:'無業'}</span></div>
    <div class="row"><span class="k">婚姻</span><span class="v">${S.married?'已婚':(S.partner?'有伴侶':'未婚')}</span></div>
    <div class="row"><span class="k">心情 / 道德</span><span class="v">${Math.round(S.mood)} / ${Math.round(S.moral)}</span></div>
    ${S.will?`<p class="note">依照你的遺囑，遺產分配給：${heirLabel}</p>`:''}
    ${heirPool.length>0?`<p class="note" style="margin-top:8px">你可以選擇一位子女繼承你的人生（以其當前年齡繼續）。</p>`:''}`;
  const buttons=[];
  if(heirPool.length>0){
    heirPool.forEach(c=>{
      buttons.push({text:`👶 繼承 ${c.name}（${c.age}歲）`,cls:'pri',onClick:()=>{
        const inheritMoney=Math.round(total*(heirPool.length===1?1:1/heirPool.length));
        const inherited={
          name:c.name,gender:c.gender,orientation:S.orientation,
          _inheritMoney:inheritMoney,_inheritAge:c.age,
          eduLevel:c.major?3:(c.job?1:0),eduName:c.major?'大學畢業':(c.job?'畢業':'學生'),
          major:c.major||null,job:c.job||null,
        };
        newGameWithOrigin(null,inherited);
        // 继承企业
        S.businesses.forEach(b=>{S.businesses.push({...b,id:uid()})});
        log(`你以${c.name}（${c.age}歲）的身份開始了新的人生，繼承了 ${fmt(inheritMoney)} 元${businessesCount>0?` 與 ${businessesCount} 間企業`:''}。`,'big');
      }});
    });
  }
  buttons.push({text:'重新開始（新出身）',cls:heirPool.length?'':'pri',onClick:()=>{openOriginSelect()}});
  sheet({title:'人生落幕',body:html,closable:false,buttons});
}
function confirmReset(){
  sheet({title:'重新開始',body:`<p>確定要重新開始嗎？</p><p class="note">當前人生的所有進度都會消失。</p>`,buttons:[{text:'取消'},{text:'確定',cls:'warn',onClick:()=>{openOriginSelect()}}]});
}

/* ══════ 绑定 & 启动 ══════ */
$('resetBtn').onclick=confirmReset;
$('btnActivity').onclick=openActivities;
$('btnProperty').onclick=openProperty;
$('btnRelation').onclick=()=>openRelations();
$('btnPartner').onclick=openPartnerPanel;
$('btnBusiness').onclick=openBusinesses;
$('btnCareer').onclick=openCareer;
$('btnNext').onclick=nextYear;

S={
  name:'',gender:'M',orientation:'hetero',age:0,money:0,mood:70,health:90,iq:50,eq:50,moral:50,
  ap:3,maxAp:3,eduName:'嬰兒',eduLevel:0,school:'',major:null,
  job:null,salary:0,working:false,startup:false,jobPosition:0,workYears:0,renown:0,
  civil:null,official:null,politician:null,military:null,militaryDone:false,militaryDeferred:false,
  prison:null,businesses:[],licenses:{driver:false},assets:{houses:[],cars:[]},
  deposit:0,invest:0,trust:0,trustActive:false,married:false,partner:null,will:null,
  people:{dad:{id:1,name:'—',absent:true,alive:false,role:'父親',rel:0,gender:'M'},mom:{id:2,name:'—',absent:true,alive:false,role:'母親',rel:0,gender:'F'},friends:[],children:[]},
  logs:[],over:false,pendingOffer:false,civilExamAt:-1,gradSchool:false,pet:false,
};

render();
openOriginSelect();
</script>
