<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人生模擬器 · Life Simulator</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#020617; --panel:rgba(15,23,42,.62); --line:rgba(148,163,184,.18);
    --text:#e2e8f0; --dim:#94a3b8; --accent:#818cf8; --gold:#fbbf24;
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:radial-gradient(1100px 560px at 50% -12%,#312e81 0%,#0f172a 55%,#020617 100%);
    background-attachment:fixed;
    color:var(--text);padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;overflow-x:hidden;
  }
  body.modal-open{overflow:hidden}
  #app{width:100%;max-width:760px;display:flex;flex-direction:column;gap:10px;padding-bottom:14px}

  /* ---------- 頂部 ---------- */
  .topbar{
    display:flex;gap:8px;align-items:center;
    background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(168,85,247,.10));
    border:1px solid rgba(148,163,184,.24);border-radius:16px;padding:11px 13px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    position:sticky;top:8px;z-index:20;
  }
  .age-box{display:flex;align-items:baseline;gap:3px;min-width:62px}
  .age-num{
    font-size:33px;font-weight:800;line-height:1;
    background:linear-gradient(180deg,#fff,#a5b4fc);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .age-num.bump{animation:bump .45s cubic-bezier(.34,1.56,.64,1)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
  .age-unit{font-size:12.5px;color:var(--dim)}
  .spacer{flex:1}
  .chip{
    position:relative;font-size:12.5px;padding:6px 11px;border-radius:999px;
    background:rgba(2,6,23,.7);border:1px solid var(--line);
    display:flex;align-items:center;gap:5px;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .chip b{color:var(--gold);font-weight:700}
  .chip.low b{color:#f87171}
  .icon-btn{
    width:34px;height:34px;flex-shrink:0;border-radius:10px;cursor:pointer;
    border:1px solid rgba(248,113,113,.32);background:rgba(239,68,68,.14);
    color:#fca5a5;font-size:17px;line-height:1;display:grid;place-items:center;
    transition:.15s;
  }
  .icon-btn:hover{background:rgba(239,68,68,.3);transform:rotate(-30deg)}
  .icon-btn:active{transform:scale(.9)}

  /* 金額浮字 */
  .float-num{
    position:absolute;left:50%;top:-2px;transform:translateX(-50%);
    font-size:12px;font-weight:800;pointer-events:none;white-space:nowrap;
    animation:floatUp 1.1s ease-out forwards;
  }
  .float-num.up{color:#34d399}
  .float-num.down{color:#f87171}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,4px)}
    20%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-22px)}
  }

  /* ---------- 狀態列 ---------- */
  .statusbar{display:flex;gap:7px;flex-wrap:wrap}
  .badge{
    font-size:12px;padding:5px 11px;border-radius:8px;
    background:rgba(99,102,241,.15);border:1px solid rgba(129,140,248,.28);
    color:#c7d2fe;transition:.15s;
  }
  .badge.job{
    background:rgba(16,185,129,.13);border-color:rgba(52,211,153,.3);color:#6ee7b7;
    cursor:pointer;
  }
  .badge.job:hover{background:rgba(16,185,129,.26)}
  .badge.job.unemployed{
    background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3);color:#fcd34d;
    animation:softPulse 2.2s ease-in-out infinite;
  }
  @keyframes softPulse{0%,100%{opacity:1}50%{opacity:.62}}
  .badge.warn{background:rgba(248,113,113,.13);border-color:rgba(248,113,113,.3);color:#fca5a5}

  /* ---------- 屬性 ---------- */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:8px 10px;position:relative;overflow:hidden;
    transition:border-color .3s;
  }
  .stat-top{display:flex;justify-content:space-between;align-items:center;
    font-size:12.5px;margin-bottom:6px;color:#cbd5e1}
  .stat-val{display:flex;align-items:baseline;gap:4px}
  .stat-val b{font-variant-numeric:tabular-nums;color:#f1f5f9;font-size:13.5px}
  .delta{font-size:11px;font-weight:800;animation:deltaPop 1.6s ease-out forwards}
  .delta.up{color:#34d399}
  .delta.down{color:#f87171}
  @keyframes deltaPop{
    0%{opacity:0;transform:translateY(5px) scale(.8)}
    25%{opacity:1;transform:translateY(0) scale(1.12)}
    70%{opacity:1;transform:none}
    100%{opacity:0;transform:translateY(-4px)}
  }
  .bar{height:7px;background:rgba(148,163,184,.14);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;transition:width .45s cubic-bezier(.4,0,.2,1)}

  /* ---------- 日誌 ---------- */
  .log{
    background:rgba(2,6,23,.6);border:1px solid var(--line);
    border-radius:16px;padding:9px;height:200px;overflow-y:auto;
    display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.55;
    scroll-behavior:smooth;
  }
  .log::-webkit-scrollbar{width:5px}
  .log::-webkit-scrollbar-thumb{background:rgba(99,102,241,.45);border-radius:3px}
  .log:empty::after{
    content:'人生剛剛開始…';color:#475569;font-size:12.5px;
    display:grid;place-items:center;height:100%;
  }
  .log-item{
    padding:5px 9px;border-radius:8px;background:rgba(30,41,59,.46);
    border-left:3px solid #475569;animation:fadeIn .32s ease;
  }
  .log-item.good{border-left-color:#34d399;background:rgba(16,185,129,.10)}
  .log-item.bad{border-left-color:#f87171;background:rgba(239,68,68,.10)}
  .log-item.big{border-left-color:#fbbf24;background:rgba(251,191,36,.11);font-weight:600}
  .log-age{color:#64748b;font-size:11px;margin-right:6px;font-variant-numeric:tabular-nums}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

  /* ---------- 按鈕 ---------- */
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btns button{
    font-family:inherit;font-size:13.5px;padding:13px 6px;border-radius:14px;cursor:pointer;
    border:1px solid rgba(148,163,184,.26);background:rgba(30,41,59,.82);color:var(--text);
    font-weight:600;transition:.16s;display:flex;align-items:center;justify-content:center;gap:6px;
    user-select:none;
  }
  .btns button:hover:not(:disabled){background:rgba(79,70,229,.38);border-color:var(--accent);transform:translateY(-1px)}
  .btns button:active:not(:disabled){transform:scale(.96)}
  .btns button:disabled{opacity:.3;cursor:not-allowed}
  .btns .next{
    grid-column:1/-1;background:linear-gradient(135deg,#4f46e5,#9333ea);
    border:none;padding:16px;font-size:15px;letter-spacing:.5px;
    box-shadow:0 6px 22px rgba(99,102,241,.35);
  }
  .btns .next:hover:not(:disabled){background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 8px 28px rgba(139,92,246,.5)}
  .btns .next.ready{animation:glow 1.8s ease-in-out infinite}
  @keyframes glow{
    0%,100%{box-shadow:0 6px 22px rgba(99,102,241,.35)}
    50%{box-shadow:0 6px 30px rgba(168,85,247,.75)}
  }
  @media(min-width:540px){.btns{grid-template-columns:1fr 1fr 1fr 1fr}}

  /* ---------- Modal ---------- */
  #overlay{
    position:fixed;inset:0;background:rgba(2,6,23,.8);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    display:none;align-items:center;justify-content:center;padding:16px;z-index:99;
  }
  #overlay.show{display:flex}
  .modal{
    width:100%;max-width:460px;max-height:84vh;overflow-y:auto;
    background:linear-gradient(160deg,#1e293b,#0f172a);
    border:1px solid rgba(129,140,248,.34);border-radius:20px;padding:18px;
    box-shadow:0 26px 70px rgba(0,0,0,.65);animation:pop .24s cubic-bezier(.34,1.4,.64,1);
    -webkit-overflow-scrolling:touch;
  }
  .modal::-webkit-scrollbar{width:5px}
  .modal::-webkit-scrollbar-thumb{background:rgba(99,102,241,.4);border-radius:3px}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
  .modal h2{font-size:17px;margin-bottom:13px;color:#c7d2fe;display:flex;align-items:center;gap:7px}
  .modal-body{font-size:13.5px;line-height:1.65;color:#cbd5e1}
  .modal-body p{margin-bottom:9px}
  .modal-body p:last-child{margin-bottom:0}
  .modal-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .modal-btns button{
    flex:1;min-width:104px;font-family:inherit;font-size:13px;padding:12px 10px;border-radius:11px;
    border:1px solid rgba(148,163,184,.26);background:rgba(51,65,85,.85);color:var(--text);
    cursor:pointer;font-weight:600;transition:.15s;
  }
  .modal-btns button:hover:not(:disabled){background:rgba(99,102,241,.45);border-color:var(--accent)}
  .modal-btns button:active:not(:disabled){transform:scale(.97)}
  .modal-btns button:disabled{opacity:.32;cursor:not-allowed}
  .modal-btns button.primary{background:linear-gradient(135deg,#6366f1,#a855f7);border:none}
  .modal-btns button.danger{background:rgba(239,68,68,.22);border-color:rgba(248,113,113,.45);color:#fca5a5}
  .modal-btns button.danger:hover:not(:disabled){background:rgba(239,68,68,.42)}
  .modal-btns button.good{background:rgba(16,185,129,.22);border-color:rgba(52,211,153,.45);color:#6ee7b7}
  .modal-btns button.good:hover:not(:disabled){background:rgba(16,185,129,.4)}

  .act-list{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .act{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
    padding:10px 12px;border-radius:11px;border:1px solid rgba(148,163,184,.2);
    background:rgba(30,41,59,.68);color:var(--text);cursor:pointer;font-family:inherit;
    transition:.15s;width:100%;
  }
  .act:hover:not(:disabled){background:rgba(79,70,229,.32);border-color:var(--accent);transform:translateX(3px)}
  .act:active:not(:disabled){transform:translateX(3px) scale(.985)}
  .act:disabled{opacity:.36;cursor:not-allowed;transform:none}
  .act-name{font-size:13.5px;font-weight:700}
  .act-desc{font-size:11.5px;color:var(--dim)}
  .act-warn{color:#fbbf24}

  .prop-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 12px;background:rgba(30,41,59,.68);border-radius:11px;
    margin-bottom:7px;font-size:13px;
  }
  .prop-row b{color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}
  .prop-row small{display:block;color:#64748b;font-size:11px;font-weight:400}
  input[type=number]{
    width:100%;padding:12px;border-radius:11px;border:1px solid rgba(148,163,184,.28);
    background:rgba(2,6,23,.72);color:var(--text);font-size:14.5px;
    font-family:inherit;outline:none;margin-bottom:10px;
    font-variant-numeric:tabular-nums;
  }
  input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(129,140,248,.15)}
  .rel-row{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:13px}
  .rel-row>span:first-child{width:66px;flex-shrink:0}
  .rel-row .bar{flex:1}
  .rel-row b{width:30px;text-align:right;font-variant-numeric:tabular-nums}
  .hint{font-size:12px;color:var(--accent);margin-top:8px;line-height:1.6}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(16px);
    background:rgba(30,41,59,.97);border:1px solid rgba(129,140,248,.5);color:var(--text);
    padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:500;
    opacity:0;pointer-events:none;transition:.28s;z-index:999;
    box-shadow:0 10px 30px rgba(0,0,0,.55);max-width:86vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:380px){
    .age-num{font-size:28px}
    .chip{font-size:11.5px;padding:5px 9px}
    .btns button{font-size:12.5px;padding:12px 4px}
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="age-box">
      <span class="age-num" id="ageNum">0</span><span class="age-unit">歲</span>
    </div>
    <div class="spacer"></div>
    <div class="chip" id="moneyChip">💰 <b id="moneyTxt">0</b></div>
    <div class="chip" id="apChip">⚡ <b id="apTxt">3</b><span style="color:#64748b">/3</span></div>
    <button class="icon-btn" id="resetBtn" title="重新開始">↺</button>
  </header>

  <div class="statusbar">
    <span class="badge" id="eduBadge">👶 嬰兒</span>
    <span class="badge job" id="jobBadge">🙈 無業</span>
    <span class="badge" id="maritalBadge" style="display:none">💍 已婚</span>
  </div>

  <div class="stats" id="stats"></div>

  <div class="log" id="log"></div>

  <div class="btns">
    <button id="btnPartner">💑 伴侶</button>
    <button id="btnProperty">🏦 財產</button>
    <button id="btnRelation">👥 關係</button>
    <button id="btnActivity">🎯 活動</button>
    <button class="next" id="btnNext">⏭ 度過這一年</button>
  </div>
</div>

<div id="overlay"></div>
<div id="toast"></div>

<script>
/* ============================================================
   工具
============================================================ */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rnd   = (a,b)=>a+Math.random()*(b-a);
const ri    = (a,b)=>Math.floor(rnd(a,b+1));
const $     = id=>document.getElementById(id);

function fmt(n){
  n = Math.round(n);
  const neg = n<0?'-':''; n = Math.abs(n);
  if(n>=1e8) return neg+(n/1e8).toFixed(2)+'億';
  if(n>=1e4) return neg+(n/1e4).toFixed(1)+'萬';
  return neg+n.toLocaleString();
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'),1900);
}

/* ============================================================
   狀態
============================================================ */
let S, prevSnap = {}, prevMoney = 0, prevAge = 0;

function newGame(){
  S = {
    age:0, money:0, mood:70, health:90, iq:50, eq:50, moral:50,
    ap:3, maxAp:3,
    eduName:'嬰兒', eduLevel:0, school:'',
    job:null, salary:0, working:false, startup:false,
    rel:{ 家人:70, 朋友:0, 戀人:0 },
    married:false, kids:0,
    deposit:0, invest:0,
    logs:[], over:false, pendingJobOffer:false,
    civilExamYear:-1,
  };
  prevSnap = {};
  prevMoney = 0;
  prevAge = 0;
  addLog('👶 你出生了！一段嶄新的人生就此展開。','big');
  closeModal();
  render();
  // 讓首幀不顯示 delta
  prevSnap = {mood:S.mood,health:S.health,iq:S.iq,eq:S.eq,moral:S.moral};
}

function addLog(text,cls){
  S.logs.unshift({age:S.age,text,cls:cls||''});
  if(S.logs.length>160) S.logs.pop();
}

function normalize(){
  S.mood   = clamp(S.mood,0,100);
  S.health = clamp(S.health,0,100);
  S.iq     = clamp(S.iq,0,100);
  S.eq     = clamp(S.eq,0,100);
  S.moral  = clamp(S.moral,0,100);
  S.money  = Math.max(0,S.money);
  S.deposit= Math.max(0,S.deposit);
  S.invest = Math.max(0,S.invest);
  for(const k in S.rel) S.rel[k] = clamp(S.rel[k],0,100);
}

/* ============================================================
   渲染
============================================================ */
const STAT_DEFS = [
  {key:'mood',  label:'心情',icon:'😊',color:'#fbbf24'},
  {key:'health',label:'健康',icon:'❤️',color:'#f87171'},
  {key:'iq',    label:'智商',icon:'🧠',color:'#60a5fa'},
  {key:'eq',    label:'情商',icon:'💬',color:'#c084fc'},
  {key:'moral', label:'道德',icon:'⚖️',color:'#34d399'},
];

function render(){
  /* 年齡 */
  const ageEl = $('ageNum');
  if(S.age !== prevAge && prevAge !== 0){
    ageEl.classList.remove('bump');
    void ageEl.offsetWidth;
    ageEl.classList.add('bump');
  }
  ageEl.textContent = S.age;
  prevAge = S.age;

  /* 金錢 */
  const moneyEl = $('moneyTxt');
  moneyEl.textContent = fmt(S.money);
  if(S.money !== prevMoney && prevMoney !== 0){
    const d = S.money - prevMoney;
    const el = document.createElement('span');
    el.className = 'float-num ' + (d>0?'up':'down');
    el.textContent = (d>0?'+':'') + fmt(d);
    $('moneyChip').appendChild(el);
    setTimeout(()=>el.remove(),1200);
  }
  prevMoney = S.money;
  $('moneyChip').classList.toggle('low', S.money <= 0);

  /* 行動點 */
  $('apTxt').textContent = S.ap;
  $('apChip').classList.toggle('low', S.ap === 0);

  /* 徽章 */
  $('eduBadge').textContent = S.school
    ? '🏫 ' + S.school
    : (S.eduName === '畢業' ? '🎓 已畢業' : '📖 ' + S.eduName);

  const jobBadge = $('jobBadge');
  if(S.job){
    jobBadge.textContent = '💼 ' + S.job.name;
    jobBadge.className = 'badge job';
  }else{
    const canWork = S.age >= 16 && !S.school && !S.over;
    jobBadge.textContent = canWork ? '🔍 求職中' : '🙈 無業';
    jobBadge.className = 'badge job' + (canWork ? ' unemployed' : '');
  }

  const mb = $('maritalBadge');
  if(S.married){
    mb.style.display='';
    mb.textContent = '💍 已婚 · ' + S.kids + ' 子';
  }else if(S.rel.戀人 > 0){
    mb.style.display='';
    mb.textContent = '💕 戀愛中';
    mb.className = 'badge';
  }else{
    mb.style.display='none';
  }

  /* 屬性 */
  $('stats').innerHTML = STAT_DEFS.map(d=>{
    const v = clamp(S[d.key],0,100);
    const prev = prevSnap[d.key];
    let deltaHtml = '';
    if(prev !== undefined && Math.round(prev) !== Math.round(v)){
      const dv = Math.round(v) - Math.round(prev);
      deltaHtml = `<span class="delta ${dv>0?'up':'down'}">${dv>0?'+':''}${dv}</span>`;
    }
    return `<div class="stat">
      <div class="stat-top"><span>${d.icon} ${d.label}</span>
        <span class="stat-val"><b>${Math.round(v)}</b>${deltaHtml}</span></div>
      <div class="bar"><i style="width:${v}%;background:${d.color}"></i></div>
    </div>`;
  }).join('');
  prevSnap = {mood:S.mood,health:S.health,iq:S.iq,eq:S.eq,moral:S.moral};

  /* 日誌 */
  const logEl = $('log');
  logEl.innerHTML = S.logs.map(l=>
    `<div class="log-item ${l.cls}"><span class="log-age">${l.age}歲</span>${l.text}</div>`
  ).join('');
  logEl.scrollTop = 0;

  /* 按鈕 */
  $('btnPartner').disabled  = !(S.rel.戀人 > 0) || S.over;
  $('btnProperty').disabled = S.age < 16 || S.over;
  $('btnRelation').disabled = S.over;
  $('btnActivity').disabled = S.over;
  const next = $('btnNext');
  next.disabled = S.over;
  next.classList.toggle('ready', !S.over && S.ap === 0);
  next.textContent = S.over ? '🕯️ 人生已落幕' : '⏭ 度過這一年';
}

/* ============================================================
   Modal
============================================================ */
function showModal({title, body, buttons, dismissible=true, onMount}){
  const ov = $('overlay');
  ov.innerHTML = `<div class="modal">
      <h2>${title}</h2>
      <div class="modal-body">${body}</div>
      <div class="modal-btns"></div>
    </div>`;
  const box = ov.querySelector('.modal-btns');
  (buttons || [{text:'關閉'}]).forEach(b=>{
    const el = document.createElement('button');
    el.textContent = b.text;
    if(b.cls) el.className = b.cls;
    if(b.disabled) el.disabled = true;
    el.onclick = ()=>{
      const keep = b.onClick ? b.onClick() === true : false;
      if(!keep) closeModal();
    };
    box.appendChild(el);
  });
  ov.classList.add('show');
  document.body.classList.add('modal-open');
  ov.onclick = e=>{ if(e.target === ov && dismissible) closeModal(); };
  if(onMount) onMount();
}

function closeModal(){
  $('overlay').classList.remove('show');
  $('overlay').innerHTML = '';

function actionUnlocked(a){
  if(S.age < a.min) return false;
  if(a.max && S.age > a.max) return false;
  return true;
}
function actionBlockReason(a){
  if(S.ap < a.ap) return '行動點不足';
  if(a.cost && S.money < a.cost) return '金錢不足';
  return '';
}

function actBtnHtml(a){
  const reason = actionBlockReason(a);
  return `<button class="act" data-id="${a.id}" ${reason?'disabled':''}>
      <span class="act-name">${a.name}</span>
      <span class="act-desc">${a.desc}<span class="act-warn">${reason?'　⚠️ '+reason:''}</span></span>
    </button>`;
}

function openActivities(){
  if(S.over) return;
  const list = ACTIONS.filter(actionUnlocked);
  const html = `<p class="hint">剩餘行動點：<b id="apInline" style="color:#fbbf24">${S.ap}</b> / ${S.maxAp}</p>
    <div class="act-list" id="actList">${list.map(actBtnHtml).join('')}</div>`;

  showModal({
    title:'🎯 活動 — 做任何事，去任何地方',
    body: html,
    buttons:[{text:'關閉'}],
    onMount(){
      $('actList').addEventListener('click', e=>{
        const btn = e.target.closest('.act');
        if(!btn || btn.disabled) return;
        const a = ACTIONS.find(x=>x.id===btn.dataset.id);
        if(!a) return;
        if(S.ap < a.ap) return toast('行動點不足');
        if(a.cost && S.money < a.cost) return toast('金錢不足');
        if(a.cost) S.money -= a.cost;
        S.ap -= a.ap;
        a.run(S);
        normalize();
        render();
        refreshActPanel();
      });
    }
  });
}

function refreshActPanel(){
  const apEl = $('apInline');
  if(apEl) apEl.textContent = S.ap;
  document.querySelectorAll('#actList .act').forEach(btn=>{
    const a = ACTIONS.find(x=>x.id===btn.dataset.id);
    if(!a) return;
    const reason = actionBlockReason(a);
    btn.disabled = !!reason;
    const warn = btn.querySelector('.act-warn');
    if(warn) warn.textContent = reason ? '　⚠️ '+reason : '';
  });
}

function openProperty(){
  if(S.age < 16) return toast('未滿 16 歲，無法管理財產');
  if(S.over) return;

  const html = `
    <div class="prop-row"><span>💰 現金</span><b>${fmt(S.money)} 元</b></div>
    <div class="prop-row"><span>🏦 定期存款<small>年利率 3.5%，穩定增值</small></span><b>${fmt(S.deposit)} 元</b></div>
    <div class="prop-row"><span>📈 投資組合<small>高風險，每年浮動 -45% ~ +65%</small></span><b>${fmt(S.invest)} 元</b></div>
    <input type="number" id="amtInput" placeholder="輸入金額…" min="1" inputmode="numeric">
    <div class="modal-btns" style="margin-top:0">
      <button data-act="dep_in" class="good">存入定期</button>
      <button data-act="dep_out">取出定期</button>
      <button data-act="inv_in" class="primary">投入投資</button>
      <button data-act="inv_out">贖回投資</button>
    </div>`;

  const readAmt = ()=>{
    const el = $('amtInput');
    const v = Math.floor(parseFloat(el.value));
    if(!v || v <= 0){ toast('請輸入有效金額'); return 0; }
    return v;
  };

  const map = {
    dep_in: ()=>{ const a=readAmt(); if(!a) return; if(a>S.money) return toast('現金不足');
      S.money-=a; S.deposit+=a; addLog(`🏦 你將 ${fmt(a)} 元存入定期存款。`); },
    dep_out:()=>{ const a=readAmt(); if(!a) return; if(a>S.deposit) return toast('定期存款不足');
      S.deposit-=a; S.money+=a; addLog(`🏦 你取出了 ${fmt(a)} 元定期存款。`); },
    inv_in: ()=>{ const a=readAmt(); if(!a) return; if(a>S.money) return toast('現金不足');
      S.money-=a; S.invest+=a; addLog(`📈 你投入 ${fmt(a)} 元到投資組合。`); },
    inv_out:()=>{ const a=readAmt(); if(!a) return; if(a>S.invest) return toast('投資組合不足');
      S.invest-=a; S.money+=a; addLog(`📉 你從投資組合贖回了 ${fmt(a)} 元。`); },
  };

  showModal({
    title:'🏦 財產管理', body:html, buttons:[{text:'關閉'}],
    onMount(){
      document.querySelectorAll('[data-act]').forEach(b=>{
        b.onclick = ()=>{
          map[b.dataset.act]();
          normalize(); render(); openProperty();
        };
      });
      $('amtInput').focus();
    }
  });
}

function examScore(){
  return Math.round(clamp(300 + S.iq*3 + S.eq*1 + rnd(-30,30), 0, 750));

  const sc = examScore();

    addLog(`📝 中考成績 ${sc} 分 → 你進入了「職業學校」。`,'bad');

}

function examGaokao(){
  if(S.school==='職業學校'){

function openJobSearch(){
  if(S.over) return;
  if(S.age < 16) return toast('未滿 16 歲，無法工作');
  if(S.school) return toast('求學期間無法全職工作');

  /* 已就業 → 提供辭職 */
  if(S.job){
    showModal({
      title:'💼 目前工作',
      body:`<p>你目前是一名 <b style="color:#6ee7b7">${S.job.name}</b>。</p>
            <p>年薪：<b style="color:#fbbf24">${S.startup?'不固定（高風險）':fmt(S.salary)+' 元'}</b></p>
            <p class="hint">辭職後可重新求職。</p>`,
      buttons:[
        {text:'辭職', cls:'danger', onClick:()=>{
          addLog(`💼 你辭去了「${S.job.name}」的工作。`,'bad');
          S.job=null; S.salary=0; S.working=false; S.startup=false;
          S.mood -= 8;
          normalize(); render();
          setTimeout(openJobSearch, 60);
        }},
        {text:'繼續工作'}
      ]
    });
    return;
  }

  const list = JOBS.filter(j=>j.need<=S.eduLevel);
  let html = `<p class="hint">依你的學歷（${S.eduName}），以下工作向你敞開大門：</p>
    <div class="act-list">`;
  list.forEach(j=>{
    const locked = j.startup && S.money < 50000;
    const tried = j.exam && S.civilExamYear === S.age;
    html += `<button class="act" data-job="${j.id}" ${(locked||tried)?'disabled':''}>
      <span class="act-name">${j.name}${j.exam?'　📝':''}</span>
      <span class="act-desc">年薪 ${j.startup?'不固定（需 5 萬啟動資金）':fmt(j.salary)+' 元'}
        ${tried?'　⚠️ 今年考試未通過':(locked?'　⚠️ 資金不足':'')}</span>
    </button>`;
  });
  html += `</div>`;

  showModal({
    title:'💼 選擇職業', body:html,
    buttons:[{text:'先不工作'}],
    onMount(){
      document.querySelectorAll('[data-job]').forEach(btn=>{
        btn.onclick = ()=>{
          const job = JOBS.find(j=>j.id===btn.dataset.job);
          if(!job) return;
          if(job.startup && S.money < 50000){ toast('資金不足（需 5 萬）'); return; }

          if(job.exam){
            if(S.civilExamYear === S.age){ toast('今年已考過，明年再試'); return; }
            S.civilExamYear = S.age;
            const pass = (S.iq*0.6 + S.eq*0.4) > 55;
            if(!pass){
              addLog('📝 你報考公務員，可惜未通過考試。','bad');
              normalize(); render(); closeModal();
              setTimeout(()=>toast('考試未通過，明年再來吧…'),120);
              return;
            }
            addLog('📝 你順利通過公務員考試！','good');
          }

          if(job.startup) S.money -= 50000;

          S.job = job;
          S.salary = job.salary;
          S.working = true;
          S.startup = !!job.startup;
          S.mood += 10;
          addLog(`💼 你成為了一名「${job.name}」${job.startup?'，開始了創業之路。':'，年薪 '+fmt(job.salary)+' 元。'}`,'big');
          normalize(); render(); closeModal();
        };
      });
    }
  });
}

    if(Math.random()<0.5){
      s.salary = Math.round(s.salary*1.15); s.mood += 15;
      addLog('📈 你表現出色，被公司加薪了！年薪提升。','good');
    }else{
      s.mood -= 12;
      addLog('📉 公司業績不佳，獎金被砍，心情 -12。','bad');
    }}},

  {w:3, min:18, cond:s=>s.working && !s.startup, run:s=>{
    if(Math.random()<0.22){
      s.working=false; s.job=null; s.salary=0; s.mood-=20;
      addLog('📉 你被公司裁員了……需要重新找工作。','bad');
    }else{
      s.mood += 5;
      addLog('☕ 職場生活波瀾不驚，你安然度過了一年。');
    }}},

  {w:3, min:20, run:s=>{
    s.mood -= 8; s.eq += 3;
    addLog('💔 你經歷了一段感情的波折，情商 +3，心情 -8。','bad');}},

  {w:3, min:18, run:s=>{
    s.moral += 5; s.mood += 8;
    addLog('🤝 你幫助了一位陌生人，內心感到溫暖，道德 +5。','good');}},

  {w:2, min:30, run:s=>{
    s.health -= 12; s.money -= 8000;
    addLog('🏥 你生了一場病，住院治療，健康 -12，花費 8000 元。','bad');}},

  {w:2, min:0, run:s=>{
    s.iq += 5; s.mood += 5;
    addLog('💡 你靈光一閃，想通了很多事，智商 +5。','good');}},

  {w:2, min:6, run:s=>{
    s.moral -= 6; s.money += 1500;
    addLog('😈 你做了一件不太光彩的事，道德 -6，但賺了 1500 元。','bad');}},

  {w:2, min:25, cond:s=>s.married, run:s=>{
    s.mood += 20; s.rel.戀人 = clamp(s.rel.戀人+10,0,100);
    addLog('💞 你和伴侶一起度過了一段甜蜜時光，感情升溫。','good');}},

  {w:2, min:35, run:s=>{
    s.mood -= 12; s.moral += 3;
    addLog('🕯️ 一位親人離世，你感到悲痛，心情 -12。','bad');}},

  {w:2, min:16, run:s=>{
    s.mood -= 5; s.eq += 2;
    addLog('😮‍💨 生活中總有些不如意，心情 -5，情商 +2。');}},

  {w:1, min:20, cond:s=>s.money>50000, run:s=>{
    const m = ri(10000,60000); s.money += m;
    addLog(`💸 你抓住了一個不錯的商機，額外收入 ${fmt(m)} 元！`,'good');}},

  {w:1, min:20, cond:s=>s.money>30000, run:s=>{
    const m = Math.min(s.money, ri(10000,40000)); s.money -= m;
    addLog(`💸 一筆意外開銷讓你損失了 ${fmt(m)} 元。`,'bad');}},

  {w:2, min:8, run:s=>{
    s.mood += 8; s.health += 2;
    addLog('🐶 你遇到一隻可愛的流浪狗，陪牠玩了一下午，心情 +8。','good');}},
];

function fireEvent(){
  const pool = EVENTS.filter(e=>
    (!e.min || S.age>=e.min) &&
    (!e.max || S.age<=e.max) &&
    (!e.cond || e.cond(S))
  );
  if(!pool.length) return;
  const total = pool.reduce((a,b)=>a+(b.w||1),0);
  let r = Math.random()*total;
  for(const e of pool){
    r -= (e.w||1);
    if(r <= 0){ e.run(S); return; }
  }
}

/* ============================================================
   年度推進
============================================================ */
function nextYear(){
  if(S.over) return;
  if(S.ap > 0 && S.age >= 6){
    showModal({
      title:'⏭ 度過這一年？',
      body:`<p>你還有 <b style="color:#fbbf24">${S.ap}</b> 個行動點尚未使用，確定要直接度過這一年嗎？</p>`,
      buttons:[
        {text:'先去安排活動'},
        {text:'確定度過', cls:'primary', onClick:()=>{ setTimeout(doNextYear,60); }}
      ]
    });
    return;
  }
  doNextYear();
}

function doNextYear(){
  if(S.over) return;
  closeModal();

  const beforeMoney = S.money + S.deposit + S.invest;

  S.age++;
  S.ap = S.maxAp;
  S.pendingJobOffer = false;

  /* 生理變化 */
  if(S.age>25) S.mood -= 2;
  if(S.age>30) S.health -= 0.8;
  if(S.age>45) S.health -= 1.2;
  if(S.age>65) S.health -= 2.0;
  if(S.age>80) S.health -= 2.5;

  /* 收入 */
  if(S.working && S.job){
    if(S.startup){
      const skill = (S.iq + S.eq) / 200;
      const gain = Math.round(-30000 + skill*120000 + rnd(-60000,160000));
      S.money += gain;
      if(gain >= 0){
        addLog(`🚀 你的生意今年賺了 ${fmt(gain)} 元。`,'good'); S.mood += 10;
      }else{
        addLog(`🚀 你的生意今年虧損 ${fmt(-gain)} 元。`,'bad'); S.mood -= 15;
      }
    }else{
      S.money += S.salary;
      addLog(`💼 你工作一年，獲得薪水 ${fmt(S.salary)} 元。`);
    }
  }else if(S.age <= 18){
    const pocket = 200 * S.age;
    S.money += pocket;
    addLog(`🪙 父母給了你 ${fmt(pocket)} 元零用錢。`);
  }

  /* 財產增值 */
  if(S.deposit > 0){
    const it = S.deposit * 0.035;
    S.deposit += it;
    addLog(`🏦 定期存款產生利息 ${fmt(it)} 元。`,'good');
  }
  if(S.invest > 0){
    const rate = rnd(-0.45, 0.65);
    const before = S.invest;
    S.invest = Math.max(0, S.invest * (1 + rate));
    const diff = S.invest - before;
    if(diff >= 0){
      addLog(`📈 投資組合上漲，獲利 ${fmt(diff)} 元。`,'good'); S.mood += 5;
    }else{
      addLog(`📉 投資組合下跌，虧損 ${fmt(-diff)} 元。`,'bad'); S.mood -= 8;
    }
  }

  /* 家庭開銷 */
  if(S.married || S.kids > 0){
    const cost = 12000 + S.kids*15000;
    S.money -= cost;
    addLog(`🏠 家庭開銷 ${fmt(cost)} 元。`);
  }

  /* 里程碑 */
  switch(S.age){
    case 3:  S.school='幼兒園'; S.eduName='幼兒園';
             addLog('🏫 你進入了幼兒園，開始接觸外面的世界。','big'); break;
    case 6:  S.school='小學'; S.eduName='小學';
             addLog('🏫 你上小學了，嶄新的學習生活開始了。','big'); break;
    case 12: S.school='初中'; S.eduName='初中';
             addLog('🏫 你升上了初中。','big'); break;
    case 15: examZhongkao(); break;
    case 18: examGaokao(); break;
    case 21: if(S.school==='專科院校') graduate(); break;
    case 22: if(S.school==='本科大學'||S.school==='名牌大學') graduate(); break;
    case 60: if(S.working){
               addLog('🎉 你退休了！開始享受退休生活。','big');
               S.working=false; S.job=null; S.salary=0; S.startup=false;
             } break;
  }

  /* 生活壓力 */
  if(S.mood < 20){ S.health -= 3; addLog('😞 心情長期低落，健康受到影響。','bad'); }
  if(S.health < 30){ S.mood -= 3; }

  /* 隨機事件 */
  fireEvent();

  normalize();
  render();

  /* 死亡判定 */
  if(S.health <= 0){
    gameOver('💀 你的健康徹底崩潰，人生畫下了句點。');
    return;
  }
  if(S.age >= 100){
    gameOver('🕯️ 你活到了 100 歲，安詳地走完了這一生。');
    return;
  }

  /* 畢業求職 */
  if(S.pendingJobOffer && !S.job && !S.school){
    setTimeout(openJobSearch, 320);
  }
}

/* ============================================================
   結局
============================================================ */
function evaluate(){
  const total = S.money + S.deposit + S.invest;
  const avg = (S.mood + S.health + S.iq + S.eq + S.moral) / 5;
  let title = '平凡的一生';
  if(total > 2e7 && avg > 70)      title = '傳奇人生';
  else if(total > 1e7)             title = '億萬富豪';
  else if(total > 2e6 && avg > 60) title = '人生勝利組';
  else if(total > 2e6)             title = '事業有成';
  else if(avg > 75)                title = '幸福知足';
  else if(avg < 40)                title = '坎坷的一生';
  return {total, title};
}

function gameOver(reason){
  S.over = true;
  render();
  const {total,title} = evaluate();
  const html = `
    <p style="font-size:15px;color:#f1f5f9;margin-bottom:12px">${reason}</p>
    <div class="prop-row"><span>🏆 人生評價</span><b>${title}</b></div>
    <div class="prop-row"><span>享年</span><b>${S.age} 歲</b></div>
    <div class="prop-row"><span>💰 總資產</span><b>${fmt(total)} 元</b></div>
    <div class="prop-row"><span>🏫 最高學歷</span><b>${S.eduName}</b></div>
    <div class="prop-row"><span>💼 最後職業</span><b>${S.job?S.job.name:'無業'}</b></div>
    <div class="prop-row"><span>💍 婚姻</span><b>${S.married?'已婚':'未婚'}</b></div>
    <div class="prop-row"><span>👶 子女</span><b>${S.kids} 位</b></div>
    <div class="prop-row"><span>😊 心情 / ⚖️ 道德</span><b>${Math.round(S.mood)} / ${Math.round(S.moral)}</b></div>`;

  showModal({
    title:'🕯️ 人生落幕',
    body: html,
    dismissible: false,
    buttons:[
      {text:'🔄 重新開始', cls:'primary', onClick:()=>{ newGame(); }}
    ]
  });
}

/* ============================================================
   重新開始
============================================================ */
function confirmReset(){
  showModal({
    title:'↺ 重新開始',
    body:`<p>確定要重新開始嗎？</p>
          <p class="hint">當前人生的所有進度將會丟失。</p>`,
    buttons:[
      {text:'取消'},
      {text:'確定重新開始', cls:'danger', onClick:()=>{ newGame(); }}
    ]
  });
}

/* ============================================================
   事件綁定 & 啟動
============================================================ */
$('resetBtn').onclick   = confirmReset;
$('btnActivity').onclick= openActivities;
$('btnProperty').onclick= openProperty;
$('btnRelation').onclick= openRelations;
$('btnPartner').onclick = openPartner;
$('btnNext').onclick    = nextYear;
$('jobBadge').onclick   = openJobSearch;

newGame();
</script>
