<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>年歲 · 人生模擬</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#14161a;--bg2:#191c21;--card:#1e2126;--card2:#252931;--line:#2e333b;--line2:#3a404a;--ink:#dcd8d0;--ink2:#989da4;--ink3:#686d75;--amber:#d4a05a;--amber2:#a87c42;--sage:#8aa896;--rust:#c07a6d;--sky:#7d9cc0;--plum:#a88ab8}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);padding:0 14px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;overflow-x:hidden;font-feature-settings:"tnum";line-height:1.5}
body.locked{overflow:hidden}
#app{width:100%;max-width:680px;padding-top:calc(14px + env(safe-area-inset-top))}
.top{display:flex;align-items:flex-end;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.who{flex:1;min-width:0}
.who-name{font-size:11.5px;color:var(--ink3);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-age{display:flex;align-items:baseline;gap:4px;line-height:1}
.who-age b{font-family:Georgia,"Songti TC",serif;font-size:38px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.who-age i{font-style:normal;font-size:12px;color:var(--ink3);padding-bottom:5px}
.who-age b.bump{animation:bump .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.purses{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;color:var(--ink2)}
.purses .p{display:flex;gap:6px;align-items:baseline;position:relative}
.purses .p b{color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
.purses .p.zero b{color:var(--rust)}
.purses .p.debt b{color:var(--rust)}
.purses .p .lbl{font-size:11px;color:var(--ink3)}
.reset{width:32px;height:32px;flex-shrink:0;border-radius:8px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-size:15px;display:grid;place-items:center;transition:.15s;margin-bottom:1px}
.reset:hover{border-color:var(--rust);color:var(--rust)}
.fnum{position:absolute;right:0;top:-1px;font-size:11.5px;font-weight:700;pointer-events:none;white-space:nowrap;animation:fnum 1.1s ease-out forwards}
.fnum.up{color:var(--sage)}.fnum.down{color:var(--rust)}
@keyframes fnum{0%{opacity:0;transform:translateY(3px)}20%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.idbar{display:flex;flex-wrap:wrap;gap:0;align-items:center;font-size:12px;color:var(--ink2);padding:10px 0 12px}
.idbar .cell{padding:0 10px;border-right:1px solid var(--line);white-space:nowrap}
.idbar .cell:first-child{padding-left:0}
.idbar .cell:last-child{border-right:0}
.idbar .cell button{font:inherit;background:none;border:0;color:var(--amber);cursor:pointer;padding:0;border-bottom:1px dashed var(--amber2)}
.idbar .warn{color:var(--rust)}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-bottom:14px}
.attr-h{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:4px}
.attr-h .v{color:var(--ink);font-variant-numeric:tabular-nums;font-size:12.5px}
.attr-h .v .d{font-size:10.5px;font-weight:700;margin-left:3px;animation:dp 1.6s ease-out forwards}
.attr-h .v .d.up{color:var(--sage)}.attr-h .v .d.down{color:var(--rust)}
@keyframes dp{0%{opacity:0}20%{opacity:1}75%{opacity:1}100%{opacity:0}}
.track{height:4px;background:#262b32;border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.diary{border-top:1px solid var(--line);border-bottom:1px solid var(--line);height:214px;overflow-y:auto;margin-bottom:14px;padding:2px 0}
.diary::-webkit-scrollbar{width:4px}
.diary::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.e{display:flex;gap:10px;padding:7px 2px 7px 0;font-size:12.8px;line-height:1.55;animation:fe .3s ease;border-bottom:1px dashed rgba(58,64,74,.45)}
.e:last-child{border-bottom:0}
.e .t{flex-shrink:0;width:40px;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:2px;text-align:right}
.e .x{flex:1;color:var(--ink2)}
.e.good .x{color:#a8c4b4}.e.bad .x{color:#d4a29a}.e.big .x{color:var(--ink);font-weight:600}.e.big .t{color:var(--amber)}
@keyframes fe{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.diary:empty::after{content:'你的人生剛剛開始。';color:var(--ink3);font-size:12.5px;display:flex;align-items:center;justify-content:center;height:100%;font-family:Georgia,"Songti TC",serif;letter-spacing:.5px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.menu button,.advance{font-family:inherit;font-size:12px;padding:11px 3px;border-radius:8px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-weight:500;transition:.15s;letter-spacing:.2px}
.menu button:hover:not(:disabled){border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.06)}
.menu button:active:not(:disabled){transform:scale(.97)}
.menu button:disabled{opacity:.28;cursor:not-allowed}
.menu button .sub{display:block;font-size:9.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.advance{width:100%;padding:14px;font-size:14px;font-weight:600;border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.08);letter-spacing:1.5px;font-family:Georgia,"Songti TC",serif}
.advance:hover:not(:disabled){background:rgba(212,160,90,.18)}
.advance:disabled{opacity:.3;cursor:not-allowed}
.advance.ready{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{background:rgba(212,160,90,.08)}50%{background:rgba(212,160,90,.2)}}
#ov{position:fixed;inset:0;background:rgba(10,11,13,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
#ov.show{display:flex}
.sheet{width:100%;max-width:470px;max-height:84vh;overflow-y:auto;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:20px;animation:sp .22s cubic-bezier(.34,1.3,.64,1);box-shadow:0 24px 60px rgba(0,0,0,.6)}
.sheet::-webkit-scrollbar{width:4px}
.sheet::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
@keyframes sp{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.sheet h2{font-family:Georgia,"Songti TC",serif;font-size:17px;font-weight:500;color:var(--ink);margin-bottom:14px;letter-spacing:.8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sheet .body{font-size:13px;line-height:1.7;color:var(--ink2)}
.sheet .body p{margin-bottom:8px}
.sheet .body p:last-child{margin-bottom:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink2);font-size:12.5px}
.row .v{color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row .v.neg{color:var(--rust)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btnrow button{flex:1;min-width:100px;font-family:inherit;font-size:12.5px;padding:11px 10px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;font-weight:500;transition:.15s}
.btnrow button:hover:not(:disabled){border-color:var(--amber2);color:var(--amber)}
.btnrow button:disabled{opacity:.3;cursor:not-allowed}
.btnrow button.pri{border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.09)}
.btnrow button.pri:hover:not(:disabled){background:rgba(212,160,90,.2)}
.btnrow button.warn{border-color:rgba(192,122,109,.55);color:var(--rust)}
.btnrow button.warn:hover:not(:disabled){background:rgba(192,122,109,.12)}
.btnrow button.on{border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.12)}
.person{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .ava{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-family:Georgia,"Songti TC",serif;font-size:15px;color:#14161a;font-weight:600;background:var(--amber);opacity:.85}
.person .ava.f{background:var(--plum)}
.person .ava.dead{background:#3a404a;color:var(--ink3)}
.person .info{flex:1;min-width:0}
.person .n{font-size:13.5px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.person .n .tag{font-size:10px;font-weight:500;color:var(--ink3);padding:1px 6px;border:1px solid var(--line2);border-radius:3px}
.person .n .tag.fam{color:var(--plum);border-color:rgba(168,138,184,.4)}
.person .n .tag.par{color:var(--amber);border-color:rgba(212,160,90,.4)}
.person .n .tag.chi{color:var(--sage);border-color:rgba(138,168,150,.4)}
.person .meta{font-size:11.5px;color:var(--ink3);margin:2px 0 6px;line-height:1.4}
.person .meta .dead{color:var(--rust)}
.person .relbar{height:3px;background:#262b32;border-radius:2px;overflow:hidden}
.person .relbar i{display:block;height:100%;border-radius:2px;transition:width .4s}
.person .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.person .acts button{font:inherit;font-size:11.5px;padding:5px 10px;border-radius:5px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;transition:.15s}
.person .acts button:hover:not(:disabled){border-color:var(--amber2);color:var(--amber)}
.person .acts button:disabled{opacity:.3;cursor:not-allowed}
.person .acts button.pri{border-color:var(--amber2);color:var(--amber)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:6px;overflow-x:auto}
.tabs button{font:inherit;font-size:12.5px;padding:9px 12px;border:0;background:none;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;white-space:nowrap}
.tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
.tabs button .cnt{font-size:10.5px;color:var(--ink3);margin-left:3px}
.empty{color:var(--ink3);font-size:12.5px;padding:22px 0;text-align:center}
.acts-list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.acts-list .it:last-child{border-bottom:0}
.acts-list .it:hover:not(.off){padding-left:4px}
.acts-list .it.off{opacity:.35;cursor:not-allowed}
.acts-list .it .l{flex:1;min-width:0}
.acts-list .it .nm{font-size:13px;color:var(--ink)}
.acts-list .it .ds{font-size:11.5px;color:var(--ink3);margin-top:1px}
.acts-list .it .dg{font-size:11.5px;color:var(--amber);white-space:nowrap;font-variant-numeric:tabular-nums}
.acts-list .it .dg .w{color:var(--rust)}
.acts-list .it .dg{text-align:right;line-height:1.35}
input[type=number],input[type=text]{width:100%;padding:11px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font-size:14px;font-family:inherit;outline:none;margin:10px 0;font-variant-numeric:tabular-nums}
input:focus{border-color:var(--amber2)}
.note{font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.6}
.origin{padding:12px 14px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;transition:.15s;background:var(--bg2)}
.origin:hover{border-color:var(--amber2);background:rgba(212,160,90,.05)}
.origin .h{font-size:14px;color:var(--ink);font-weight:600;margin-bottom:3px;font-family:Georgia,"Songti TC",serif;letter-spacing:.5px}
.origin .d{font-size:11.5px;color:var(--ink3);margin-bottom:6px}
.origin .b{font-size:11.5px;color:var(--amber)}
.origins{display:flex;flex-direction:column;gap:8px}
.gsel{display:flex;gap:8px;margin-bottom:16px}
.gsel button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;transition:.15s}
.gsel button.on{border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.09)}
.bizstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bizstat .b{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.bizstat .b .l{font-size:10.5px;color:var(--ink3)}
.bizstat .b .v{font-size:13px;color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
.emp{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px}
.emp:last-child{border-bottom:0}
.biz-card{padding:12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg2);margin-bottom:8px}
.biz-card .t{font-size:13.5px;color:var(--ink);font-weight:600;margin-bottom:4px}
.biz-card .m{font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.asset-card{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.asset-card:last-child{border-bottom:0}
.asset-card .l{flex:1}
.asset-card .nm{color:var(--ink);font-weight:600}
.asset-card .ds{color:var(--ink3);font-size:11px;margin-top:2px}
.asset-card .v{color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap;margin-right:4px}
.asset-card button{font:inherit;font-size:11px;padding:4px 8px;border-radius:4px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer}
.asset-card button:hover{border-color:var(--amber2);color:var(--amber)}
.cat-title{font-size:12px;color:var(--ink3);letter-spacing:1px;margin:12px 0 4px;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.cat-title:first-child{margin-top:0}
.sec{font-size:13px;color:var(--ink);margin:16px 0 8px;font-family:Georgia,"Songti TC",serif}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);background:var(--card2);border:1px solid var(--line2);color:var(--ink);padding:10px 18px;border-radius:7px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:84vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:400px){.who-age b{font-size:32px}.attrs{gap:7px 14px}.menu{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="who"><div class="who-name" id="whoName">—</div><div class="who-age"><b id="ageNum">0</b><i>歲</i></div></div>
    <div class="purses">
      <div class="p" id="purseCash"><span class="lbl">現金</span><b id="moneyTxt">0</b></div>
      <div class="p debt" id="purseDebt" style="display:none"><span class="lbl">負債</span><b id="debtTxt">0</b></div>
      <div class="p" id="purseAP"><span class="lbl">行動</span><b><span id="apTxt">3</span>/<span id="apMax">3</span></b></div>
    </div>
    <button class="reset" id="resetBtn" title="重新開始">↺</button>
  </header>
  <div class="idbar" id="idbar"></div>
  <div class="attrs" id="attrs"></div>
  <div class="diary" id="diary"></div>
  <div class="menu">
    <button id="btnPartner">伴侶</button>
    <button id="btnProperty">財產</button>
    <button id="btnRelation">關係</button>
    <button id="btnActivity">活動</button>
    <button id="btnBusiness">產業</button>
    <button id="btnCareer">職涯</button>
  </div>
  <button class="advance" id="btnNext">度 過 這 一 年</button>
</div>
<div id="ov"></div><div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[ri(0,a.length-1)];
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
function fmt(n){n=Math.round(n);const neg=n<0?'−':'';n=Math.abs(n);if(n>=1e8)return neg+(n/1e8).toFixed(2)+'億';if(n>=1e4)return neg+(n/1e4).toFixed(1)+'萬';return neg+n.toLocaleString()}
let _t;function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_t);_t=setTimeout(()=>el.classList.remove('show'),2000)}

/* ══════ 彈窗佇列：所有自動彈窗都排隊，避免互相覆蓋 ══════ */
const _q=[];
function queue(fn){_q.push(fn);setTimeout(flushQueue,60)}
function flushQueue(){
  if($('ov').classList.contains('show')||!_q.length)return;
  const fn=_q.shift();fn();
  if(!$('ov').classList.contains('show'))setTimeout(flushQueue,80);
}

// 同一個 key 在佇列中只排一次，避免「入伍」「求職」重複跳出
function queueOnce(key,fn){if(_q.some(x=>x._k===key))return;const f=()=>fn();f._k=key;queue(f)}
// 求職彈窗的唯一入口：男生應徵役期未了結時，先跳入伍通知，處理完才輪到求職
function queueJob(){
  if(conscriptionDue()&&queueMilitary())return;
  queueOnce('job',openJobSearch);
}

/* ══════ 常數（新台幣） ══════ */
const YEAR_M=13;               // 12 個月 + 年終
const DEPOSIT_RATE=0.016;      // 定存
const TRUST_RATE=0.025;        // 信託
const MORT_RATE=0.022;         // 房貸利率
const INS_CAP=550000;          // 勞保投保薪資上限（年，實質）
const SAVE_KEY='lifesim_tw_v4';

/* ══════ 姓名 ══════ */
const SURNAME=['王','李','張','劉','陳','楊','黃','趙','吳','周','徐','孫','馬','朱','胡','郭','何','高','林','羅','鄭','梁','謝','宋','許','鄧','馮','曹','彭','曾','蔡','葉','蘇','潘','蕭','江','洪'];
const NAME_M=['志明','建宏','俊傑','家豪','冠宇','柏翰','承恩','品睿','子軒','宥廷','承翰','冠廷','宇軒','柏均','子毅','明遠','嘉文','書維','廷宇','冠霖','振業','文彬','俊宏','冠豪','世傑'];
const NAME_F=['淑芬','美玲','雅婷','怡君','佳穎','詠晴','詩涵','子晴','語彤','品妍','芯羽','采潔','姵妤','思穎','若曦','雅雯','怡安','書瑤','庭瑄','心怡','淑惠','美華','慧敏','雅芳','怡婷'];
function randPerson(g){const s=pick(SURNAME);return{name:s+(g==='M'?pick(NAME_M):pick(NAME_F)),gender:g,surname:s}}

/* ══════ 學校資料 ══════ */
// 名校：依傳統男校／女校分池；一般高中為男女合校；高職獨立一池
const HS_ELITE_M=['建國中學','成功高中','台中一中','台南一中','高雄中學','師大附中'];
const HS_ELITE_F=['北一女中','中山女高','景美女中','台中女中','台南女中','高雄女中'];
const HS_GEN=['松山高中','板橋高中','中正高中','新店高中','永平高中','大同高中','中壢高中','彰化高中','嘉義高中','屏東高中','花蓮高中','竹北高中'];
const HS_VOC=['大安高工','內湖高工','木柵高工','松山工農','士林高商','台中高工','台中家商','高雄高工','高雄高商','台南高工'];

function pickUniversity(m,score){
  const pool=UNIV_BY_MAJOR[m.id]||UNIV_ALL;
  const t=clamp((score-m.score)/Math.max(1,700-m.score),0,1);   // 0=剛好上線 1=高分
  const idx=Math.round((1-t)*(pool.length-1)+rnd(-1,1));
  return pool[clamp(idx,0,pool.length-1)];
}

function schoolForAge(a){
  if(a>=3&&a<6)return'幼兒園';

  if(a>=6&&a<12){if(!S.sch.elem)S.sch.elem=pick(PLACES)+'國小';return S.sch.elem}

    return S.sch.jr;

  return'';
}

/* ══════ 稅、死亡率 ══════ */
function incomeTax(netReal){ // 綜所稅級距（以實質值計算，近似 113 年度）
  if(netReal<=0)return 0;
  const B=[[590000,.05,0],[1330000,.12,41300],[2660000,.2,147700],[4980000,.3,413700],[Infinity,.4,911700]];
  for(const[l,r,d]of B){if(netReal<=l)return netReal*r-d}
  return 0;
}
function estateTax(net,spouse,kids){ // 遺產稅（簡化：10%/15%/20%）
  const ded=13330000+1230000+(spouse?5530000:0)+kids*560000;
  const t=Math.max(0,net/S.cpi-ded);let tax=0;
  if(t<=50000000)tax=t*0.1;else if(t<=100000000)tax=t*0.15-2500000;else tax=t*0.2-7500000;
  return Math.round(tax*S.cpi);
}
function baseMort(a){if(a<1)return .004;if(a<15)return .0003;if(a<25)return .0006;if(a<35)return .0007;if(a<45)return .0012;if(a<55)return .003;if(a<65)return .007;if(a<75)return .016;if(a<85)return .042;if(a<95)return .11;return .24}
function deathChance(a,g,h){let p=baseMort(a);if(g==='M'&&a>=15)p*=1.25;p*=0.5+(100-h)/45;return clamp(p,0,0.85)}

function newGameWithOrigin(origin,inh,forcedGender,forcedOri){
  const g=inh?inh.gender:(forcedGender||(Math.random()<.5?'M':'F'));

  const oldBiz=inh?inh._biz:[];
  S=blankState();_uid=100;_q.length=0;
  S.name=me.name;S.gender=g;S.orientation=ori;S.origin=inh?'inherit':base.id;
  const orphan=!!inh||base.dadJob===null;
  if(!orphan){
    S.people.dad={id:uid(),...randPerson('M'),name:me.surname+pick(NAME_M),age:ri(28,38),rel:base.dadRel,alive:true,role:'父親',job:base.dadJob};

  }

  S.health=inh?clamp(95-Math.max(0,inh._age-30)*0.8,45,95):base.health;
  S.iq=inh?60:base.iq;S.eq=inh?60:base.eq;S.moral=inh?60:base.moral;S.mood=inh?70:75;
  S.parentWealth=orphan?0:base.wealth;S.originPay=!orphan&&base.pay;
  S.home=orphan&&!inh?'rent':'parents';
  if(inh){
    S.age=inh._age;S.cpi=inh._cpi||1;S.houseIdx=inh._houseIdx||1;S.home='rent';
    if(inh.major){const m=MAJORS.find(x=>x.id===inh.major);S.major=inh.major;S.eduLevel=m?m.level:3;S.eduName=m?m.name:'大學';if(m&&S.age<18+m.years){S.university=pickUniversity(m,m.score+rnd(0,80));S.school=S.university+deptName(m)}}
    else if(S.age>=18){S.eduLevel=1;S.eduName='高中職畢業'}

    if(inh.job){const j=JOBS.find(x=>x.name===inh.job);
      if(j&&j.need<=S.eduLevel&&!j.lic&&!j.startup&&(!j.major||j.major===S.major)&&!j.renown&&!j.fee){S.job=j;S.working=true;S.salary=jobPay(j,0,0)}}
    S.businesses=(oldBiz||[]).map(b=>({...b,id:uid()}));
    log(`你以${inh.name}（${S.age}歲）的身份接下這一代的人生，繼承了 ${fmt(S.money)} 元${S.businesses.length?` 與 ${S.businesses.length} 間企業`:''}。`,'big');
    if(S.age>=18&&!S.job&&!S.school)S.pendingOffer=true;
  }else if(orphan){log('你是個孤兒，由親戚撫養長大。沒有父母陪伴，但你很獨立。','big')}

/* ══════ 薪資與生活成本 ══════ */
function jobPay(job,pos,yrs){return Math.round(job.m*YEAR_M*(1+0.18*pos)*(1+Math.min(yrs,15)*0.012)*S.cpi*S.payMod)}
function rankPay(r){return Math.round(r.m*YEAR_M*S.cpi)}
function partnerIncome(){
  const p=S.partner;if(!S.married||!p||p.age<22||p.age>=65)return 0;
  return Math.round((p.inc||0)*S.cpi);
}
function livingCost(){
  const R={food:0,housing:0,kids:0,total:0};
  if(S.age<18)return R;
  const lm=[0.72,1,1.6][S.lifestyle];const base=300000*S.cpi;
  const owns=S.assets.houses.some(h=>!h.rented);
  const withParents=S.home==='parents'&&parentsAlive();
  if(S.school&&withParents)return R;                       // 學生住家裡：父母負擔
  R.food=base*lm*(S.married?1.7:1)*(S.age>=65?0.85:1);
  if(owns)R.housing=0;
  else if(withParents){R.housing=base*0.12;R.food*=0.8}
  else{R.housing=(S.married||S.people.children.length?380000:220000)*S.cpi*(S.school?0.5:1)}
  if(!S.school&&!S.job&&!S.civil&&!S.military&&withParents)R.food*=0.7;
  S.people.children.forEach(c=>{
    if(!c.alive)return;
    if(c.age>=22&&(c.job||c.spouse))return;
    let k=c.age<6?200000:c.age<12?150000:c.age<18?180000:250000;
    k*=S.cpi;if(c.age<5)k-=60000;     // 育兒補助
    R.kids+=Math.max(0,k);
  });
  R.total=Math.round(R.food+R.housing+R.kids);
  return R;
}
function netWorth(){
  const h=S.assets.houses.reduce((a,x)=>a+x.price-(x.loan||0),0);
  const c=S.assets.cars.reduce((a,x)=>a+x.price,0);
  const b=S.businesses.reduce((a,x)=>a+bizValue(x),0);
  const ccDebt=(S.cc&&S.cc.used)||0;
  return Math.round(S.money+S.deposit+S.etf+S.stk+S.trust+h+c+b-S.debt-ccDebt);
}
const bizValue=c=>Math.max(c.capital*0.5,(c.lastProfit>0?c.lastProfit*3:0));

function addNewFriend(active,o){
  o=o||{};
  const fr=S.people.friends;
  if(fr.length>=10){const live=fr.filter(f=>f.alive).sort((a,b)=>a.rel-b.rel)[0];if(live&&live.rel<50)S.people.friends=fr.filter(f=>f!==live);else if(!o.quiet)return}
  const g=o.gender||(Math.random()<.5?'M':'F');
  const age=o.minAge?ri(o.minAge,o.maxAge):clamp(S.age+ri(-2,3),6,90);
  const f={id:uid(),...randPerson(g),age,rel:o.rel||(active?ri(45,60):ri(30,50)),alive:true,job:null};
  if(f.age>=22&&f.age<65)f.job=pick(JOB_POOL);
  S.people.friends.push(f);
  if(!o.quiet)log(`你認識了新朋友${f.name}（${f.gender==='M'?'男':'女'}，${f.age}歲，${identityOf(f.age,f.job)}）。`,'good');
}
function actReason(a){if(S.ap<a.ap)return'行動點不足';if(a.cost&&S.money<a.cost)return'金錢不足';return a.can?a.can(S):''}
// 右側顯示「−AP · −金錢」，不可做時在下一行補紅字原因
const actCostHtml=(a,r)=>'−'+a.ap+(a.cost?' · −'+a.cost.toLocaleString():'')+(r?`<br><span class="w">${r}</span>`:'');
function dim(key,before,f1,f2){if(S[key]>before){const f=before>85?f2:before>70?f1:1;S[key]=before+(S[key]-before)*f}}
function openActivities(){
  if(S.over)return;
  const list=ACTIONS.filter(a=>S.age>=a.min&&(!a.max||S.age<=a.max));
  const byCat={};list.forEach(a=>{(byCat[a.cat]=byCat[a.cat]||[]).push(a)});
  let html=`<p style="color:var(--ink3);font-size:12px;margin-bottom:8px">剩餘行動點 <b style="color:var(--amber)" id="apLine">${S.ap}</b> / ${S.maxAp}${S.maxAp<3?'（照顧幼兒佔去了你的時間）':''}</p><div id="actList" class="acts-list">`;
  ['daily','leisure','learn','social','life','career'].forEach(cat=>{
    if(!byCat[cat])return;
    html+=`<div class="cat-title">${ACT_CATS[cat]}</div>`;
    byCat[cat].forEach(a=>{const r=actReason(a);
      html+=`<div class="it ${r?'off':''}" data-id="${a.id}"><div class="l"><div class="nm">${a.name}</div><div class="ds">${a.desc}</div></div><div class="dg">${actCostHtml(a,r)}</div></div>`});
  });
  html+='</div>';
  sheet({title:'做點什麼',body:html,buttons:[{text:'關閉'}],onMount(){
    $('actList').addEventListener('click',e=>{
      const it=e.target.closest('.it');if(!it||it.classList.contains('off'))return;
      const a=ACTIONS.find(x=>x.id===it.dataset.id);if(!a)return;
      const r=actReason(a);if(r)return toast(r);
      const hb=S.health,ib=S.iq,eb=S.eq;
      if(a.cost)S.money-=a.cost;S.ap-=a.ap;
      const res=a.run(S);
      if(res===false){S.ap+=a.ap;if(a.cost)S.money+=a.cost}
      else{dim('health',hb,0.5,0.5);dim('iq',ib,0.5,0.25);dim('eq',eb,0.5,0.25)}
      normalize();render();refreshActList();
    });
  }});
}
function refreshActList(){
  const el=$('apLine');if(el)el.textContent=S.ap;
  document.querySelectorAll('#actList .it').forEach(it=>{
    const a=ACTIONS.find(x=>x.id===it.dataset.id);if(!a)return;
    const r=actReason(a);it.classList.toggle('off',!!r);
    const dg=it.querySelector('.dg');if(dg)dg.innerHTML=actCostHtml(a,r);
  });
}

function openRelations(tab){
  if(S.over)return;if(tab)_relTab=tab;
  const p=S.people;
  const famCount=(p.dad&&!p.dad.absent?1:0)+(p.mom&&!p.mom.absent?1:0);
  const tabs=[{k:'fam',label:'家人',n:famCount},{k:'fri',label:'朋友',n:p.friends.filter(f=>f.alive).length},{k:'par',label:'伴侶',n:S.partner?1:0},{k:'chi',label:'子女',n:p.children.length}];
  const body=`<div class="tabs">${tabs.map(t=>`<button data-tab="${t.k}" class="${_relTab===t.k?'on':''}">${t.label}<span class="cnt">${t.n}</span></button>`).join('')}</div><div id="tabBody"></div>`;
  sheet({title:'關係',body,buttons:[{text:'關閉'}],onMount(){
    const renderTab=()=>{
      $('tabBody').innerHTML=_relTab==='fam'?tabFamily():_relTab==='fri'?tabFriends():_relTab==='par'?tabPartner():tabChildren();
      document.querySelectorAll('.person .acts button').forEach(btn=>{btn.onclick=()=>handlePersonAction(btn.dataset.act,parseInt(btn.dataset.id))});
    };
    document.querySelectorAll('.tabs button').forEach(b=>{b.onclick=()=>{_relTab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===_relTab));renderTab()}});
    renderTab();
  }});
}
function personCard({name,gender,tag,tagCls,meta,rel,acts,dead}){
  const avaCls=dead?'ava dead':(gender==='F'?'ava f':'ava');
  const relColor=rel>=66?'var(--sage)':rel>=33?'var(--amber)':'var(--rust)';
  return `<div class="person"><div class="${avaCls}">${dead?'—':name.charAt(0)}</div><div class="info"><div class="n">${name}${tag?`<span class="tag ${tagCls||''}">${tag}</span>`:''}</div><div class="meta">${meta}</div><div class="relbar"><i style="width:${rel}%;background:${relColor}"></i></div><div class="acts">${acts||''}</div></div></div>`;
}
function tabFamily(){

function tabChildren(){

function findPerson(id){const p=S.people;return [p.dad,p.mom,...p.friends,...p.children,S.partner].filter(Boolean).find(x=>x.id===id)}
function canConfess(f){
  if(S.married||S.partner||S.age<16||!f.alive||f.rel<50)return false;
  if(S.age>=18){if(f.age<18||Math.abs(f.age-S.age)>10)return false}
  else{if(f.age>=18||Math.abs(f.age-S.age)>3)return false}
  const o=S.orientation||'hetero';
  if(o==='hetero'&&f.gender===S.gender)return false;
  if(o==='homo'&&f.gender!==S.gender)return false;
  return true;
}
function doDivorce(why){
  const p=S.partner;if(!p)return;
  const share=Math.round(Math.max(0,S.money+S.deposit+S.etf+S.stk)*0.5);
  let paid=Math.min(share,S.money);S.money-=paid;
  let rest=share-paid;if(rest>0){const d=Math.min(rest,S.deposit);S.deposit-=d;rest-=d}
  if(rest>0){const d=Math.min(rest,S.etf);S.etf-=d;rest-=d}
  const kids=S.people.children.filter(c=>c.alive&&c.age<18).length;
  S.partner=null;S.married=false;S.mood-=30;S.eq+=2;
  log(`${why||'你們離婚了'}。依法平分婚後財產，你付出約 ${fmt(share)} 元${kids?`；${kids} 個未成年孩子由你扶養`:''}。`,'bad');
}

function handlePersonAction(act,id){
  const p=findPerson(id);if(!p)return;
  const done=()=>{normalize();render();openRelations(_relTab)};
  const needAp=()=>{if(S.ap<1){toast('行動點不足');return true}return false};
  switch(act){
    case 'chat':if(needAp())return;S.ap--;p.rel+=5;S.mood+=3;S.eq+=1;log(`你和${p.role||p.name}聊了很久，彼此都感到溫暖。`,'good');done();break;
    case 'gift':if(S.money<1500)return toast('金錢不足');if(needAp())return;S.ap--;S.money-=1500;p.rel+=10;S.moral+=2;log(`你送了一份禮物給${p.role||p.name}，對方很開心。`,'good');done();break;
    case 'ask':{if(needAp())return;S.ap--;const m=Math.round(ri(500,2000)*S.cpi);S.money+=m;p.rel-=6;log(`你向${p.role}要了 ${fmt(m)} 元零用錢。`);done();break}
    case 'fri_chat':if(needAp())return;S.ap--;p.rel+=6;S.mood+=3;S.eq+=1;log(`你和${p.name}聊了一會兒，關係更近了。`,'good');done();break;
    case 'confess':{if(!canConfess(p))return toast('條件不符');if(needAp())return;S.ap--;
      const chance=clamp(0.35+(p.rel-50)*0.022+S.eq*0.004,0.15,0.94);
      if(Math.random()<chance){S.partner={...p,rel:clamp(p.rel+10,0,100),inc:incFor(p.job)};S.people.friends=S.people.friends.filter(x=>x.id!==p.id);S.mood+=28;S.eq+=2;log(`你向${p.name}告白，對方紅著臉答應了。你們開始交往。`,'big')}
      else{p.rel-=12;S.mood-=14;S.eq+=2;log(`你向${p.name}告白，卻被婉拒了。心情 −14，情商 +2。`,'bad')}
      done();break}
    case 'date':if(S.money<3000)return toast('金錢不足');if(needAp())return;S.ap--;S.money-=3000;S.partner.rel+=ri(8,15);S.mood+=12;log(`你和${S.partner.name}度過了一個美好的約會。`,'good');done();break;
    case 'propose':{if(S.married)return;if(S.partner.rel<80)return toast('關係不夠');if(S.age<18||S.partner.age<18)return toast('雙方須滿 18 歲');if(needAp())return;S.ap--;
      const pc=clamp(0.65+(S.partner.rel-80)*0.018+S.eq*0.004,0.3,0.97);
      if(Math.random()<pc){normalize();render();closeSheet();wedding(S.partner);return}
      S.partner.rel-=15;S.mood-=25;log(`你向${S.partner.name}求婚，對方猶豫了很久，最後拒絕了。`,'bad');done();break}
    case 'birth':{if(!S.married)return toast('必須已婚');if(needAp())return;
      const same=S.partner.gender===S.gender;const cost=same?300000:50000;if(S.money<cost)return toast('金錢不足');
      S.ap--;S.money-=cost;
      if(!same){const fa=(S.gender==='F'?S.age:S.partner.age);const ch=fa<=34?0.85:fa<=39?0.55:fa<=44?0.25:0.05;
        if(Math.random()>ch){S.mood-=8;log('你們努力了一年，還是沒有好消息。（年齡越大越不容易受孕）','bad');done();break}}
      const g=Math.random()<.5?'M':'F';
      const child={id:uid(),name:S.name.charAt(0)+(g==='M'?pick(NAME_M):pick(NAME_F)),gender:g,age:0,rel:80,alive:true,job:null,spouse:null,kids:0,major:null};
      S.people.children.push(child);S.partner.rel+=8;S.mood+=26;
      log(`你們迎來了${g==='M'?'兒子':'女兒'}${child.name}${same?'（收養）':''}。養育孩子之後，每年開銷和空閒時間都會改變。`,'big');done();break}
    case 'breakup':{
      if(S.married){doDivorce('你結束了這段婚姻')}else{S.partner=null;S.mood-=25;log('你們分手了。','bad')}
      done();break}
    case 'child_chat':if(needAp())return;S.ap--;p.rel+=7;S.mood+=4;S.eq+=1;log(`你和${p.name}聊了很久，親子關係更緊密了。`,'good');done();break;
    case 'child_gift':if(S.money<3000)return toast('金錢不足');if(needAp())return;S.ap--;S.money-=3000;p.rel+=12;S.mood+=5;log(`你包了 3,000 元紅包給${p.name}，孩子很開心。`,'good');done();break;
    case 'child_borrow':{if(needAp())return;S.ap--;const amt=Math.min(Math.round(ri(20000,80000)*S.cpi),Math.round(p.rel*1500));S.money+=amt;p.rel-=10;log(`你向${p.name}借了 ${fmt(amt)} 元，孩子雖然借了，但顯得有些為難。`,'bad');done();break}
    case 'child_urge':{if(needAp())return;S.ap--;
      if(p.age>=25&&!p.spouse&&Math.random()<0.4){p.spouse=pick(['一位溫柔的伴侶','一位開朗的伴侶','一位踏實的伴侶']);p.rel-=5;log(`${p.name} 聽了你的催促，不久後結了婚。`,'good')}
      else{p.rel-=8;log(`${p.name} 覺得你管太多，有些不耐煩。`,'bad')}
      done();break}
  }
}

        if(a==='ss'){if(amt>S.stk)return toast('個股不足');S.stk-=amt;S.money+=amt;log(`你賣出了 ${fmt(amt)} 元的個股。`)}
        if(a==='repay'){const x=Math.min(amt,S.money,S.debt);if(x<=0)return toast('現金不足');S.money-=x;S.debt-=x;log(`你還了 ${fmt(x)} 元的債務。`,'good')}
        if(a==='cc_apply'){
          if(S.age<18)return toast('未滿 18 歲無法申辦信用卡');
          if(S.cc&&S.cc.frozen)return toast('信用破產紀錄中，無法核卡');
          const baseLim=Math.max(50000,Math.round(((S.salary||360000)*0.4+netWorth()*0.05)/10000)*10000);
          S.cc={active:true,limit:Math.min(Math.round(5000000*S.cpi),baseLim),used:0,unpaidYears:0,frozen:false,summons:false};
          log(`你成功核發了信用卡，信用額度為 ${fmt(S.cc.limit)} 元。`,'good');redo();return;
        }
        if(a==='cc_spend'){
          if(!S.cc||!S.cc.active||S.cc.frozen)return toast('目前無法刷卡');
          const avail=S.cc.limit-S.cc.used;
          const x=Math.min(amt,avail);
          if(x<=0)return toast('信用額度已滿');
          S.cc.used+=x;S.money+=x;
          log(`你透過信用卡預借／消費周轉了 ${fmt(x)} 元（目前卡債 ${fmt(S.cc.used)} 元）。`);redo();return;
        }
        if(a==='cc_pay'){
          if(!S.cc||S.cc.used<=0)return toast('目前無卡費');
          const x=Math.min(amt,S.money,S.cc.used);
          if(x<=0)return toast('現金不足');
          S.money-=x;S.cc.used-=x;
          if(S.cc.used===0){S.cc.unpaidYears=0;S.cc.summons=false;if(S.cc.frozen){S.cc.frozen=false;log('你已全數清償卡債，信用卡恢復正常使用！','good')}}
          else log(`你償還了 ${fmt(x)} 元卡費，剩餘卡債 ${fmt(S.cc.used)} 元。`,'good');
          redo();return;
        }
        if(a==='cc_upgrade'){
          if(!S.cc||!S.cc.active||S.cc.frozen)return toast('無法調額');
          if(S.cc.unpaidYears>0)return toast('有逾期欠款紀錄，銀行拒絕調額');
          const newLim=Math.max(S.cc.limit,Math.round(((S.salary||360000)*0.6+netWorth()*0.08)/10000)*10000);
          if(newLim<=S.cc.limit)return toast('以目前財力尚無法調高額度');
          S.cc.limit=Math.min(Math.round(10000000*S.cpi),newLim);
          log(`銀行核准了你的申請，信用卡額度調升至 ${fmt(S.cc.limit)} 元！`,'good');redo();return;
        }
        redo()};
    });
    document.querySelectorAll('[data-buy-house]').forEach(b=>{b.onclick=()=>confirmBuyHouse(b.dataset.buyHouse)});
    document.querySelectorAll('[data-buy-car]').forEach(b=>{b.onclick=()=>{const c=CAR_TYPES.find(x=>x.id===b.dataset.buyCar);if(!c)return;const pr=Math.round(c.price*S.cpi);if(!S.licenses.driver)return toast('需先考駕照');if(S.money<pr)return toast('金錢不足');S.money-=pr;S.assets.cars.push({...c,price:pr});log(`你買下了${c.name}，價值 ${fmt(pr)} 元。`,'big');redo()}});
    document.querySelectorAll('[data-sell-car]').forEach(b=>{b.onclick=()=>{const i=+b.dataset.sellCar;const c=S.assets.cars[i];if(!c)return;const sp=Math.round(c.price*0.92);S.money+=sp;S.assets.cars.splice(i,1);log(`你賣出了${c.name}，得 ${fmt(sp)} 元。`);redo()}});
    document.querySelectorAll('[data-rent-house]').forEach(b=>{b.onclick=()=>{const h=S.assets.houses[+b.dataset.rentHouse];if(!h)return;h.rented=!h.rented;log(h.rented?`你把「${h.name}」出租出去。`:`你收回「${h.name}」自住。`);if(!h.rented)S.home='own';redo()}});
    document.querySelectorAll('[data-sell-house]').forEach(b=>{b.onclick=()=>sellHouse(+b.dataset.sellHouse,redo)});
  }});
}
// 回傳不能買的原因；空字串＝可以買（貸款或現金）
function houseBlock(h){
  if(S.age<20)return'滿 20 歲才能買房';
  const price=Math.round(h.price*S.houseIdx),down=Math.round(price*0.2),fee=Math.round(price*0.01);
  if(S.money>=price+fee)return'';                                       // 現金買得起
  if(S.money<down+fee)return`自備款不足（需 ${fmt(down+fee)}）`;
  const loan=price-down,r=MORT_RATE,pay=Math.round(loan*r/(1-Math.pow(1+r,-30)));
  const income=(S.salary||0)+partnerIncome()*0.8+S.assets.houses.reduce((a,x)=>a+(x.rented?x.price*0.022:0),0);
  return pay<=income*0.5?'':`貸款 DTI 不過（年還款 ${fmt(pay)} ＞ 年收入一半）`;
}
function confirmBuyHouse(id){
  const h=HOUSE_TYPES.find(x=>x.id===id);if(!h)return;
  if(S.age<20)return toast('滿 20 歲才能買房');
  const price=Math.round(h.price*S.houseIdx);
  const down=Math.round(price*0.2);const fee=Math.round(price*0.01);
  const loan=price-down;const n=30;const r=MORT_RATE;
  const pay=Math.round(loan*r/(1-Math.pow(1+r,-n)));
  const income=(S.salary||0)+partnerIncome()*0.8+S.assets.houses.reduce((a,x)=>a+(x.rented?x.price*0.022:0),0);
  const dti=pay<=income*0.5;
  const html=`<p>${h.name}，總價 <b style="color:var(--amber)">${fmt(price)}</b>。</p>
    <div class="row"><span class="k">貸款：頭期款（20%）＋ 規費</span><span class="v">${fmt(down+fee)}</span></div>
    <div class="row"><span class="k">貸款：每年還款（30 年）</span><span class="v ${dti?'':'neg'}">${fmt(pay)}</span></div>
    <div class="row"><span class="k">現金購入：需要</span><span class="v">${fmt(price+fee)}</span></div>
    <p class="note">${dti?'銀行評估你的收入可以核貸。':'你的年收入不到年還款的兩倍，銀行不太可能核貸。'}</p>`;
  sheet({title:'購買'+h.name,body:html,buttons:[
    {text:'貸款購入',cls:'pri',disabled:S.money<down+fee||!dti,onClick:()=>{S.money-=down+fee;S.assets.houses.push({...h,price,cost:price,boughtAge:S.age,rented:false,loan,pay,rate:r,left:n});S.home='own';log(`你貸款買下了${h.name}，總價 ${fmt(price)} 元，每年還款 ${fmt(pay)} 元。`,'big');normalize();render();setTimeout(openProperty,60);return true}},
    {text:'現金購入',disabled:S.money<price+fee,onClick:()=>{S.money-=price+fee;S.assets.houses.push({...h,price,cost:price,boughtAge:S.age,rented:false,loan:0,pay:0,rate:r,left:0});S.home='own';log(`你用現金買下了${h.name}，價值 ${fmt(price)} 元。`,'big');normalize();render();setTimeout(openProperty,60);return true}},
    {text:'返回',onClick:()=>{setTimeout(openProperty,60);return true}},
  ]});
}
function sellHouse(i,redo){
  const h=S.assets.houses[i];if(!h)return;
  let sp=Math.round(h.price*0.97);
  const gain=sp-(h.cost||h.price);const held=S.age-(h.boughtAge||S.age);
  let tax=0;if(gain>0)tax=Math.round(gain*(held<2?0.45:held<10?0.2:0.15));
  const payoff=h.loan||0;
  S.money+=sp-tax-payoff;S.assets.houses.splice(i,1);
  if(!S.assets.houses.some(x=>!x.rented)&&S.home==='own')S.home=parentsAlive()?'parents':'rent';
  log(`你賣出了${h.name}，成交 ${fmt(sp)} 元${tax?`，房地合一稅 ${fmt(tax)} 元`:''}${payoff?`，還清貸款 ${fmt(payoff)} 元`:''}。`,'big');
  redo();
}

/* ══════ 求職 ══════ */
function jobReason(j){
  if(j.need>S.eduLevel)return'學歷不足';
  if(j.vol&&S.age>35)return'超過報考年齡';
  if(j.major&&S.major!==j.major)return'科系不符';
  if(j.lic&&!S.licenses[j.lic])return'需通過國家考試';
  if(j.startup&&S.money<BIZ_START)return`需資金 ${fmt(BIZ_START)}`;
  if(j.renown&&S.renown<j.renown)return`知名度 ${Math.round(S.renown)}/${j.renown}`;
  if(j.minHealth&&S.health<j.minHealth)return`健康需 ${j.minHealth}`;
  if(j.fee&&S.money<j.fee)return`需訓練費 ${fmt(j.fee)}`;
  if(j.startup&&S.businesses.length>=3)return'公司數已達上限';
  return'';
}
function openJobSearch(){

function openJobList(switching){
  if(S.apps<=0){sheet({title:'求職',body:'<p>今年你已經投遞了太多履歷，明年再來吧。</p>',buttons:[{text:'關閉'}]});return}
  const ok=[],locked=[];
  JOBS.forEach(j=>{const r=jobReason(j);(r?locked:ok).push([j,r])});
  const row=([j,r])=>`<div class="it ${r?'off':''}" data-id="${j.id}"><div class="l"><div class="nm">${j.name}</div><div class="ds">${j.cat} · ${j.startup?'自己當老闆（需 '+fmt(BIZ_START)+' 資本）':'起薪年薪約 '+fmt(jobPay(j,0,0))+(j.lic?' · 需國考':'')+(j.fee?' · 訓練費 '+fmt(j.fee):'')}</div></div><div class="dg">${r?`<span class="w">${r}</span>`:'應徵'}</div></div>`;
  const html=`<p style="color:var(--ink3);font-size:12px;margin-bottom:8px">學歷：${S.eduName}${S.major?' · '+(MAJORS.find(m=>m.id===S.major)?.name||''):''}。今年還能投遞 <b style="color:var(--amber)">${S.apps}</b> 次，錄取不保證。</p><div class="acts-list" id="jobList">${ok.map(row).join('')}${locked.length?`<div class="cat-title">尚未達成條件</div>${locked.map(row).join('')}`:''}</div>`;
  sheet({title:switching?'換工作':'求職',body:html,buttons:[{text:'暫不應徵'}],onMount(){
    $('jobList').addEventListener('click',e=>{
      const it=e.target.closest('.it');if(!it||it.classList.contains('off'))return;
      const job=JOBS.find(j=>j.id===it.dataset.id);if(!job)return;
      if(job.startup){closeSheet();startBusiness();return}
      S.apps--;
      const recPen=(S.crimeRecord&&S.crimeRecord.length)?0.18:0;
      const chance=clamp((job.need<=1?0.8:0.62)+(S.iq+S.eq-100)*0.002+(S.eduLevel>job.need?0.1:0)+S.renown*0.001-recPen,0.15,0.95);
      if(Math.random()>chance){S.mood-=4;log(`你應徵「${job.name}」，面試後沒有收到錄取通知。`,'bad');normalize();render();closeSheet();if(S.apps>0)queue(()=>openJobList(switching));return}

function companyYear(c){
  c.years++;const bt=BIZ_TYPES.find(b=>b.id===c.type);
  const n=c.employees.length;
  const attn=1/(1+0.35*(S.businesses.length-1));
  const cap=1+0.6*Math.pow(n,0.85);
  const rep=0.5+c.reputation/100;
  let rev=bt.base*S.cpi*cap*rep*attn*Math.max(0.3,1+gauss()*0.18);
  let crisis='';
  if(Math.random()<bt.risk*0.08){rev*=rnd(0.3,0.6);crisis=pick(['景氣寒冬','重大客訴','供應鏈中斷','競爭對手殺價'])}
  const wages=c.employees.reduce((a,e)=>a+e.salary,0)*S.cpi;
  const profit=rev*bt.margin-bt.base*0.3*S.cpi-wages;
  c.lastProfit=profit;
  let net=profit;
  if(profit>0){net=profit*0.72;c.loss=0}else c.loss=(c.loss||0)-profit;
  log(`【${c.name}】${crisis?'遇上'+crisis+'，':''}營收 ${fmt(rev)}，${profit>=0?'淨利':'虧損'} ${fmt(Math.abs(profit))} 元${profit>0?`（稅後 ${fmt(net)}）`:''}。`,profit>=0?'good':'bad');
  c.reputation=clamp(c.reputation+ri(-3,3),0,100);
  if(c.loss>c.capital*4){log(`「${c.name}」連年虧損，宣告倒閉。`,'bad');S.businesses=S.businesses.filter(x=>x.id!==c.id);S.mood-=30}
  return net;
}

        p.treasury-=steal;S.money+=steal;S.moral-=15;
        log(`你利用職權秘密將 ${fmt(steal)} 元公款轉入私人帳戶……`,'bad');
        const catchChance=clamp(0.32-(S.iq-50)*0.002+(100-p.approval)*0.003,0.12,0.75);
        if(Math.random()<catchChance){
          closeSheet();
          goPrison('貪污挪用公款',ri(7,15));
          normalize();render();return;
        }
      }
      normalize();render();openGovManagement();
    }});
  }});
}
function politicianYear(){
  const p=S.politician;const ranks=pRanks(p);
  const pay=rankPay(ranks[p.rankIndex]);
  const pLbl=p.path==='central'?'中央總政府':p.path==='local'?'地方政務':'民選首長／民代';
  log(`${pLbl}（${ranks[p.rankIndex].name}）薪資 ${fmt(pay)} 元。`);
  S.pubYears++;S.lastSalary=pay/S.cpi;S.salary=pay;p.term++;
  if(p.treasury===undefined){p.treasury=2000000000;p.approval=62;p.taxRate=20;p.welfare=40;p.infra=40;}
  const annualTaxRev=Math.round((p.rankIndex+1)*350000000*(p.taxRate/20)*(0.8+p.infra*0.004));
  const annualMaint=Math.round((p.rankIndex+1)*180000000*((p.welfare+p.infra)/100));
  p.treasury=Math.max(0,p.treasury+annualTaxRev-annualMaint);
  p.approval=clamp((p.approval||60)+rnd(-4,5)+(p.welfare-40)*0.05+(p.infra-40)*0.05-(p.taxRate-20)*0.3,5,98);
  p.score=clamp(p.score*0.6+p.approval*0.4+rnd(-3,5)+(S.eq-50)*0.03,0,100);

  if(p.path==='central'){
    const isPresRun=p.rankIndex>=ranks.length-3;
    if(p.rankIndex<ranks.length-1&&p.term>=2&&p.score>=65&&Math.random()<(isPresRun?0.35:0.48)){
      p.rankIndex++;p.term=0;S.salary=rankPay(ranks[p.rankIndex]);
      const isTop=ranks[p.rankIndex].name==='總統';
      log(isTop?`🎉 歷史性的一刻！你贏得全國大選，正式宣誓就職「總統」，登上國家權力最高峰！`:`政績卓著，你獲拔擢／提名當選為「${ranks[p.rankIndex].name}」！`,'big');
      S.mood+=isTop?40:18;S.renown+=isTop?20:7;
    }else if(p.score<28){
      log('施政失靈、民怨沸騰，你被迫引咎辭職，回到民間。','bad');S.mood-=25;S.politician=null;S.salary=0;S.job=null;
    }
  }else if(p.path==='local'){
    if(p.rankIndex<2){
      if(p.term>=2&&p.score>=62&&Math.random()<0.5){
        p.rankIndex++;p.term=0;S.salary=rankPay(ranks[p.rankIndex]);
        log(`地方政績亮眼，你獲拔擢升任「${ranks[p.rankIndex].name}」！`,'big');S.mood+=15;S.renown+=5;
      }else if(p.score<28){
        log('地方施政不力，你遭到調職解任。','bad');S.mood-=20;S.politician=null;S.salary=0;S.job=null;
      }
    }else if(p.term>0&&p.term%4===0){
      const next=p.rankIndex<ranks.length-1?ranks[p.rankIndex+1]:null;
      const out=next?(next.cost||20000000)*0.25:0;
      const aim=next&&p.score>=62&&p.approval>=55&&S.money>=out;
      const ch=clamp(0.38+(p.approval-55)*0.012+S.renown*0.003+S.eq*0.002-(aim?0.05:0)+(aim?0:0.2),0.15,0.88);
      if(aim)S.money-=out;
      if(Math.random()<ch){
        if(aim){
          p.rankIndex++;p.term=0;S.salary=rankPay(ranks[p.rankIndex]);
          const isTop=ranks[p.rankIndex].name==='總統';
          log(isTop?`🎉 從基層地方官員一路打拚，你高票當選「總統」！`:`地方選舉大勝！你自籌 ${fmt(out)} 元競選，當選「${ranks[p.rankIndex].name}」！`,'big');
          S.mood+=isTop?40:28;S.renown+=isTop?20:10;
        }else log('任期屆滿選舉，你以高滿意度順利連任！','good');
      }else{
        if(aim){log(`你投入 ${fmt(out)} 元挑戰「${next.name}」失利，但仍保有原職。`,'bad');S.mood-=15}
        else{log('選舉連任失利，你卸下地方公職。','bad');S.mood-=25;S.politician=null;S.salary=0;S.job=null}
      }
    }
  }else if(p.term>0&&p.term%4===0){
    const next=p.rankIndex<ranks.length-1?ranks[p.rankIndex+1]:null;
    const out=next?next.cost*0.3:0;
    const aim=next&&p.score>=60&&S.money>=out;
    const ch=clamp(0.4+(p.score-60)*0.01+S.renown*0.003+S.eq*0.002-(aim?0.05:0)+(aim?0:0.2),0.15,0.85);
    if(aim)S.money-=out;
    if(Math.random()<ch){
      if(aim){p.rankIndex++;S.salary=rankPay(ranks[p.rankIndex]);log(`選舉年！你自籌 ${fmt(out)} 元競選，當選「${ranks[p.rankIndex].name}」！`,'big');S.mood+=30;S.renown+=8}
      else log('選舉年，你順利連任。','good');
    }else{
      if(aim){log(`選舉年！你花了 ${fmt(out)} 元挑戰更高職位，不幸落選，但仍保有原職。`,'bad');S.mood-=15}
      else{log('選舉年，你連任失敗，下台一鞠躬。','bad');S.mood-=25;S.politician=null;S.salary=0}
    }
  }
  return pay;
}

// 徵集條件：男性、滿 18、未服過、不在學（大學／研究所在學緩徵）、未入獄、≤36 歲
function conscriptionDue(){
  return S.gender==='M'&&!S.militaryDone&&!S.military&&!S.prison&&!S.school&&S.age>=18&&S.age<=MIL_MAX_AGE;
}
// 回傳 true＝已排入「入伍通知」；false＝不需要（或已因體位免役）
function queueMilitary(){
  if(!conscriptionDue())return false;
  if(S.health<40){S.militaryDone=true;S.mood+=3;log('體檢判定體位不符（健康 <40），免服兵役。','good');return false}
  queueOnce('mil',openMilitaryEnlist);
  return true;
}
function openMilitaryEnlist(){
  if(!conscriptionDue())return;

  const fit=exempt?'免役':S.health>=60?'常備役':'替代役';  // 40–59：體位較弱，只能服替代役
  const altOk=fit==='替代役'||(fit==='常備役'&&Math.random()<0.5);   // 常備役者替代役要抽籤
  const volOk=fit==='常備役';

    ${exempt?'<p class="note">體檢發現體位不合格（例如嚴重扁平足、過重），依法免服兵役。</p>':`
    ${fit==='常備役'?`<div class="row"><span class="k">義務役</span><span class="v">1 年 · 月津貼 ${CONSCRIPT_M.toLocaleString()}</span></div>`:''}
    ${altOk?`<div class="row"><span class="k">替代役${fit==='常備役'?'（抽籤中籤）':''}</span><span class="v">1 年 · 道德、情商加成</span></div>`:''}
    ${volOk?`<div class="row"><span class="k">志願役</span><span class="v">${vs.name}起 · 月薪 ${vs.m.toLocaleString()}</span></div>`:''}
    <p class="note">義務役、替代役 1 年期滿即退伍；志願役可逐年晉升、年資計入退休金，但軍階受學歷影響（無大學學歷最高升到上士）。${fit==='替代役'?'你的體位較弱，只能服替代役。':''}</p>`}`;
  const buttons=[];

  else{
    if(fit==='常備役')buttons.push({text:'入伍服義務役（1 年）',cls:'pri',onClick:()=>{enlist('conscript')}});
    if(altOk)buttons.push({text:'服替代役（1 年）',cls:fit==='替代役'?'pri':'',onClick:()=>{enlist('alt')}});
    if(volOk)buttons.push({text:`投考志願役（${vs.name}起）`,onClick:()=>{enlist('vol')}});
  }
  sheet({title:'兵役通知',body:html,closable:false,buttons});
}
// kind: 'conscript' 義務役 | 'alt' 替代役 | 'vol' 志願役
function enlist(kind){
  dropJob(true);S.militaryDone=true;S.retired=false;
  let idx=0,rank,left=1;
  if(kind==='conscript')rank={...MILITARY_RANKS[0],m:CONSCRIPT_M};
  else if(kind==='alt')rank={name:'替代役男',m:CONSCRIPT_M,years:1};
  else{idx=S.eduLevel>=3?6:3;rank={...MILITARY_RANKS[idx]};left=0}
  S.military={kind,rank,rankIndex:idx,yearsServed:0,yearsInRank:0,performance:60,volunteer:kind==='vol',left};
  S.salary=Math.round(rank.m*12*S.cpi);S.working=true;
  log(kind==='conscript'?'你入伍服義務役，成為一名二兵，役期 1 年。':kind==='alt'?'你分發到服務機關服替代役，役期 1 年。':`你考取志願役，以${rank.name}起步，決心在軍中長期發展。`,'big');
  normalize();render();
}
// 義務役中途轉志願役（在「職涯」面板按鈕呼叫）
function convertVolunteer(){
  const m=S.military;
  if(!m||m.kind==='vol'||m.kind==='alt')return toast('只有義務役可以轉志願役');
  const idx=S.eduLevel>=3?6:3;
  m.kind='vol';m.volunteer=true;m.rankIndex=idx;m.rank={...MILITARY_RANKS[idx]};m.yearsInRank=0;m.left=0;m.capped=false;
  S.salary=Math.round(m.rank.m*12*S.cpi);S.mood+=10;
  log(`你轉為志願役，晉升${m.rank.name}，決心在軍中長期發展。`,'big');
  normalize();render();
}
// 年度結算：doNextYear → workIncome() 會呼叫它，回傳當年軍中收入
function militaryYear(){
  const m=S.military;
  const kind=m.kind||(m.volunteer?'vol':'conscript');m.kind=kind;                 // 舊存檔相容
  if(m.left===undefined)m.left=kind==='vol'?0:Math.max(0,1-(m.yearsServed||0));
  const sen=kind==='vol'?1+Math.min(m.yearsInRank,m.rank.years)*0.012:1;        // 志願役：同階每年年資加給 1.2%
  const pay=Math.round(m.rank.m*sen*12*S.cpi);
  m.yearsServed++;m.yearsInRank++;S.salary=pay;
  log(`軍中薪資 ${fmt(pay)} 元（${m.rank.name}${kind==='vol'?'，同階第 '+m.yearsInRank+' 年':''}）。`);
  if(kind==='vol'){
    S.pubYears++;S.lastSalary=pay/S.cpi;
    m.performance=clamp(m.performance+rnd(-5,14)+S.health*0.04+S.iq*0.02+S.eq*0.02,0,100);
    const cap=S.eduLevel>=3?MILITARY_RANKS.length-1:5;                           // 無大學學歷最高上士
    if(m.yearsInRank>=m.rank.years&&m.performance>55&&m.rankIndex<cap){
      m.rankIndex++;m.rank={...MILITARY_RANKS[m.rankIndex]};m.yearsInRank=0;m.capped=false;
      const g=m.rankIndex>=12;
      log(`表現優異，晉升為「${m.rank.name}」${g?'，將星閃耀！':''}。`,'big');S.mood+=g?25:15;
    }else if(m.rankIndex>=cap&&m.rankIndex<MILITARY_RANKS.length-1&&!m.capped){
      m.capped=true;log('你已升到士官最高階；想晉升軍官，需要大學學歷。','bad');
    }
    if(Math.random()<0.04){S.health-=ri(4,10);log('一次操演中你受了傷，休養了一陣子。','bad')}
  }else{
    if(kind==='conscript'){S.health+=3;S.eq+=1;S.moral+=1;S.mood-=3;log('一年的軍旅磨練，體能與紀律都進步了。','good');
      if(Math.random()<0.05){S.health-=ri(3,8);log('訓練中受了點傷。','bad')}}
    else{S.moral+=6;S.eq+=4;S.mood+=2;log('你在服務機關貢獻所長，道德 +6、情商 +4。','good')}
    m.left--;
    if(m.left<=0){
      log(kind==='conscript'?'一年義務役期滿，你光榮退伍。':'一年替代役期滿，你順利役畢。','big');
      S.military=null;S.salary=0;S.working=false;S.mood+=8;S.pendingOffer=true;
      queueJob();
    }
  }
  return pay;
}

  const ladder=CAREER_LADDERS[S.job.id];
  S.workYears=(S.workYears||0)+1;
  const perf=rnd(-5,15)+S.iq*0.04+S.eq*0.04+S.mood*0.02+S.renown*0.02;
  if(ladder&&perf>12&&S.jobPosition<ladder.length-1&&S.workYears>=(S.jobPosition+1)*2){
    S.jobPosition++;S.salary=jobPay(S.job,S.jobPosition,S.workYears);
    log(`工作表現出色，升職為「${ladder[S.jobPosition]}」，年薪 ${fmt(S.salary)} 元。`,'big');S.mood+=12;
  }else{S.salary=jobPay(S.job,S.jobPosition,S.workYears);log(`你工作一年，薪水 ${fmt(S.salary)} 元。`)}
  return S.salary;
}
function civilYearlyReview(){
  const c=S.civil;
  c.budget+=30+c.rankIndex*20+ri(0,20);c.yir++;
  const perf=c.score+c.perfBonus+c.budget*0.05+rnd(-10,15);
  const need=CIVIL_YEARS[c.rankIndex]||99;
  if(perf>75&&c.rankIndex<CIVIL_RANKS.length-1&&c.yir>=need){
    c.rankIndex++;c.rank={...CIVIL_RANKS[c.rankIndex]};c.yir=0;
    log(`公務員考核優秀，升任「${c.rank.name}」，年薪 ${fmt(rankPay(c.rank))} 元。`,'big');S.mood+=12;
  }else if(perf>50){log('公務員考核通過。')}
  else{c.score=clamp(c.score-5,0,100);log('公務員考核成績不理想。','bad');S.mood-=6}
  const pay=rankPay(c.rank);S.salary=pay;S.pubYears++;S.lastSalary=pay/S.cpi;
  log(`公務員薪資 ${fmt(pay)} 元。`);
  return pay;
}
function workIncome(){
  if(S.military)return militaryYear();
  if(S.politician)return politicianYear();
  if(S.civil)return civilYearlyReview();
  if(S.job)return careerYear();
  return 0;
}
function pensionAnnual(){
  let p=0;
  if(S.insuredYears>=15)p+=S.insuredYears*0.0155*(S.insuredSum/S.insuredYears)*S.cpi;
  if(S.pubYears>=15)p+=Math.min(0.75,S.pubYears*0.02)*S.lastSalary*S.cpi;
  return Math.round(p);
}
function retire(why){
  if(S.job||S.civil||S.politician){
    log(`${why||'你退休了'}開始享受退休生活。`,'big');
    S.job=null;S.civil=null;S.politician=null;S.salary=0;S.working=false;S.jobPosition=0;S.workYears=0;S.payMod=1;
  }
  S.retired=true;
}
function payoutPensions(){
  if(S.pensionPaid)return;S.pensionPaid=true;
  const lump=Math.round(S.laborPension*S.cpi);
  if(lump>0){S.money+=lump;log(`勞退個人專戶一次領回 ${fmt(lump)} 元。`,'good');S.laborPension=0}
  if(S.insuredYears>0&&S.insuredYears<15){const l2=Math.round(S.insuredYears*(S.insuredSum/S.insuredYears)/12*S.cpi);S.money+=l2;log(`勞保年資不滿 15 年，領取老年一次金 ${fmt(l2)} 元。`,'good')}
  if(S.pubYears>0&&S.pubYears<15){const l3=Math.round(S.pubYears*S.lastSalary/13*S.cpi);S.money+=l3;log(`公職年資不滿 15 年，領取一次退休金 ${fmt(l3)} 元。`,'good')}

/* ══════ 人物年度 ══════ */
function parentDies(w){
  w.alive=false;S.mood-=25;S.moral+=2;
  const cost=Math.round(200000*S.cpi);S.money-=cost;
  log(`${w.role}${w.name}過世了（享年 ${w.age} 歲）。喪葬費用 ${fmt(cost)} 元。`,'bad');
  const other=w===S.people.dad?S.people.mom:S.people.dad;
  if(!other||other.absent||!other.alive){
    const est=Math.round(S.parentWealth*S.cpi*rnd(0.7,1.2));
    if(est>0){const tax=estateTax(est,false,1);S.money+=est-tax;S.parentWealth=0;log(`你繼承了父母的遺產 ${fmt(est-tax)} 元${tax?`（已繳遺產稅 ${fmt(tax)}）`:''}。`,'big')}
    if(S.home==='parents')S.home='rent';
  }
  normalize();
}
function ageUpPeople(){
  const p=S.people;
  [p.dad,p.mom].forEach(w=>{
    if(w.absent||!w.alive)return;
    w.age++;if(w.age>=65)w.job='退休';
    if(Math.random()<deathChance(w.age,w.gender,62))parentDies(w);else w.rel=clamp(w.rel-1,0,100);
  });
  p.friends.forEach(f=>{
    if(!f.alive)return;
    f.age++;if(f.age>=22&&!f.job&&f.age<65)f.job=pick(JOB_POOL);if(f.age>=65)f.job='退休';
    f.rel=clamp(f.rel-2,0,100);
    if(Math.random()<deathChance(f.age,f.gender,65)){f.alive=false;f.rel=0;log(`朋友${f.name}離開了人世。`,'bad');S.mood-=8}
  });
  p.children.forEach(c=>{
    if(!c.alive)return;
    c.age++;childLifeChoices(c);
    if(c.age>=22&&!c.job&&c.age<65&&c.alive&&!c.major)c.job=pick(WORK_POOL);
    if(c.age>=65)c.job='退休';c.rel=clamp(c.rel-1,0,100);
  });
  const pr=S.partner;
  if(pr){
    pr.age++;if(pr.age>=22&&!pr.job&&pr.age<65){pr.job=pick(JOB_POOL);if(!pr.inc)pr.inc=incFor(pr.job)}
    if(pr.age>=65)pr.job='退休';pr.rel=clamp(pr.rel-1,0,100);
    if(Math.random()<deathChance(pr.age,pr.gender,65)){log(`${pr.name}離開了人世。`,'bad');S.partner=null;S.married=false;S.mood-=40}
    else if(!S.married&&pr.rel<25&&Math.random()<0.5){log(`${pr.name}覺得你們不適合，提出了分手。`,'bad');S.partner=null;S.mood-=20}
    else if(S.married&&pr.rel<15&&Math.random()<0.3){doDivorce(`${pr.name}提出離婚，婚姻走到了盡頭`)}
  }
}
function childLifeChoices(c){
  if(c.age===18&&!c.job&&!c.major){
    if(Math.random()<0.55){c.major=pick(['biz','tech','art','edu','college']);log(`${c.name} 考上了大學，就讀${MAJORS.find(m=>m.id===c.major).name}。`,'good')}
    else{c.job=pick(WORK_POOL);log(`${c.name} 決定不升學，開始工作，成為了一名${c.job}。`,'good')}
  }
  if(c.major&&!c.job){const m=MAJORS.find(x=>x.id===c.major);if(m&&c.age>=18+m.years){c.job=pick(WORK_POOL);log(`${c.name} 畢業了，開始工作，成為了一名${c.job}。`,'good')}}
  if(c.age>=25&&c.age<=35&&!c.spouse&&Math.random()<0.2){c.spouse=pick(['一位溫柔的伴侶','一位開朗的伴侶','一位踏實的伴侶','一位體貼的伴侶']);log(`${c.name} 結婚了，對象是${c.spouse}。`,'good')}
  if(c.spouse&&c.age>=25&&c.age<=40&&(c.kids||0)<3&&Math.random()<0.15){c.kids=(c.kids||0)+1;log(`${c.name} 有了第 ${c.kids} 個孩子，你升格當祖父母了。`,'big');S.mood+=15}
  if(Math.random()<deathChance(c.age,c.gender,70)){c.alive=false;log(`你的孩子${c.name}過世了。白髮人送黑髮人，你悲痛不已。`,'bad');S.mood-=25}
}
function maybeNewFriend(){
  const rate=S.age>=6&&S.age<=22?0.22:(S.age>22&&S.age<55?0.1:0.04);
  if(S.people.friends.length>=10||Math.random()>=rate)return;
  addNewFriend(false);
}

function goPrison(reason,years,fine=0){
  S.prison={yearsLeft:years,totalYears:years,reason,behavior:50};

  else log(`你因「${reason}」被判處有期徒刑 ${years} 年！`,'bad');

function checkPrison(){
  if(S.prison||S.age<18)return;
  if(S.moral<35&&Math.random()<clamp((35-S.moral)*0.008,0.03,0.22)){
    const pool=CRIMES.filter(c=>!c.cond||c.cond(S));
    const c=pick(pool.length?pool:CRIMES);
    goPrison(c.name,ri(c.minY,c.maxY),c.fine);
  }
}
function prisonYear(){
  S.prison.yearsLeft--;

  }
}

/* ══════ 疾病 ══════ */
function illnessYear(){
  if(!S.illness){
    const p=S.age>=35?(0.004+(S.age-35)*0.0008)*(1+(100-S.health)/60):0;
    if(Math.random()<p){S.illness={name:pick(['惡性腫瘤','嚴重心血管疾病','嚴重肝病','腎臟病','腦中風前兆']),stage:0,found:false,giveUp:false}}
    return;
  }
  const ill=S.illness;
  if(ill.giveUp){S.health-=8;return}
  if(!ill.found){S.health-=3+ill.stage;ill.stage+=0.6;
    if(Math.random()<0.3+ill.stage*0.1){ill.found=true;log('你身體不太對勁，去醫院檢查後確診了重病。','bad');queue(offerTreatment)}
  }else{S.health-=4;ill.stage+=0.4;queue(offerTreatment)}
}
function offerTreatment(){
  const ill=S.illness;if(!ill||!ill.found||ill.giveUp||S.over)return;
  const pAgg=clamp(0.9-ill.stage*0.12,0.3,0.9),pCons=clamp(0.3-ill.stage*0.04,0.05,0.3);
  const aggCost=Math.round(300000*S.cpi),consCost=Math.round(80000*S.cpi);
  const html=`<p>你被診斷出<b style="color:var(--rust)">${ill.name}</b>，病況約第 ${Math.round(ill.stage)+1} 期。</p><p class="note">健保已負擔大部分費用，下面是自費部分（標靶、達文西手術、自費藥等）。</p>`;
  sheet({title:'🏥 重大疾病',body:html,closable:false,buttons:[
    {text:`積極治療（${fmt(aggCost)}，約 ${Math.round(pAgg*100)}% 康復）`,cls:'pri',onClick:()=>{
      S.money-=aggCost;
      if(Math.random()<pAgg){S.illness=null;S.cured=true;S.health-=8;S.mood-=10;log('歷經手術與長期治療，你戰勝了病魔！','big')}
      else{ill.stage+=1;S.health-=25;S.mood-=15;log('積極治療後，病況仍不樂觀，身體非常虛弱。','bad')}
      normalize();render()}},
    {text:`保守治療（${fmt(consCost)}，約 ${Math.round(pCons*100)}% 康復）`,onClick:()=>{
      S.money-=consCost;
      if(Math.random()<pCons){S.illness=null;S.cured=true;S.health-=5;log('保守治療奇蹟似地有效，你康復了。','big')}
      else{ill.stage+=0.5;S.health-=12;log('保守治療只能勉強控制病情。','bad')}
      normalize();render()}},
    {text:'放棄治療，順其自然',cls:'warn',onClick:()=>{ill.giveUp=true;S.mood-=10;S.moral+=1;log('你決定不再治療，把剩下的日子好好過完。','bad');normalize();render()}},
  ]});
}

function fireEvent(){
  const pool=EVENTS.filter(e=>(!e.min||S.age>=e.min)&&(!e.max||S.age<=e.max)&&(!e.cond||e.cond(S)));
  if(!pool.length)return;const total=pool.reduce((a,b)=>a+(b.w||1),0);let r=Math.random()*total;

function fireChoice(){
  const pool=CHOICES.filter(c=>(!c.min||S.age>=c.min)&&(!c.max||S.age<=c.max)&&(!c.cond||c.cond(S)));
  if(!pool.length)return;
  const c=pick(pool);
  queue(()=>{
    if(S.over)return;
    if(c.cond&&!c.cond(S))return;
    sheet({title:c.title,body:`<p>${c.text}</p>`,closable:false,buttons:c.opts.map(o=>({text:o.t,onClick:()=>{o.run(S);normalize();render()}}))});
  });
}

/* ══════ 年度推進 ══════ */
function syncHome(){
  const owns=S.assets.houses.some(h=>!h.rented);
  if(owns)S.home='own';
  else{if(S.home==='own')S.home=parentsAlive()?'parents':'rent';if(S.home==='parents'&&!parentsAlive())S.home='rent'}
}
function nextYear(){
  if(S.over)return;
  if(S.ap>0&&S.age>=6&&!S.prison){
    sheet({title:'度過這一年？',body:`<p>你還有 <b style="color:var(--amber)">${S.ap}</b> 個行動點沒有使用。</p><p>確定要直接迎接下一年嗎？</p>`,buttons:[{text:'先去安排'},{text:'確定度過',cls:'pri',onClick:()=>{setTimeout(doNextYear,60)}}]});
    return;
  }
  doNextYear();
}
function doNextYear(){
  if(S.over)return;closeSheet();
  S.age++;S.apps=3;S.pendingOffer=false;
  S.maxAp=hasChildUnder(3)?2:3;S.ap=S.maxAp;
  S.cpi*=1+clamp(0.017+gauss()*0.008,0,0.05);
  S.econ.stock=clamp(0.07+gauss()*0.17,-0.45,0.55);if(Math.random()<0.04)S.econ.stock=-rnd(0.3,0.5);
  S.econ.housing=clamp(0.03+gauss()*0.05,-0.18,0.2);
  S.houseIdx*=1+S.econ.housing;
  if(S.age>30)S.health-=0.4;if(S.age>45)S.health-=0.4;if(S.age>60)S.health-=0.5;if(S.age>75)S.health-=0.7;
  S.mood+=(62-S.mood)*0.1;
  if(S.lifestyle===0)S.mood-=1.5;if(S.lifestyle===2){S.mood+=2.5;S.health-=0.3}
  syncHome();
  const L={wage:0,pension:0,rent:0,biz:0,partner:0,tax:0,ins:0,living:0,loan:0,other:0,pocket:0};

  if(S.prison){prisonYear()}
  else{
    L.wage=workIncome();
    if(S.age>=65){const pn=pensionAnnual();if(pn>0){L.pension=pn;log(`領取年金 ${fmt(pn)} 元。`,'good')}}
    const covered=!!S.job&&!S.civil&&!S.military&&!S.politician&&L.wage>0;
    if(covered){const cap=INS_CAP*S.cpi;S.insuredYears++;S.insuredSum+=Math.min(L.wage,cap)/S.cpi;S.laborPension=(S.laborPension+Math.min(L.wage,cap)*0.06/S.cpi)*1.02}
    L.ins=Math.min(L.wage,INS_CAP*S.cpi)*0.035;
    S.businesses.slice().forEach(b=>{L.biz+=companyYear(b)});
    S.assets.houses.forEach(h=>{if(h.rented)L.rent+=Math.round(h.price*0.022)});
    if(L.rent>0)log(`出租房產，租金收入 ${fmt(L.rent)} 元。`,'good');
    L.partner=Math.round(partnerIncome()*0.88);
    if(S.age>=6&&S.age<=22&&!S.job&&!S.military&&parentsAlive()){L.pocket=Math.round((8000+S.age*1500)*S.cpi);log(`父母給了你 ${fmt(L.pocket)} 元零用錢。`)}
    // 學費（含海外留學學費）
    if(S.studyAbroad&&S.studyAbroad.stage==='hs'&&S.age>=15&&S.age<18){
      const htu=Math.round(1200000*S.cpi);
      if(S.originPay&&parentsAlive())log(`海外高中留學費用 ${fmt(htu)} 元由父母全額支付。`);
      else{L.other+=htu;log(`你自付了海外高中留學費用 ${fmt(htu)} 元。`);}
    }
    if(S.school&&S.university&&S.school!=='研究所'&&S.age>=18){
      const isAbroad=S.studyAbroad&&S.studyAbroad.stage==='uni';
      const tu=Math.round((isAbroad?(S.studyAbroad.tuition||2000000):80000)*S.cpi);
      if(S.originPay&&parentsAlive())log(`${isAbroad?'海外名校留學學費與生活費':'大學學費'} ${fmt(tu)} 元由父母支付。`);
      else{L.other+=tu;if(S.origin==='poor'||S.origin==='orphan'){S.money+=Math.round(40000*S.cpi);log('你領到了清寒獎助學金。','good')}}
    }
    // 稅
    const dep=S.people.children.filter(c=>c.alive&&c.age<22).length;
    const ded=441000+(S.married?223000:0)+dep*92000;
    L.tax=Math.round(incomeTax(Math.max(0,(L.wage+L.rent*0.57+L.partner*0)/S.cpi-ded))*S.cpi);
    // 生活
    const lc=livingCost();L.living=lc.total;
    if(S.pet>0){L.other+=Math.round(36000*S.cpi);S.pet--;if(S.pet===0){log('陪伴你多年的毛小孩走了，你難過了很久。','bad');S.mood-=15}}
    S.assets.cars.forEach(c=>{L.other+=Math.round(c.cost*S.cpi);c.price=Math.round(c.price*0.88)});
    S.assets.houses.forEach(h=>{
      L.other+=Math.round(h.price*(h.rented?0.005:0.003));
      if(h.loan>0){const it=h.loan*h.rate;const pr=Math.min(h.loan,h.pay-it);h.loan-=pr;h.left--;L.loan+=pr+it;if(h.left<=0)h.loan=0}
      h.price=Math.round(h.price*(1+S.econ.housing));
    });
    // 孝親
    if(S.age>=24&&L.wage>0&&S.origin!=='rich'){[S.people.dad,S.people.mom].forEach(w=>{if(w&&!w.absent&&w.alive&&w.age>=60){const g=Math.round(60000*S.cpi);L.other+=g;w.rel+=3}})}
    // 子女反哺
    S.people.children.forEach(c=>{if(c.alive&&c.age>=24&&(c.job||c.spouse)&&c.rel>50&&S.age>=60){const g=Math.round(ri(60000,150000)*S.cpi);L.pocket+=g}});
    if(L.pocket>0&&S.age>=60)log(`子女給了孝親費。`,'good');
    // 失業壓力
    if(S.age>=22&&S.age<60&&!S.job&&!S.civil&&!S.military&&!S.politician&&!S.school&&S.businesses.length===0&&!S.retired){S.mood-=4;log('這一年沒有工作，你有些焦慮。','bad')}

    const income=L.wage+L.pension+L.rent+L.biz+L.partner+L.pocket;
    const expense=L.tax+L.ins+L.living+L.loan+L.other;
    S.money+=income-expense;
    S.lastYear={income:Math.round(income),expense:Math.round(expense),net:Math.round(income-expense),tax:Math.round(L.tax+L.ins),living:Math.round(L.living),loan:Math.round(L.loan)};
    if(income>0||expense>0)log(`【年度結算】收入 ${fmt(income)}，稅與保費 ${fmt(L.tax+L.ins)}，生活開銷 ${fmt(L.living)}${L.loan?`，房貸 ${fmt(L.loan)}`:''}${L.other?`，其他 ${fmt(L.other)}`:''} → 結餘 ${fmt(income-expense)}`,income-expense>=0?'good':'bad');

    // 存款與投資
    if(S.deposit>0){const it=S.deposit*DEPOSIT_RATE;S.deposit+=it;log(`定期存款利息 ${fmt(it)} 元。`,'good')}
    if(S.trust>0){const it=S.trust*TRUST_RATE;S.trust+=it;log(`信託基金收益 ${fmt(it)} 元。`,'good')}
    if(S.etf>0){const r=clamp(S.econ.stock+S.finLit*0.001,-0.6,0.8);const d=S.etf*r;S.etf+=d;log(`ETF ${d>=0?'上漲':'下跌'}，${d>=0?'獲利':'虧損'} ${fmt(Math.abs(d))} 元（大盤 ${(S.econ.stock*100).toFixed(1)}%）。`,d>=0?'good':'bad');if(d<0)S.mood-=4}
    if(S.stk>0){const r=clamp(1.4*S.econ.stock+gauss()*0.28*(1-S.finLit*0.04),-0.85,1.2);const d=S.stk*r;S.stk+=d;log(`個股${d>=0?'上漲':'下跌'}，${d>=0?'獲利':'虧損'} ${fmt(Math.abs(d))} 元。`,d>=0?'good':'bad');S.mood+=d>=0?5:-8}
    // 信用卡年度循環利息與 5 年欠債告票（法院傳票／強制執行）
    if(S.cc&&S.cc.active&&S.cc.used>0){
      const ccInt=Math.round(S.cc.used*0.15);
      S.cc.used+=ccInt;
      S.cc.unpaidYears=(S.cc.unpaidYears||0)+1;
      S.mood-=Math.min(8,2+S.cc.unpaidYears);
      log(`【信用卡帳單】未繳卡債產生循環利息 ${fmt(ccInt)} 元，目前卡債 ${fmt(S.cc.used)} 元（已連續欠款 ${S.cc.unpaidYears} 年）。`,'bad');
      if(S.cc.unpaidYears>=3&&!S.cc.frozen){
        S.cc.frozen=true;
        log('因長期積欠卡費未還，銀行已凍結你的信用卡並通報聯徵信用不良！','bad');
      }
      if(S.cc.unpaidYears>=5&&!S.cc.summons){
        S.cc.summons=true;
        queue(()=>{
          if(S.over||!S.cc||S.cc.used<=0)return;
          const totalOwed=S.cc.used;
          const courtFee=Math.round(15000*S.cpi);
          sheet({
            title:'⚖️ 法院支付命令與民事傳票（告票）',
            body:`<p>你已連續 <b style="color:var(--rust)">${S.cc.unpaidYears} 年</b> 未償還信用卡債務，發卡銀行已正式向法院提起訴訟並發出傳票（告票）！</p>
              <div class="row"><span class="k">積欠卡債本息</span><span class="v neg">${fmt(totalOwed)} 元</span></div>
              <div class="row"><span class="k">訴訟與執行費用</span><span class="v neg">${fmt(courtFee)} 元</span></div>
              <p class="note">若拒絕清償且名下無足夠資產供強制執行，將被法院認定惡意脫產並移送法辦。</p>`,
            closable:false,
            buttons:[
              {text:'變賣存款／現金全額清償',cls:'pri',disabled:(S.money+S.deposit+S.etf+S.stk)<totalOwed+courtFee,onClick:()=>{
                let need=totalOwed+courtFee;
                const take=(k)=>{const x=Math.min(S[k],need);S[k]-=x;need-=x;};
                take('money');take('deposit');take('etf');take('stk');
                S.cc.used=0;S.cc.unpaidYears=0;S.cc.summons=false;S.cc.frozen=false;
                log(`你收到法院告票後緊急湊齊 ${fmt(totalOwed+courtFee)} 元全數清償，撤銷了強制執行！`,'good');
                normalize();render();
              }},
              {text:'兩手一攤，無力償還（強制執行）',cls:'warn',onClick:()=>{
                let seized=0;
                ['money','deposit','etf','stk'].forEach(k=>{seized+=S[k];S[k]=0;});
                S.cc.used=Math.max(0,totalOwed+courtFee-seized);
                S.mood-=20;
                log(`法院啟動強制執行，查封扣押了你名下 ${fmt(seized)} 元資金！${S.cc.used>0?`仍欠 ${fmt(S.cc.used)} 元，被裁定惡意逃債入獄！`:'債務全數抵銷。'}`,'bad');
                if(S.cc.used>0){
                  S.cc.used=0;S.cc.unpaidYears=0;S.cc.summons=false;
                  goPrison('惡意脫產與拒不履行債務罪',ri(1,3),0);
                }
                normalize();render();
              }}
            ]
          });
        });
      }
    }
    // 一般負債
    if(S.debt>0){S.debt=Math.round(S.debt*1.045);const room=Math.max(0,S.money-100000*S.cpi);const pay=Math.min(S.debt,room);if(pay>0){S.money-=pay;S.debt-=pay;log(`你用手上的現金還了 ${fmt(pay)} 元債務。`,'good')}
      if(S.debt>0){S.mood-=Math.min(8,2+S.debt/(300000*S.cpi));log(`你還背著 ${fmt(S.debt)} 元的債務，壓力很大。`,'bad')}}
  }
  normalize();

  ageUpPeople();
  normalize();

  switch(S.age){
    case 3:S.school='幼兒園';S.eduName='幼兒園';log('你進入了幼兒園。','big');break;
    case 6:S.school=schoolForAge(6);S.eduName='國小';log(`你進入${S.school}就讀。`,'big');break;
    case 12:S.school=schoolForAge(12);S.eduName='國中';log(`你升上了${S.school}。`,'big');break;
    case 15:examHui();break;
    case 18:examXueCe();break;
    case 60:if(S.military&&S.military.volunteer){log('你達到了志願役年齡上限，光榮退役。','big');S.military=null;S.working=false;S.salary=0;S.retired=true}break;
    case 65:retire('你屆齡退休了。');payoutPensions();break;
    case 70:if(S.politician){log('你年事已高，從政壇退下。','big');S.politician=null;S.salary=0;S.retired=true}break;
  }
  if(S.school==='研究所'){S.gradLeft--;if(S.gradLeft<=0){S.school='';S.eduLevel=4;S.eduName='碩士';S.gradSchool=true;S.iq+=6;S.eq+=3;log('你取得了碩士學位！','big');S.pendingOffer=true;queueJob()}}
  if(S.school&&S.major&&S.university&&S.school!=='研究所'){const m=MAJORS.find(x=>x.id===S.major);if(m&&S.age>=18+m.years)graduate()}

  if(S.mood<20){S.health-=3;log('心情長期低落，健康受到影響。','bad')}
  if(S.health<30)S.mood-=3;

  maybeNewFriend();checkPrison();illnessYear();
  if(!S.prison){fireEvent();if(S.age>=16&&Math.random()<0.5)fireChoice()}
  if(S.pendingOffer&&!S.job&&!S.civil&&!S.military&&!S.school&&S.businesses.length===0&&!S.retired&&S.age>=16)queueJob();
  else if(S.eduLevel>=1)queueMilitary();   // 沒有待處理的求職時，才單獨檢查是否該入伍

  normalize();checkAch();render();
  const cause=deathCause();
  if(cause){gameOver(cause);return}
  if(S.debt>0&&S.debt>S.cpi*8000000){log('債務過高，你被迫聲請個人債務清理。','bad')}
  setTimeout(flushQueue,100);
}
function deathCause(){
  if(S.health<=0)return S.age<40?'你的健康徹底崩潰，人生畫下了句點。':'你的身體終究撐不下去，安靜地離開了。';
  if(S.age>=110)return'你活到了 110 歲，成為鄉里間的傳奇。';
  if(Math.random()<deathChance(S.age,S.gender,S.health)){
    if(S.illness&&S.illness.stage>=2)return`你終究沒能戰勝${S.illness.name}。`;
    return S.age<45?'一場突如其來的意外奪走了你的生命。':S.age<70?'你因急病猝然離世。':'你在睡夢中安詳地離開了人世。';
  }
  return'';
}

/* ══════ 結局與繼承 ══════ */
function evaluate(nw){
  const avg=(S.mood+S.health+S.iq+S.eq+S.moral)/5;
  let title='平凡的一生';
  if(nw>3e8&&avg>70)title='傳奇人生';
  else if(nw>1e8)title='億萬富豪';
  else if(nw>3e7&&avg>60)title='人生勝利組';
  else if(nw>3e7)title='事業有成';
  else if(nw<0)title='負債一生';
  else if(avg>75)title='幸福知足';
  else if(avg<40)title='坎坷的一生';
  return title;
}
function gameOver(reason){
  S.over=true;_q.length=0;clearSave();render();
  const nw=netWorth();
  const kids=S.people.children.filter(c=>c.alive);
  const tax=nw>0?estateTax(nw,!!S.married,kids.length):0;
  const net=Math.max(0,nw-tax);
  const title=evaluate(nw);
  let heirPool=kids,heirLabel='子女';
  if(S.will&&S.will.type==='single'){const ch=kids.find(c=>c.id===S.will.heirId);if(ch){heirPool=[ch];heirLabel=ch.name}}
  const achN=Object.keys(S.ach).length;
  const achList=ACH.filter(a=>S.ach[a[0]]).map(a=>a[1]).join('、');
  const html=`
    <p style="font-size:14px;color:var(--ink);margin-bottom:14px">${reason}</p>
    <div class="row"><span class="k">人生評價</span><span class="v">${title}</span></div>
    <div class="row"><span class="k">享年</span><span class="v">${S.age} 歲</span></div>
    <div class="row"><span class="k">淨資產</span><span class="v ${nw<0?'neg':''}">${fmt(nw)} 元</span></div>
    <div class="row"><span class="k">遺產稅（簡化估算）</span><span class="v">${fmt(tax)} 元</span></div>
    <div class="row"><span class="k">房產 / 車輛 / 企業</span><span class="v">${S.assets.houses.length} / ${S.assets.cars.length} / ${S.businesses.length}</span></div>
    <div class="row"><span class="k">最高學歷</span><span class="v">${S.eduName}${S.major?' · '+(MAJORS.find(m=>m.id===S.major)?.name||''):''}</span></div>
    <div class="row"><span class="k">最後職業</span><span class="v">${S.politician?pRanks(S.politician)[S.politician.rankIndex].name:S.civil?S.civil.unit+' '+S.civil.rank.name:S.military?S.military.rank.name:S.job?S.job.name:(S.retired?'退休':'無業')}</span></div>
    <div class="row"><span class="k">婚姻 / 子女</span><span class="v">${S.married?'已婚':(S.partner?'有伴侶':'未婚')} / ${S.people.children.length} 人</span></div>
    <div class="row"><span class="k">心情 / 健康 / 道德</span><span class="v">${Math.round(S.mood)} / ${Math.round(S.health)} / ${Math.round(S.moral)}</span></div>
    <div class="row"><span class="k">成就（${achN}/${ACH.length}）</span><span class="v" style="font-size:11.5px;max-width:230px">${achList||'—'}</span></div>
    ${S.will?`<p class="note">依照你的遺囑，遺產分配給：${heirLabel}</p>`:''}
    ${heirPool.length>0?`<p class="note" style="margin-top:8px">你可以選擇一位子女繼承你的人生，從其當前年齡繼續。名下房產與車輛會折現，企業由繼承人接手。</p>`:''}`;
  const buttons=[];
  heirPool.forEach(c=>{
    buttons.push({text:`👶 繼承 ${c.name}（${c.age}歲）`,cls:'pri',onClick:()=>{
      const share=Math.round(net/heirPool.length);
      const biz=S.businesses.map(b=>({...b}));
      const cpi=S.cpi,hi=S.houseIdx;
      newGameWithOrigin(null,{name:c.name,gender:c.gender,orientation:S.orientation,_money:share,_age:c.age,_cpi:cpi,_houseIdx:hi,_biz:biz,major:c.major||null,job:c.job||null});
      return true;
    }});
  });
  buttons.push({text:'重新開始（新出身）',cls:heirPool.length?'':'pri',onClick:()=>{setTimeout(openOriginSelect,50)}});
  sheet({title:'人生落幕',body:html,closable:false,buttons});
}
function confirmReset(){
  sheet({title:'重新開始',body:`<p>確定要重新開始嗎？</p><p class="note">當前人生的所有進度都會消失。</p>`,buttons:[{text:'取消'},{text:'確定',cls:'warn',onClick:()=>{clearSave();setTimeout(openOriginSelect,50)}}]});
}

/* ══════ 綁定 & 啟動 ══════ */
$('resetBtn').onclick=confirmReset;
$('btnActivity').onclick=openActivities;
$('btnProperty').onclick=openProperty;
$('btnRelation').onclick=()=>openRelations();
$('btnPartner').onclick=openPartnerPanel;
$('btnBusiness').onclick=openBusinesses;
$('btnCareer').onclick=openCareer;
$('btnNext').onclick=nextYear;

S=blankState();
if(loadSave()){normalize();render();_prev=snap();toast('已載入上次的人生')}
else{render();openOriginSelect()}
</script>
</body>
</html>
