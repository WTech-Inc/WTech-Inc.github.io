<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>香江年歲 · 香港人生模擬</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#14161a;--bg2:#191c21;--card:#1e2126;--card2:#252931;--line:#2e333b;--line2:#3a404a;--ink:#dcd8d0;--ink2:#989da4;--ink3:#686d75;--amber:#d4a05a;--amber2:#a87c42;--sage:#8aa896;--rust:#c07a6d;--sky:#7d9cc0;--plum:#a88ab8}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);padding:0 14px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;overflow-x:hidden;font-feature-settings:"tnum";line-height:1.5}
body.locked{overflow:hidden}
#app{width:100%;max-width:680px;padding-top:calc(14px + env(safe-area-inset-top))}
.top{display:flex;align-items:flex-end;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.who{flex:1;min-width:0}
.who-name{font-size:11.5px;color:var(--ink3);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-age{display:flex;align-items:baseline;gap:4px;line-height:1}
.who-age b{font-family:Georgia,"Songti TC",serif;font-size:38px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.who-age i{font-style:normal;font-size:12px;color:var(--ink3);padding-bottom:5px}
.who-age b.bump{animation:bump .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.purses{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;color:var(--ink2)}
.purses .p{display:flex;gap:6px;align-items:baseline;position:relative}
.purses .p b{color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
.purses .p.zero b{color:var(--rust)}
.purses .p.debt b{color:var(--rust)}
.purses .p .lbl{font-size:11px;color:var(--ink3)}
.reset{width:32px;height:32px;flex-shrink:0;border-radius:8px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-size:15px;display:grid;place-items:center;transition:.15s;margin-bottom:1px}
.reset:hover{border-color:var(--rust);color:var(--rust)}
.fnum{position:absolute;right:0;top:-1px;font-size:11.5px;font-weight:700;pointer-events:none;white-space:nowrap;animation:fnum 1.1s ease-out forwards}
.fnum.up{color:var(--sage)}.fnum.down{color:var(--rust)}
@keyframes fnum{0%{opacity:0;transform:translateY(3px)}20%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.idbar{display:flex;flex-wrap:wrap;gap:0;align-items:center;font-size:12px;color:var(--ink2);padding:10px 0 12px}
.idbar .cell{padding:0 10px;border-right:1px solid var(--line);white-space:nowrap}
.idbar .cell:first-child{padding-left:0}
.idbar .cell:last-child{border-right:0}
.idbar .cell button{font:inherit;background:none;border:0;color:var(--amber);cursor:pointer;padding:0;border-bottom:1px dashed var(--amber2)}
.idbar .warn{color:var(--rust)}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-bottom:14px}
.attr-h{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:4px}
.attr-h .v{color:var(--ink);font-variant-numeric:tabular-nums;font-size:12.5px}
.attr-h .v .d{font-size:10.5px;font-weight:700;margin-left:3px;animation:dp 1.6s ease-out forwards}
.attr-h .v .d.up{color:var(--sage)}.attr-h .v .d.down{color:var(--rust)}
@keyframes dp{0%{opacity:0}20%{opacity:1}75%{opacity:1}100%{opacity:0}}
.track{height:4px;background:#262b32;border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.diary{border-top:1px solid var(--line);border-bottom:1px solid var(--line);height:214px;overflow-y:auto;margin-bottom:14px;padding:2px 0}
.diary::-webkit-scrollbar{width:4px}
.diary::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.e{display:flex;gap:10px;padding:7px 2px 7px 0;font-size:12.8px;line-height:1.55;animation:fe .3s ease;border-bottom:1px dashed rgba(58,64,74,.45)}
.e:last-child{border-bottom:0}
.e .t{flex-shrink:0;width:40px;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:2px;text-align:right}
.e .x{flex:1;color:var(--ink2)}
.e.good .x{color:#a8c4b4}.e.bad .x{color:#d4a29a}.e.big .x{color:var(--ink);font-weight:600}.e.big .t{color:var(--amber)}
@keyframes fe{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.diary:empty::after{content:'你的人生剛剛開始。';color:var(--ink3);font-size:12.5px;display:flex;align-items:center;justify-content:center;height:100%;font-family:Georgia,"Songti TC",serif;letter-spacing:.5px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.menu button,.advance{font-family:inherit;font-size:12px;padding:11px 3px;border-radius:8px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-weight:500;transition:.15s;letter-spacing:.2px}
.menu button:hover:not(:disabled){border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.06)}
.menu button:active:not(:disabled){transform:scale(.97)}
.menu button:disabled{opacity:.28;cursor:not-allowed}
.menu button .sub{display:block;font-size:9.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.advance{width:100%;padding:14px;font-size:14px;font-weight:600;border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.08);letter-spacing:1.5px;font-family:Georgia,"Songti TC",serif}
.advance:hover:not(:disabled){background:rgba(212,160,90,.18)}
.advance:disabled{opacity:.3;cursor:not-allowed}
.advance.ready{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{background:rgba(212,160,90,.08)}50%{background:rgba(212,160,90,.2)}}
#ov{position:fixed;inset:0;background:rgba(10,11,13,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
#ov.show{display:flex}
.sheet{width:100%;max-width:470px;max-height:84vh;overflow-y:auto;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:20px;animation:sp .22s cubic-bezier(.34,1.3,.64,1);box-shadow:0 24px 60px rgba(0,0,0,.6)}
.sheet::-webkit-scrollbar{width:4px}
.sheet::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
@keyframes sp{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.sheet h2{font-family:Georgia,"Songti TC",serif;font-size:17px;font-weight:500;color:var(--ink);margin-bottom:14px;letter-spacing:.8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sheet .body{font-size:13px;line-height:1.7;color:var(--ink2)}
.sheet .body p{margin-bottom:8px}
.sheet .body p:last-child{margin-bottom:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink2);font-size:12.5px}
.row .v{color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row .v.neg{color:var(--rust)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btnrow button{flex:1;min-width:100px;font-family:inherit;font-size:12.5px;padding:11px 10px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;font-weight:500;transition:.15s}
.btnrow button:hover:not(:disabled){border-color:var(--amber2);color:var(--amber)}
.btnrow button:disabled{opacity:.3;cursor:not-allowed}
.btnrow button.pri{border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.09)}
.btnrow button.pri:hover:not(:disabled){background:rgba(212,160,90,.2)}
.btnrow button.warn{border-color:rgba(192,122,109,.55);color:var(--rust)}
.btnrow button.warn:hover:not(:disabled){background:rgba(192,122,109,.12)}
.btnrow button.on{border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.12)}
.person{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .ava{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-family:Georgia,"Songti TC",serif;font-size:15px;color:#14161a;font-weight:600;background:var(--amber);opacity:.85}
.person .ava.f{background:var(--plum)}
.person .ava.dead{background:#3a404a;color:var(--ink3)}
.person .info{flex:1;min-width:0}
.person .n{font-size:13.5px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.person .n .tag{font-size:10px;font-weight:500;color:var(--ink3);padding:1px 6px;border:1px solid var(--line2);border-radius:3px}
.person .n .tag.fam{color:var(--plum);border-color:rgba(168,138,184,.4)}
.person .n .tag.par{color:var(--amber);border-color:rgba(212,160,90,.4)}
.person .n .tag.chi{color:var(--sage);border-color:rgba(138,168,150,.4)}
.person .meta{font-size:11.5px;color:var(--ink3);margin:2px 0 6px;line-height:1.4}
.person .meta .dead{color:var(--rust)}
.person .relbar{height:3px;background:#262b32;border-radius:2px;overflow:hidden}
.person .relbar i{display:block;height:100%;border-radius:2px;transition:width .4s}
.person .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.person .acts button{font:inherit;font-size:11.5px;padding:5px 10px;border-radius:5px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;transition:.15s}
.person .acts button:hover:not(:disabled){border-color:var(--amber2);color:var(--amber)}
.person .acts button:disabled{opacity:.3;cursor:not-allowed}
.person .acts button.pri{border-color:var(--amber2);color:var(--amber)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:6px;overflow-x:auto}
.tabs button{font:inherit;font-size:12.5px;padding:9px 12px;border:0;background:none;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;white-space:nowrap}
.tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
.tabs button .cnt{font-size:10.5px;color:var(--ink3);margin-left:3px}
.empty{color:var(--ink3);font-size:12.5px;padding:22px 0;text-align:center}
.acts-list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.acts-list .it:last-child{border-bottom:0}
.acts-list .it:hover:not(.off){padding-left:4px}
.acts-list .it.off{opacity:.35;cursor:not-allowed}
.acts-list .it .l{flex:1;min-width:0}
.acts-list .it .nm{font-size:13px;color:var(--ink)}
.acts-list .it .ds{font-size:11.5px;color:var(--ink3);margin-top:1px}
.acts-list .it .dg{font-size:11.5px;color:var(--amber);white-space:nowrap;font-variant-numeric:tabular-nums}
.acts-list .it .dg .w{color:var(--rust)}
.acts-list .it .dg{text-align:right;line-height:1.35}
input[type=number],input[type=text]{width:100%;padding:11px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font-size:14px;font-family:inherit;outline:none;margin:10px 0;font-variant-numeric:tabular-nums}
input:focus{border-color:var(--amber2)}
.note{font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.6}
.origin{padding:12px 14px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;transition:.15s;background:var(--bg2)}
.origin:hover{border-color:var(--amber2);background:rgba(212,160,90,.05)}
.origin .h{font-size:14px;color:var(--ink);font-weight:600;margin-bottom:3px;font-family:Georgia,"Songti TC",serif;letter-spacing:.5px}
.origin .d{font-size:11.5px;color:var(--ink3);margin-bottom:6px}
.origin .b{font-size:11.5px;color:var(--amber)}
.origins{display:flex;flex-direction:column;gap:8px}
.gsel{display:flex;gap:8px;margin-bottom:16px}
.gsel button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;transition:.15s}
.gsel button.on{border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.09)}
.bizstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bizstat .b{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.bizstat .b .l{font-size:10.5px;color:var(--ink3)}
.bizstat .b .v{font-size:13px;color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
.emp{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px}
.emp:last-child{border-bottom:0}
.biz-card{padding:12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg2);margin-bottom:8px}
.biz-card .t{font-size:13.5px;color:var(--ink);font-weight:600;margin-bottom:4px}
.biz-card .m{font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.asset-card{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.asset-card:last-child{border-bottom:0}
.asset-card .l{flex:1}
.asset-card .nm{color:var(--ink);font-weight:600}
.asset-card .ds{color:var(--ink3);font-size:11px;margin-top:2px}
.asset-card .v{color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap;margin-right:4px}
.asset-card button{font:inherit;font-size:11px;padding:4px 8px;border-radius:4px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer}
.asset-card button:hover{border-color:var(--amber2);color:var(--amber)}
.cat-title{font-size:12px;color:var(--ink3);letter-spacing:1px;margin:12px 0 4px;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.cat-title:first-child{margin-top:0}
.sec{font-size:13px;color:var(--ink);margin:16px 0 8px;font-family:Georgia,"Songti TC",serif}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);background:var(--card2);border:1px solid var(--line2);color:var(--ink);padding:10px 18px;border-radius:7px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:84vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.prop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.prop-box{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.prop-box .k{font-size:11px;color:var(--ink3);display:block}
.prop-box .v{font-size:13.5px;color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;display:block}
.prop-box .v.neg{color:var(--rust)}
.stk-card{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:7px;margin-bottom:6px;font-size:12.5px}
.stk-card .l{flex:1;min-width:0}
.stk-card .nm{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stk-card .code{font-size:10.5px;color:var(--sky);background:rgba(125,156,192,.12);padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.stk-card .pr{color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
.stk-card .ds{color:var(--ink3);font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums}
.stk-card .acts{display:flex;gap:5px;flex-shrink:0}
.stk-card button{font:inherit;font-size:11px;padding:5px 9px;border-radius:5px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;transition:.15s}
.stk-card button:hover:not(:disabled){border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.08)}
.stk-card button:disabled{opacity:.3;cursor:not-allowed}
/* ══════ Modern Life / Sim-Life 參考風格重構 UI/UX ══════ */
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line2);border-radius:12px;margin-bottom:8px}
.hud-bars{display:flex;flex-direction:column;gap:5px;width:130px;flex-shrink:0}
.hbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.hbar i{font-style:normal;width:14px;text-align:center}
.hbar .bg{flex:1;height:6px;background:#262b32;border-radius:99px;overflow:hidden}
.hbar .bg b{display:block;height:100%;border-radius:99px;transition:width .4s}
.hud-mid{text-align:center;flex:1;min-width:0}
.hud-mid .yr{font-family:Georgia,"Songti TC",serif;font-size:20px;color:var(--ink);font-weight:600;line-height:1.15}
.hud-mid .loc{font-size:11px;color:var(--amber);margin-top:2px;cursor:pointer;display:inline-block;border-bottom:1px dashed var(--amber2)}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.hud-cash{font-size:13.5px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;position:relative}
.hud-cash.zero{color:var(--rust)}
.hud-ap{font-size:11px;color:var(--ink2);background:var(--bg2);padding:2px 7px;border-radius:99px;border:1px solid var(--line2)}
.hud-ap b{color:var(--sage)}
.fam-strip{display:flex;gap:10px;overflow-x:auto;padding:8px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;align-items:center}
.fam-strip::-webkit-scrollbar{height:3px}
.fam-node{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;cursor:pointer;flex-shrink:0}
.fam-node .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;color:#14161a;background:var(--amber);border:2px solid var(--line2);transition:.15s}
.fam-node .av.f{background:var(--plum)}
.fam-node .av.me{border-color:var(--sage);box-shadow:0 0 0 2px rgba(138,168,150,.25)}
.fam-node .av.dead{background:#333842;color:var(--ink3);opacity:.65}
.fam-node .nm{font-size:10.5px;color:var(--ink2);white-space:nowrap;max-width:62px;overflow:hidden;text-overflow:ellipsis}
.profile-card{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:12px}
.p-meta{display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line);padding-right:10px}
.p-meta .item{display:flex;justify-content:space-between;gap:6px;color:var(--ink3)}
.p-meta .item b{color:var(--ink);font-weight:500;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:115px}
.p-meta .item b.link{color:var(--amber);cursor:pointer;text-decoration:underline dotted}
.p-bars{display:flex;flex-direction:column;justify-content:center;gap:6px}
.p-bar-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.p-bar-row span:first-child{width:32px;flex-shrink:0}
.p-bar-row .trk{flex:1;height:6px;background:#262b32;border-radius:99px;overflow:hidden}
.p-bar-row .trk i{display:block;height:100%;border-radius:99px;transition:width .4s}
.p-bar-row .num{width:24px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-size:10.5px}
.dock-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.dock-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px;border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);cursor:pointer;transition:.15s;font-family:inherit}
.dock-btn:hover:not(:disabled){border-color:var(--amber2);color:var(--amber);background:rgba(212,160,90,.08);transform:translateY(-1px)}
.dock-btn:disabled{opacity:.3;cursor:not-allowed}
.dock-btn .ico{font-size:16px;line-height:1.1}
.dock-btn .lbl{font-size:11px;font-weight:600;color:var(--ink)}
.dock-btn .sub{font-size:9px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px}

const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
function fmt(n){n=Math.round(n);const neg=n<0?'−':'';n=Math.abs(n);if(n>=1e8)return neg+(n/1e8).toFixed(2)+'億';if(n>=1e4)return neg+(n/1e4).toFixed(1)+'萬';return neg+n.toLocaleString()}

/* ══════ 彈窗佇列：所有自動彈窗都排隊，避免互相覆蓋 ══════ */
const _q=[];
function queue(fn){_q.push(fn);setTimeout(flushQueue,60)}
function flushQueue(){
  if($('ov').classList.contains('show')||!_q.length)return;
  const fn=_q.shift();fn();
  if(!$('ov').classList.contains('show'))setTimeout(flushQueue,80);
}

// 同一個 key 在佇列中只排一次，避免「投考」「求職」重複跳出
function queueOnce(key,fn){if(_q.some(x=>x._k===key))return;const f=()=>fn();f._k=key;queue(f)}
// 求職彈窗的唯一入口：男生應徵役期未了結時，先跳投考通知，處理完才輪到求職
function queueJob(){
  if(conscriptionDue()&&queueMilitary())return;
  queueOnce('job',openJobSearch);
}

function pickUniversity(m,score){
  const pool=UNIV_BY_MAJOR[m.id]||UNIV_ALL;
  const t=clamp((score-m.score)/Math.max(1,42-m.score),0,1);   // 0=剛好上線 1=高分
  const idx=Math.round((1-t)*(pool.length-1)+rnd(-1,1));
  return pool[clamp(idx,0,pool.length-1)];
}

function getRegion(id){return REGIONS.find(r=>r.id===(id||(S&&S.region)||'shatin'))||REGIONS[8]}
function calcFare(fromId,toId,tr){
  const r1=getRegion(fromId),r2=getRegion(toId);
  const dist=Math.max(1,Math.abs(r1.zone-r2.zone));
  const cpi=(S&&S.cpi)||1;
  const crossHarbour=(r1.side==='hk'&&r2.side!=='hk')||(r2.side==='hk'&&r1.side!=='hk');
  const tunnelFee=(tr.id==='taxi'&&crossHarbour)?50:(tr.id==='mtr'&&crossHarbour?8:0);
  return Math.round((tr.baseFare*dist+tunnelFee)*cpi);
}
function openTravelModal(){
  if(S.over||S.prison)return;
  const cur=getRegion(S.region);
  let selDest=REGIONS.find(r=>r.id!==cur.id).id;
  const renderTravel=()=>{
    const dest=getRegion(selDest);
    const isIsl=cur.side==='isl'||dest.side==='isl';
    const html=`
      <div class="row"><span class="k">目前居住分區</span><span class="v">📍 ${cur.name}（物價 ${Math.round(cur.costMod*100)}% · 樓價 ${Math.round(cur.houseMod*100)}%）</span></div>
      <p style="font-size:11.5px;color:var(--ink3);margin-top:4px">${cur.desc}</p>
      <div class="sec">① 選擇前往／搬遷分區</div>
      <div class="btnrow" style="margin-top:0">${REGIONS.filter(r=>r.id!==cur.id).map(r=>`<button data-dest="${r.id}" class="${selDest===r.id?'on':''}" style="min-width:95px;padding:7px 5px;font-size:11px">${r.name.split('（')[0]}</button>`).join('')}</div>
      <div class="row" style="margin-top:6px"><span class="k">目的地詳情</span><span class="v" style="font-size:11.5px;font-weight:400;color:var(--ink2)">${dest.name} · 物價 ${Math.round(dest.costMod*100)}%</span></div>
      <div class="sec">② 選擇交通工具（前往 ${dest.name.split('（')[0]}）</div>
      <div class="acts-list" id="trList">${TRANSPORTS.map(tr=>{
        let block='';
        if(isIsl&&!tr.islandOk&&!tr.onlyIsland)block='離島需乘搭渡輪或直升機';
        else if(!isIsl&&tr.onlyIsland)block='僅限中環↔離島渡輪航線';
        const fare=calcFare(cur.id,dest.id,tr);
        if(!block&&S.money<fare)block='現金／八達通餘額不足';
        if(!block&&S.ap<1)block='行動點不足';
        return `<div class="it ${block?'off':''}" data-tr="${tr.id}">
          <div class="l"><div class="nm">${tr.name}</div><div class="ds">${tr.desc} · 心情 +${tr.mood}${tr.health?` · 健康 ${tr.health>0?'+':''}${tr.health}`:''}</div></div>
          <div class="dg">車費 $${fare.toLocaleString()}<br><span style="font-size:10.5px;color:var(--ink3)">${block?`<span class="w">${block}</span>`:'乘搭 / 搬遷'}</span></div>
        </div>`;
      }).join('')}</div>
      <p class="note">乘搭交通前往其他分區需消耗 1 點行動點與車費／船費。抵達後你將常住於該區（直接影響每年生活開銷與買樓樓價）。</p>`;
    sheet({title:'🚇 港鐵交通與香港 18 區搬遷',body:html,buttons:[{text:'關閉'}],onMount(){
      document.querySelectorAll('[data-dest]').forEach(b=>{b.onclick=()=>{selDest=b.dataset.dest;renderTravel()}});
      $('trList').addEventListener('click',e=>{
        const it=e.target.closest('.it');if(!it||it.classList.contains('off'))return;
        const tr=TRANSPORTS.find(x=>x.id===it.dataset.tr);if(!tr)return;
        const fare=calcFare(cur.id,dest.id,tr);
        if(S.ap<1)return toast('行動點不足');
        if(S.money<fare)return toast('現金不足支付車費');
        S.ap--;S.money-=fare;
        S.region=dest.id;
        S.mood+=tr.mood;S.health+=tr.health;
        log(`你拍八達通／付費 $${fare.toLocaleString()}，乘搭「${tr.name.split(' ')[1]}」從${cur.name.split('（')[0]}前往【${dest.name}】居住！`,'good');
        normalize();render();closeSheet();
      });
    }});
  };
  renderTravel();
}

/* ══════ 銀行系統（存款、取款、貸款、高風險搶劫） ══════ */
function openBankModal(){
  if(S.over||S.prison)return;
  const maxLoan=Math.max(0,Math.round(((S.salary||300000)*2.5+netWorth()*0.3)*S.cpi)-S.debt);
  const reg=getRegion(S.region);
  const html=`
    <div class="prop-grid">
      <div class="prop-box"><span class="k">💵 隨身現金</span><span class="v">${fmt(S.money)}</span></div>
      <div class="prop-box"><span class="k">🏦 銀行存款 (年息 1.6%)</span><span class="v">${fmt(S.deposit)}</span></div>
      <div class="prop-box"><span class="k">📉 銀行貸款餘額 (年息 4.5%)</span><span class="v ${S.debt>0?'neg':''}">${fmt(S.debt)}</span></div>
      <div class="prop-box"><span class="k">📊 可增貸額度</span><span class="v">${fmt(maxLoan)}</span></div>
    </div>
    <p style="font-size:12px;color:var(--ink3);margin-bottom:6px">📍 當前分行：香港滙豐銀行（${reg.name}分行） · 剩餘行動點：<b style="color:var(--amber)">${S.ap}</b></p>
    <input type="number" id="bankAmt" placeholder="輸入存款／取款／貸款／還款金額" min="1" inputmode="numeric" style="margin:6px 0 10px">
    <div class="sec">🏦 存提款業務（免行動點）</div>
    <div class="btnrow" style="margin-top:0">
      <button data-bk="dep" class="pri" ${S.money<=0?'disabled':''}>存入金額</button>
      <button data-bk="dep_all" ${S.money<=0?'disabled':''}>全部存入</button>
      <button data-bk="wd" ${S.deposit<=0?'disabled':''}>提取金額</button>
      <button data-bk="wd_all" ${S.deposit<=0?'disabled':''}>全部提取</button>
    </div>
    <div class="sec">💳 信用貸款與還款（免行動點）</div>
    <div class="btnrow" style="margin-top:0">
      <button data-bk="loan" class="pri" ${maxLoan<=0||S.age<18?'disabled':''}>申請銀行貸款</button>
      <button data-bk="repay" ${S.debt<=0||S.money<=0?'disabled':''}>現金償還貸款</button>
      <button data-bk="repay_all" ${S.debt<=0||S.money<=0?'disabled':''}>一鍵還清貸款</button>
    </div>
    <div class="sec">🔫 犯罪暗盤（極高風險 · 消耗 1 行動點）</div>
    <div class="btnrow" style="margin-top:0">
      <button data-bk="rob_solo" class="warn" ${S.ap<1||S.age<16?'disabled':''}>🎭 蒙面持械搶劫分行</button>
      <button data-bk="rob_heist" class="warn" ${S.ap<1||S.age<18||S.iq<65?'disabled':''}>💣 策劃金庫精密劫案 (需智商≥65)</button>
    </div>
    <p class="note">⚠️ 警告：搶劫銀行屬於重大刑案！成功可瞬間奪取數百萬至數千萬贓款，但一旦失手被特勤警力逮捕，將面臨 7～18 年重刑與巨額罰金，並留下嚴重前科！</p>`;
  const readVal=()=>{const v=Math.floor(parseFloat($('bankAmt').value));if(!v||v<=0){toast('請輸入有效金額');return 0}return v};
  const redo=()=>{normalize();render();openBankModal()};
  sheet({title:'🏦 銀行大廳',body:html,buttons:[{text:'離開銀行'}],onMount(){
    document.querySelectorAll('[data-bk]').forEach(b=>{b.onclick=()=>{
      const op=b.dataset.bk;
      if(op==='dep'){const v=readVal();if(!v)return;if(v>S.money)return toast('隨身現金不足');S.money-=v;S.deposit+=v;log(`你在${reg.name}分行存入了 ${fmt(v)} 元。`,'good');redo();return}
      if(op==='dep_all'){if(S.money<=0)return;const v=S.money;S.deposit+=v;S.money=0;log(`你將隨身現金 ${fmt(v)} 元全數存入銀行。`,'good');redo();return}
      if(op==='wd'){const v=readVal();if(!v)return;if(v>S.deposit)return toast('銀行存款不足');S.deposit-=v;S.money+=v;log(`你從銀行取出了 ${fmt(v)} 元現金。`);redo();return}
      if(op==='wd_all'){if(S.deposit<=0)return;const v=S.deposit;S.money+=v;S.deposit=0;log(`你從銀行全數提領了 ${fmt(v)} 元現金。`);redo();return}
      if(op==='loan'){
        if(S.age<18)return toast('未滿 18 歲無法貸款');
        const v=readVal();if(!v)return;
        if(v>maxLoan)return toast(`超過可貸額度上限（最高可貸 ${fmt(maxLoan)} 元）`);
        S.money+=v;S.debt+=v;
        log(`你向銀行申請了信用貸款 ${fmt(v)} 元（年利率 4.5%），目前總負債 ${fmt(S.debt)} 元。`,'big');
        redo();return;
      }
      if(op==='repay'){
        const v=readVal();if(!v)return;
        const pay=Math.min(v,S.money,S.debt);if(pay<=0)return toast('現金不足或無負債');
        S.money-=pay;S.debt-=pay;
        log(`你向銀行償還了 ${fmt(pay)} 元貸款，剩餘負債 ${fmt(S.debt)} 元。`,'good');
        redo();return;
      }
      if(op==='repay_all'){
        const pay=Math.min(S.money,S.debt);if(pay<=0)return;
        S.money-=pay;S.debt-=pay;
        log(`你償還了 ${fmt(pay)} 元銀行貸款${S.debt===0?'，無債一身輕！':''}`,'good');
        redo();return;
      }
      if(op==='rob_solo'||op==='rob_heist'){
        if(S.ap<1)return toast('行動點不足');
        S.ap--;S.moral-=25;
        const isHeist=op==='rob_heist';
        // 成功率：一般搶劫約 18%~32%，精密金庫劫案約 25%~45%（視智商與健康而定）
        const chance=isHeist
          ?clamp(0.20+(S.iq-60)*0.005+(S.health-50)*0.002,0.15,0.48)
          :clamp(0.14+(S.health-50)*0.003+(S.iq-50)*0.002,0.10,0.35);
        if(Math.random()<chance){
          const loot=Math.round((isHeist?ri(12000000,45000000):ri(1500000,6500000))*S.cpi);
          S.money+=loot;S.mood+=20;
          log(`🚨 驚天劫案！你在${reg.name}分行${isHeist?'透過精密計畫突破金庫防線':'蒙面持械行搶'}，在警網合圍前成功逃脫，得手贓款 ${fmt(loot)} 元！`,'big');
          normalize();render();closeSheet();
        }else{
          S.health-=ri(8,18);
          const yrs=isHeist?ri(10,18):ri(7,12);
          const fine=isHeist?1500000:500000;
          log(`🚓 警鈴大作！飛虎隊 (SDU) 及衝鋒隊瞬間包圍${reg.name}分行，你在交火與追捕中負傷落網！`,'bad');
          closeSheet();
          goPrison(isHeist?'結夥武裝強盜銀行金庫重罪':'持械搶劫銀行罪',yrs,fine);
          normalize();render();
        }
      }
    }});
  }});
}

/* ══════ 香港政府公共福利申請系統（含資產轉移與有限公司注資規劃） ══════ */
// 計算用於「公屋／社署入息及資產審查」的個人申報淨資產（獨立法人有限公司營運資本不計入個人現金資產，但若被揭發惡意虛報有法律風險）
function declaredWelfareAssets(){
  const h=S.assets.houses.reduce((a,x)=>a+x.price-(x.loan||0),0);
  const c=S.assets.cars.reduce((a,x)=>a+x.price,0);
  const bizNonCorp=S.businesses.reduce((a,x)=>a+(x.corpShield?0:bizValue(x)),0);
  const ccDebt=(S.cc&&S.cc.used)||0;
  return Math.max(0,Math.round(S.money+S.deposit+S.etf+S.stk+stockPortfolioValue()+S.trust+h+c+bizNonCorp-S.debt-ccDebt));
}
function openWelfareModal(){
  if(S.over||S.prison)return;
  S.welfare=S.welfare||{cssa:false,publicHousing:false,wfa:false,oala:false,transferred:0};
  const declNw=declaredWelfareAssets();
  const annualInc=(S.salary||0)+partnerIncome();
  const hasOwnHouse=S.assets.houses.length>0;
  const hasFamily=parentsAlive()||S.people.children.some(c=>c.alive);
  const hasBiz=S.businesses.length>0;

  // 1. 綜合社會保障援助 (綜援 CSSA)
  const cssaLim=(S.married?85000:50000)*S.cpi;
  const cssaOk=!hasOwnHouse&&declNw<=cssaLim&&annualInc<=60000*S.cpi;

  // 2. 申請輪候公共屋邨 (公屋 PRH)
  const prhLim=(S.married||S.people.children.length?580000:280000)*S.cpi;
  const prhOk=!hasOwnHouse&&declNw<=prhLim&&annualInc<=(S.married?360000:180000)*S.cpi;

  // 3. 在職家庭津貼 (職津 WFA)
  const wfaOk=(S.job||S.civil||S.military)&&!hasOwnHouse&&declNw<=450000*S.cpi&&annualInc<=260000*S.cpi;

  // 4. 長者生活津貼 / 高齡津貼 (生果金 OALA)
  const oalaOk=S.age>=65&&(S.age>=70||declNw<=420000*S.cpi);

  const html=`
    <div class="prop-grid">
      <div class="prop-box"><span class="k">📋 申報審查資產</span><span class="v">${fmt(declNw)}</span></div>
      <div class="prop-box"><span class="k">💼 家庭年收入</span><span class="v">${fmt(annualInc)}</span></div>
    </div>
    <div class="sec">🔄 資產規劃（降低個人申報資產以符合公屋／津貼資格）</div>
    <input type="number" id="wfTransferAmt" placeholder="輸入轉移給家人或注資有限公司的金額" min="1000" inputmode="numeric" style="margin:4px 0 8px">
    <div class="btnrow" style="margin-top:0">
      <button data-wf-op="transfer_fam" ${!hasFamily||S.money<=0?'disabled':''}>💸 資產轉移給父母／子女</button>
      <button data-wf-op="inject_corp" ${!hasBiz||S.money<=0?'disabled':''}>🏢 注資有限公司（獨立法人）</button>
      ${hasBiz&&S.businesses.some(b=>b.corpShield)?`<button data-wf-op="withdraw_corp">💰 從有限公司派息取回</button>`:''}
    </div>
    <p class="note" style="margin-top:6px">提示：將個人現金無償饋贈／轉移給直系親屬，或注資進「獨立法人有限公司」作為公司營運資本，可降低個人名下申報資產（注意：若申報公屋／綜援時隱瞞真實資產，被房屋署或社署抽查揭發將觸犯《欺詐罪》及《房屋條例》被懲教署檢控！）。</p>

    <div class="sec">🏛️ 社會福利署及房屋署津貼申請</div>
    <div class="acts-list" id="wfList">
      <div class="it ${S.welfare.publicHousing?'on':(!prhOk?'off':'')}" data-wf="prh">
        <div class="l">
          <div class="nm">🏢 申請政府公共屋邨（公屋上樓）${S.welfare.publicHousing?' ✅ 已入住':''}</div>
          <div class="ds">免買樓首期，大幅減免每年租金開支（減免 75% 住屋開銷） · 需無物業及申報資產 ≤ ${fmt(prhLim)}</div>
        </div>
        <div class="dg">${S.welfare.publicHousing?'受惠中':(prhOk?'立即申請':'<span class="w">資產/入息超標</span>')}</div>
      </div>
      <div class="it ${S.welfare.cssa?'on':(!cssaOk?'off':'')}" data-wf="cssa">
        <div class="l">
          <div class="nm">🆘 綜合社會保障援助（綜援 CSSA）${S.welfare.cssa?' ✅ 領取中':''}</div>
          <div class="ds">每年發放基本生活及租金津貼約 ${fmt(84000*S.cpi)} · 需無物業及申報資產 ≤ ${fmt(cssaLim)}</div>
        </div>
        <div class="dg">${S.welfare.cssa?'領取中':(cssaOk?'立即申請':'<span class="w">資產/入息超標</span>')}</div>
      </div>
      <div class="it ${S.welfare.wfa?'on':(!wfaOk?'off':'')}" data-wf="wfa">
        <div class="l">
          <div class="nm">👨‍👩‍👧 在職家庭津貼（職津 WFA）${S.welfare.wfa?' ✅ 領取中':''}</div>
          <div class="ds">鼓勵基層自力更生，每年額外津貼 ${fmt(36000*S.cpi)} · 需在職及申報資產 ≤ ${fmt(450000*S.cpi)}</div>
        </div>
        <div class="dg">${S.welfare.wfa?'領取中':(wfaOk?'立即申請':'<span class="w">資格不符</span>')}</div>
      </div>
      <div class="it ${S.welfare.oala?'on':(!oalaOk?'off':'')}" data-wf="oala">
        <div class="l">
          <div class="nm">👴 長者生活津貼／高齡津貼（生果金）${S.welfare.oala?' ✅ 領取中':''}</div>
          <div class="ds">年滿 65 歲長者每年發放敬老津貼 ${fmt(48000*S.cpi)}（70 歲以上免入息資產審查）</div>
        </div>
        <div class="dg">${S.welfare.oala?'領取中':(oalaOk?'立即申請':'<span class="w">未滿 65 歲或超標</span>')}</div>
      </div>
    </div>`;

  const redo=()=>{normalize();render();openWelfareModal()};
  sheet({title:'🏛️ 社會福利署 · 公共福利與資產申報',body:html,buttons:[{text:'關閉'}],onMount(){
    document.querySelectorAll('[data-wf-op]').forEach(b=>{b.onclick=()=>{
      const op=b.dataset.wfOp;
      const raw=Math.floor(parseFloat($('wfTransferAmt').value));
      if(op==='transfer_fam'){
        if(!hasFamily)return toast('你沒有在世的父母或子女可轉移資產');
        const amt=(raw&&raw>0)?Math.min(raw,S.money):S.money;
        if(amt<=0)return toast('現金不足');
        S.money-=amt;
        S.welfare.transferred=(S.welfare.transferred||0)+amt;
        const targets=[S.people.dad,S.people.mom,...S.people.children].filter(p=>p&&!p.absent&&p.alive);
        targets.forEach(t=>{t.rel=clamp(t.rel+8,0,100)});
        S.parentWealth+=Math.round(amt*0.6);
        log(`你將名下 ${fmt(amt)} 元現金轉移／饋贈給直系親屬（${targets.map(x=>x.name).join('、')}），個人名下資產已降低。`,'good');
        redo();return;
      }
      if(op==='inject_corp'){
        if(!hasBiz)return toast('你尚未成立有限公司（請先在求職中創業）');
        const amt=(raw&&raw>0)?Math.min(raw,S.money):S.money;
        if(amt<=0)return toast('現金不足');
        const c=S.businesses[0];
        S.money-=amt;
        c.capital+=amt;
        c.corpShield=true;
        c.shieldCash=(c.shieldCash||0)+amt;
        log(`你將 ${fmt(amt)} 元個人資金注資入「${c.name}」（獨立法人有限公司帳戶），個人名下現金資產大幅減少！`,'good');
        redo();return;
      }
      if(op==='withdraw_corp'){
        const c=S.businesses.find(x=>x.corpShield&&(x.shieldCash||0)>0);
        if(!c)return toast('有限公司帳戶無可提取之股東往來款');
        const amt=(raw&&raw>0)?Math.min(raw,c.shieldCash):c.shieldCash;
        c.shieldCash-=amt;c.capital=Math.max(100000,c.capital-amt);
        if(c.shieldCash<=0)c.corpShield=false;
        S.money+=amt;
        log(`你從「${c.name}」有限公司帳戶提取股東往來款 ${fmt(amt)} 元回個人戶口。`);
        redo();return;
      }
    }});
    $('wfList').addEventListener('click',e=>{
      const it=e.target.closest('.it');if(!it)return;
      const k=it.dataset.wf;
      const hiddenWealth=(S.welfare.transferred||0)+S.businesses.reduce((a,x)=>a+(x.shieldCash||0),0);
      const checkFraud=(limit)=>{
        if(hiddenWealth>limit*0.5&&Math.random()<0.26){
          closeSheet();
          S.welfare.publicHousing=false;S.welfare.cssa=false;S.welfare.wfa=false;
          goPrison('虛假陳述及欺詐公屋／綜援津貼罪（《房屋條例》第26條）',ri(1,3),Math.max(50000,Math.round(hiddenWealth*0.25)));
          normalize();render();
          return true;
        }
        return false;
      };
      if(k==='prh'){
        if(S.welfare.publicHousing)return toast('你已獲編配並入住公共屋邨');
        if(!prhOk)return toast('申報資產或入息超出公屋申請上限');
        if(checkFraud(prhLim))return;
        S.welfare.publicHousing=true;S.home='rent';S.mood+=12;
        log('🎉 房屋署通知：你通過入息及資產審查，成功獲編配公共屋邨單位並正式「上樓」！往後每年住屋租金大幅減免 75%。','big');
      }else if(k==='cssa'){
        if(S.welfare.cssa)return toast('你已在領取綜援');
        if(!cssaOk)return toast('申報資產或入息超出綜援審查上限');
        if(checkFraud(cssaLim))return;
        S.welfare.cssa=true;S.mood+=6;
        log('社會福利署批核了你的「綜合社會保障援助（綜援）」申請，每年將發放生活津貼助你渡過難關。','good');
      }else if(k==='wfa'){
        if(S.welfare.wfa)return toast('你已在領取在職家庭津貼');
        if(!wfaOk)return toast('需為在職基層人士且申報資產未超標');
        S.welfare.wfa=true;S.mood+=6;
        log('在職家庭及學生資助事務處批核了你的「在職家庭津貼」申請！','good');
      }else if(k==='oala'){
        if(S.welfare.oala)return toast('你已在領取長者津貼');
        if(!oalaOk)return toast('需年滿 65 歲並符合審查資格');
        S.welfare.oala=true;S.mood+=8;
        log('你成功申請「長者生活津貼／高齡津貼（生果金）」，每年可領取敬老津貼！','good');
      }
      redo();
    });
  }});
}

];
function initStocks(){
  if(!S.stocks||typeof S.stocks!=='object')S.stocks={};
  STOCK_LIST.forEach(st=>{
    if(!S.stocks[st.code])S.stocks[st.code]={price:st.base,prev:st.base,shares:0,cost:0,hist:[st.base]};
    if(!Array.isArray(S.stocks[st.code].hist)||!S.stocks[st.code].hist.length)S.stocks[st.code].hist=[S.stocks[st.code].price||st.base];
  });
  if(typeof S.stockRefreshLeft!=='number')S.stockRefreshLeft=3;
}
function sparkSvg(hist){
  if(!hist||hist.length<2)return '';
  const w=56,h=18,min=Math.min(...hist),max=Math.max(...hist),rng=Math.max(0.1,max-min);
  const pts=hist.map((v,i)=>`${(i/(hist.length-1)*w).toFixed(1)},${(h-2-((v-min)/rng)*(h-4)).toFixed(1)}`).join(' ');
  const up=hist[hist.length-1]>=hist[0];
  return `<svg width="${w}" height="${h}" style="vertical-align:middle;margin-left:4px"><polyline fill="none" stroke="${up?'var(--sage)':'var(--rust)'}" stroke-width="1.5" points="${pts}"/></svg>`;
}
function stockPortfolioValue(){
  if(!S||!S.stocks)return 0;
  return Math.round(Object.values(S.stocks).reduce((a,x)=>a+(x.shares||0)*(x.price||0),0));
}
function liquidateAllStocks(){
  initStocks();
  let total=0;
  STOCK_LIST.forEach(st=>{
    const cur=S.stocks[st.code];
    if(cur&&cur.shares>0){
      total+=Math.round(cur.shares*cur.price);
      cur.shares=0;cur.cost=0;
    }
  });
  return total;
}
function refreshStockPrices(isAnnual=false){
  initStocks();
  if(!isAnnual){
    if(S.stockRefreshLeft<=0)return toast('今年盤中報價更新次數（3/3）已用完！');
    S.stockRefreshLeft--;
  }
  const econFactor=(S.econ&&S.econ.stock)?S.econ.stock*0.45:0;
  STOCK_LIST.forEach(st=>{
    const cur=S.stocks[st.code];
    cur.prev=cur.price;
    const shock=econFactor+gauss()*st.vol*(isAnnual?0.85:0.38)+(S.finLit||0)*0.002;
    cur.price=Math.max(5,Math.round(cur.price*(1+clamp(shock,-0.55,0.75))*10)/10);
    cur.hist=cur.hist||[cur.prev];
    cur.hist.push(cur.price);
    if(cur.hist.length>6)cur.hist.shift();
  });
  if(!isAnnual){
    toast(`已更新最新股價（今年剩餘更新：${S.stockRefreshLeft}/3 次）`);
    normalize();render();openProperty();
  }
}

function incomeTax(netReal){ // 香港薪俸稅（累進稅率 2%/6%/10%/14%/17% 與標準稅率 15% 較低者）
  if(netReal<=0)return 0;
  const B=[[50000,.02,0],[100000,.06,2000],[150000,.10,6000],[200000,.14,12000],[Infinity,.17,18000]];
  let prog=0;
  for(const[l,r,d]of B){if(netReal<=l){prog=netReal*r-d;break}}
  return Math.min(prog,netReal*0.15);
}
function estateTax(net,spouse,kids){ // 香港已豁免遺產稅，僅收遺產承辦律師費及法庭雜費（約 0.8%，上限 25 萬）
  if(net<=0)return 0;
  return Math.min(Math.round(250000*S.cpi),Math.round(net*0.008));
}
function baseMort(a){if(a<1)return .004;if(a<15)return .0003;if(a<25)return .0006;if(a<35)return .0007;if(a<45)return .0012;if(a<55)return .003;if(a<65)return .007;if(a<75)return .016;if(a<85)return .042;if(a<95)return .11;return .24}
function deathChance(a,g,h){let p=baseMort(a);if(g==='M'&&a>=15)p*=1.25;p*=0.5+(100-h)/45;return clamp(p,0,0.85)}

/* ══════ 彈窗 ══════ */
function sheet({title,body,buttons,onMount,closable=true}){
  const ov=$('ov');
  ov.innerHTML=`<div class="sheet"><h2>${title}</h2><div class="body">${body}</div><div class="btnrow"></div></div>`;
  const row=ov.querySelector('.btnrow');
  (buttons||[{text:'關閉'}]).forEach(b=>{
    const el=document.createElement('button');el.textContent=b.text;if(b.cls)el.className=b.cls;if(b.disabled)el.disabled=true;
    el.onclick=()=>{const keep=b.onClick?b.onClick()===true:false;if(!keep)closeSheet()};
    row.appendChild(el);
  });
  ov.classList.add('show');document.body.classList.add('locked');
  ov.onclick=e=>{if(e.target===ov&&closable)closeSheet()};
  if(onMount)onMount();
}
function closeSheet(){$('ov').classList.remove('show');$('ov').innerHTML='';document.body.classList.remove('locked');setTimeout(flushQueue,160)}

/* ══════ 薪資與生活成本 ══════ */
function jobPay(job,pos,yrs){return Math.round(job.m*YEAR_M*(1+0.18*pos)*(1+Math.min(yrs,15)*0.012)*S.cpi*S.payMod)}
function rankPay(r){return Math.round(r.m*YEAR_M*S.cpi)}
function partnerIncome(){
  const p=S.partner;if(!S.married||!p||p.age<22||p.age>=65)return 0;
  return Math.round((p.inc||0)*S.cpi);
}
function livingCost(){
  const R={food:0,housing:0,kids:0,total:0};
  if(S.age<18)return R;
  const lm=[0.72,1,1.6][S.lifestyle];const regMod=getRegion(S.region).costMod;const base=300000*S.cpi*regMod;
  const owns=S.assets.houses.some(h=>!h.rented);
  const withParents=S.home==='parents'&&parentsAlive();
  if(S.school&&withParents)return R;                       // 學生住家裡：父母負擔
  R.food=base*lm*(S.married?1.7:1)*(S.age>=65?0.85:1);
  if(owns)R.housing=0;
  else if(withParents){R.housing=base*0.12;R.food*=0.8}
  else{let rentBase=(S.married||S.people.children.length?380000:220000)*S.cpi*(S.school?0.5:1);if(S.welfare&&S.welfare.publicHousing)rentBase*=0.25;R.housing=rentBase}
  if(!S.school&&!S.job&&!S.civil&&!S.military&&withParents)R.food*=0.7;
  S.people.children.forEach(c=>{
    if(!c.alive)return;
    if(c.age>=22&&(c.job||c.spouse))return;
    let k=c.age<6?200000:c.age<12?150000:c.age<18?180000:250000;
    k*=S.cpi;if(c.age<5)k-=60000;     // 育兒補助
    R.kids+=Math.max(0,k);
  });
  R.total=Math.round(R.food+R.housing+R.kids);
  return R;
}
function netWorth(){
  const h=S.assets.houses.reduce((a,x)=>a+x.price-(x.loan||0),0);
  const c=S.assets.cars.reduce((a,x)=>a+x.price,0);
  const b=S.businesses.reduce((a,x)=>a+bizValue(x),0);
  const ccDebt=(S.cc&&S.cc.used)||0;
  return Math.round(S.money+S.deposit+S.etf+S.stk+stockPortfolioValue()+S.trust+h+c+b-S.debt-ccDebt);
}
const bizValue=c=>Math.round(Math.max(c.capital*(0.6+(c.rd||0)*0.15+(c.mna||0)*0.3),(c.lastProfit>0?c.lastProfit*(c.listed?6.5:3.2):0))*(c.listed?1.6:1));

function actReason(a){if(S.ap<a.ap)return'行動點不足';if(a.cost&&S.money<a.cost)return'金錢不足';return a.can?a.can(S):''}

function dim(key,before,f1,f2){if(S[key]>before){const f=before>85?f2:before>70?f1:1;S[key]=before+(S[key]-before)*f}}
function openActivities(){

function refreshActList(){

function openRelations(tab){
  if(S.over)return;if(tab)_relTab=tab;
  const p=S.people;
  const famCount=(p.dad&&!p.dad.absent?1:0)+(p.mom&&!p.mom.absent?1:0);
  const tabs=[{k:'fam',label:'家人',n:famCount},{k:'fri',label:'朋友',n:p.friends.filter(f=>f.alive).length},{k:'par',label:'伴侶',n:S.partner?1:0},{k:'chi',label:'子女',n:p.children.length}];
  const body=`<div class="tabs">${tabs.map(t=>`<button data-tab="${t.k}" class="${_relTab===t.k?'on':''}">${t.label}<span class="cnt">${t.n}</span></button>`).join('')}</div><div id="tabBody"></div>`;
  sheet({title:'關係',body,buttons:[{text:'關閉'}],onMount(){
    const renderTab=()=>{
      $('tabBody').innerHTML=_relTab==='fam'?tabFamily():_relTab==='fri'?tabFriends():_relTab==='par'?tabPartner():tabChildren();
      document.querySelectorAll('.person .acts button').forEach(btn=>{btn.onclick=()=>handlePersonAction(btn.dataset.act,parseInt(btn.dataset.id))});
    };
    document.querySelectorAll('.tabs button').forEach(b=>{b.onclick=()=>{_relTab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===_relTab));renderTab()}});
    renderTab();
  }});
}
function personCard({name,gender,tag,tagCls,meta,rel,acts,dead}){
  const avaCls=dead?'ava dead':(gender==='F'?'ava f':'ava');
  const relColor=rel>=66?'var(--sage)':rel>=33?'var(--amber)':'var(--rust)';
  return `<div class="person"><div class="${avaCls}">${dead?'—':name.charAt(0)}</div><div class="info"><div class="n">${name}${tag?`<span class="tag ${tagCls||''}">${tag}</span>`:''}</div><div class="meta">${meta}</div><div class="relbar"><i style="width:${rel}%;background:${relColor}"></i></div><div class="acts">${acts||''}</div></div></div>`;
}
function tabFamily(){
  const p=S.people;
  if(p.dad.absent&&p.mom.absent)return `<div class="empty">你沒有父母，一路走來都是靠自己。</div>`;
  return [p.dad,p.mom].filter(w=>!w.absent).map(who=>{
    const ageTxt=who.alive?`${who.age} 歲 · ${identityOf(who.age,who.job)}`:`<span class="dead">已故</span>`;

}
function tabFriends(){

function findPerson(id){const p=S.people;return [p.dad,p.mom,...p.friends,...p.children,S.partner].filter(Boolean).find(x=>x.id===id)}
function canConfess(f){
  if(S.married||S.partner||S.age<16||!f.alive||f.rel<50)return false;
  if(S.age>=18){if(f.age<18||Math.abs(f.age-S.age)>10)return false}
  else{if(f.age>=18||Math.abs(f.age-S.age)>3)return false}
  const o=S.orientation||'hetero';
  if(o==='hetero'&&f.gender===S.gender)return false;
  if(o==='homo'&&f.gender!==S.gender)return false;
  return true;
}
function doDivorce(why){
  const p=S.partner;if(!p)return;
  const share=Math.round(Math.max(0,S.money+S.deposit+S.etf+S.stk+stockPortfolioValue())*0.5);
  let paid=Math.min(share,S.money);S.money-=paid;
  let rest=share-paid;if(rest>0){const d=Math.min(rest,S.deposit);S.deposit-=d;rest-=d}
  if(rest>0){const d=Math.min(rest,S.etf);S.etf-=d;rest-=d}
  const kids=S.people.children.filter(c=>c.alive&&c.age<18).length;
  S.partner=null;S.married=false;S.mood-=30;S.eq+=2;
  log(`${why||'你們離婚了'}。依法平分婚後財產，你付出約 ${fmt(share)} 元${kids?`；${kids} 個未成年孩子由你扶養`:''}。`,'bad');
}

      else{p.rel-=8;log(`${p.name} 覺得你管太多，有些不耐煩。`,'bad')}

        }

// 回傳不能買的原因；空字串＝可以買（貸款或現金）
function houseBlock(h){
  if(S.age<20)return'滿 20 歲才能買房';
  const price=Math.round(h.price*S.houseIdx*getRegion(S.region).houseMod),down=Math.round(price*0.2),fee=Math.round(price*0.01);
  if(S.money>=price+fee)return'';                                       // 現金買得起
  if(S.money<down+fee)return`自備款不足（需 ${fmt(down+fee)}）`;
  const loan=price-down,r=MORT_RATE,pay=Math.round(loan*r/(1-Math.pow(1+r,-30)));
  const income=(S.salary||0)+partnerIncome()*0.8+S.assets.houses.reduce((a,x)=>a+(x.rented?x.price*0.022:0),0);
  return pay<=income*0.5?'':`貸款 DTI 不過（年還款 ${fmt(pay)} ＞ 年收入一半）`;
}
function confirmBuyHouse(id){
  const h=HOUSE_TYPES.find(x=>x.id===id);if(!h)return;
  if(S.age<20)return toast('滿 20 歲才能買房');
  const price=Math.round(h.price*S.houseIdx*getRegion(S.region).houseMod);
  const down=Math.round(price*0.2);const fee=Math.round(price*0.01);
  const loan=price-down;const n=30;const r=MORT_RATE;
  const pay=Math.round(loan*r/(1-Math.pow(1+r,-n)));
  const income=(S.salary||0)+partnerIncome()*0.8+S.assets.houses.reduce((a,x)=>a+(x.rented?x.price*0.022:0),0);
  const dti=pay<=income*0.5;
  const html=`<p>${h.name}，總價 <b style="color:var(--amber)">${fmt(price)}</b>。</p>
    <div class="row"><span class="k">貸款：頭期款（20%）＋ 規費</span><span class="v">${fmt(down+fee)}</span></div>
    <div class="row"><span class="k">貸款：每年還款（30 年）</span><span class="v ${dti?'':'neg'}">${fmt(pay)}</span></div>
    <div class="row"><span class="k">現金購入：需要</span><span class="v">${fmt(price+fee)}</span></div>
    <p class="note">${dti?'銀行評估你的收入可以核貸。':'你的年收入不到年還款的兩倍，銀行不太可能核貸。'}</p>`;
  sheet({title:'購買'+h.name,body:html,buttons:[
    {text:'貸款購入',cls:'pri',disabled:S.money<down+fee||!dti,onClick:()=>{S.money-=down+fee;S.assets.houses.push({...h,price,cost:price,boughtAge:S.age,rented:false,loan,pay,rate:r,left:n});S.home='own';log(`你貸款買下了${h.name}，總價 ${fmt(price)} 元，每年還款 ${fmt(pay)} 元。`,'big');normalize();render();setTimeout(openProperty,60);return true}},
    {text:'現金購入',disabled:S.money<price+fee,onClick:()=>{S.money-=price+fee;S.assets.houses.push({...h,price,cost:price,boughtAge:S.age,rented:false,loan:0,pay:0,rate:r,left:0});S.home='own';log(`你用現金買下了${h.name}，價值 ${fmt(price)} 元。`,'big');normalize();render();setTimeout(openProperty,60);return true}},
    {text:'返回',onClick:()=>{setTimeout(openProperty,60);return true}},
  ]});
}
function sellHouse(i,redo){
  const h=S.assets.houses[i];if(!h)return;
  let sp=Math.round(h.price*0.97);
  const gain=sp-(h.cost||h.price);const held=S.age-(h.boughtAge||S.age);
  let tax=0;if(gain>0)tax=Math.round(gain*(held<2?0.45:held<10?0.2:0.15));
  const payoff=h.loan||0;
  S.money+=sp-tax-payoff;S.assets.houses.splice(i,1);
  if(!S.assets.houses.some(x=>!x.rented)&&S.home==='own')S.home=parentsAlive()?'parents':'rent';
  log(`你賣出了${h.name}，成交 ${fmt(sp)} 元${tax?`，額外印花稅 (SSD) ${fmt(tax)} 元`:''}${payoff?`，還清貸款 ${fmt(payoff)} 元`:''}。`,'big');
  redo();
}

/* ══════ 求職 ══════ */
function jobReason(j){
  if(j.need>S.eduLevel)return'學歷不足';
  if(j.vol&&S.age>35)return'超過報考年齡';
  if(j.major&&S.major!==j.major)return'科系不符';
  if(j.lic&&!S.licenses[j.lic])return'需通過專業執業試';
  if(j.startup&&S.money<BIZ_START)return`需資金 ${fmt(BIZ_START)}`;
  if(j.renown&&S.renown<j.renown)return`知名度 ${Math.round(S.renown)}/${j.renown}`;
  if(j.minHealth&&S.health<j.minHealth)return`健康需 ${j.minHealth}`;
  if(j.fee&&S.money<j.fee)return`需訓練費 ${fmt(j.fee)}`;
  if(j.startup&&S.businesses.length>=3)return'公司數已達上限';
  return'';
}
function openJobSearch(){
  if(S.over||S.prison)return;
  if(S.age<16)return toast('滿 16 歲才能求職');
  if(S.school)return toast('求學期間無法全職工作');

    return;
  }

}
function openJobList(switching){
  if(S.apps<=0){sheet({title:'求職',body:'<p>今年你已經投遞了太多履歷，明年再來吧。</p>',buttons:[{text:'關閉'}]});return}
  const ok=[],locked=[];
  JOBS.forEach(j=>{const r=jobReason(j);(r?locked:ok).push([j,r])});
  const row=([j,r])=>`<div class="it ${r?'off':''}" data-id="${j.id}"><div class="l"><div class="nm">${j.name}</div><div class="ds">${j.cat} · ${j.startup?'自己當老闆（需 '+fmt(BIZ_START)+' 資本）':'起薪年薪約 '+fmt(jobPay(j,0,0))+(j.lic?' · 需專業執業試':'')+(j.fee?' · 訓練費 '+fmt(j.fee):'')}</div></div><div class="dg">${r?`<span class="w">${r}</span>`:'應徵'}</div></div>`;
  const html=`<p style="color:var(--ink3);font-size:12px;margin-bottom:8px">學歷：${S.eduName}${S.major?' · '+(MAJORS.find(m=>m.id===S.major)?.name||''):''}。今年還能投遞 <b style="color:var(--amber)">${S.apps}</b> 次，錄取不保證。</p><div class="acts-list" id="jobList">${ok.map(row).join('')}${locked.length?`<div class="cat-title">尚未達成條件</div>${locked.map(row).join('')}`:''}</div>`;
  sheet({title:switching?'換工作':'求職',body:html,buttons:[{text:'暫不應徵'}],onMount(){
    $('jobList').addEventListener('click',e=>{
      const it=e.target.closest('.it');if(!it||it.classList.contains('off'))return;
      const job=JOBS.find(j=>j.id===it.dataset.id);if(!job)return;
      if(job.startup){closeSheet();startBusiness();return}
      S.apps--;
      const recPen=(S.crimeRecord&&S.crimeRecord.length)?0.18:0;
      const chance=clamp((job.need<=1?0.8:0.62)+(S.iq+S.eq-100)*0.002+(S.eduLevel>job.need?0.1:0)+S.renown*0.001-recPen,0.15,0.95);
      if(Math.random()>chance){S.mood-=4;log(`你應徵「${job.name}」，面試後沒有收到錄取通知。`,'bad');normalize();render();closeSheet();if(S.apps>0)queue(()=>openJobList(switching));return}
      if(switching)dropJob(true);
      if(job.fee){S.money-=job.fee;log(`你支付了 ${fmt(job.fee)} 元的飛行訓練費用。`)}
      if(job.id==='civil'){closeSheet();chooseCivilUnit(job);return}
      if(job.vol){closeSheet();enlist('vol');return}
      S.job=job;S.payMod=1;S.salary=jobPay(job,0,0);S.working=true;S.jobPosition=0;S.workYears=0;S.retired=false;S.mood+=10;
      log(`你成為了一名「${job.name}」，年薪 ${fmt(S.salary)} 元。`,'big');normalize();render();closeSheet();
    });
  }});
}

function companyYear(c){
  c.years++;const bt=BIZ_TYPES.find(b=>b.id===c.type);
  const n=c.employees.length;
  const attn=1/(1+0.35*(S.businesses.length-1));
  const cap=(1+0.6*Math.pow(n,0.85))*(1+(c.rd||0)*0.18+(c.mna||0)*0.35)*(c.listed?1.25:1);
  const rep=0.5+c.reputation/100;
  let rev=bt.base*S.cpi*cap*rep*attn*Math.max(0.3,1+gauss()*0.18);
  let crisis='';
  if(Math.random()<bt.risk*0.08*(1-(c.rd||0)*0.05)){rev*=rnd(0.3,0.6);crisis=pick(['景氣寒冬','重大客訴','供應鏈中斷','競爭對手殺價'])}
  const wages=c.employees.reduce((a,e)=>a+e.salary,0)*S.cpi;
  const marginBoost=Math.min(0.85,bt.margin+(c.rd||0)*0.02);
  const profit=rev*marginBoost-bt.base*0.3*S.cpi*(1+(c.mna||0)*0.2)-wages;
  c.lastProfit=profit;
  let net=profit;
  if(profit>0){net=profit*0.72;c.loss=0}else c.loss=(c.loss||0)-profit;
  log(`【${c.name}】${crisis?'遇上'+crisis+'，':''}營收 ${fmt(rev)}，${profit>=0?'淨利':'虧損'} ${fmt(Math.abs(profit))} 元${profit>0?`（稅後 ${fmt(net)}）`:''}。`,profit>=0?'good':'bad');
  c.reputation=clamp(c.reputation+ri(-3,3)+(c.rd>0?1:0),0,100);
  if(c.loss>c.capital*4){log(`「${c.name}」連年虧損，宣告倒閉。`,'bad');S.businesses=S.businesses.filter(x=>x.id!==c.id);S.mood-=30}
  return net;
}

      log(isTop?`🎉 歷史性的一刻！你贏得全國大選，正式宣誓就職「行政長官（特首）」，成為香港特區最高首長！`:`政績卓著，你獲拔擢／提名當選為「${ranks[p.rankIndex].name}」！`,'big');
      S.mood+=isTop?40:18;S.renown+=isTop?20:7;
    }else if(p.score<28){
      log('施政失靈、民怨沸騰，你被迫引咎辭職，回到民間。','bad');S.mood-=25;S.politician=null;S.salary=0;S.job=null;
    }
  }else if(p.path==='local'){
    if(p.rankIndex<2){
      if(p.term>=2&&p.score>=62&&Math.random()<0.5){
        p.rankIndex++;p.term=0;S.salary=rankPay(ranks[p.rankIndex]);
        log(`地方政績亮眼，你獲拔擢升任「${ranks[p.rankIndex].name}」！`,'big');S.mood+=15;S.renown+=5;
      }else if(p.score<28){
        log('地方施政不力，你遭到調職解任。','bad');S.mood-=20;S.politician=null;S.salary=0;S.job=null;
      }
    }else if(p.term>0&&p.term%4===0){
      const next=p.rankIndex<ranks.length-1?ranks[p.rankIndex+1]:null;
      const out=next?(next.cost||20000000)*0.25:0;
      const aim=next&&p.score>=62&&p.approval>=55&&S.money>=out;
      const ch=clamp(0.38+(p.approval-55)*0.012+S.renown*0.003+S.eq*0.002-(aim?0.05:0)+(aim?0:0.2),0.15,0.88);
      if(aim)S.money-=out;
      if(Math.random()<ch){
        if(aim){
          p.rankIndex++;p.term=0;S.salary=rankPay(ranks[p.rankIndex]);
          const isTop=ranks[p.rankIndex].name==='行政長官（特首）';
          log(isTop?`🎉 從基層地區政務／議會一路打拚，你高票當選「行政長官（特首）」！`:`地方選舉大勝！你自籌 ${fmt(out)} 元競選，當選「${ranks[p.rankIndex].name}」！`,'big');
          S.mood+=isTop?40:28;S.renown+=isTop?20:10;
        }else log('任期屆滿選舉，你以高滿意度順利連任！','good');
      }else{
        if(aim){log(`你投入 ${fmt(out)} 元挑戰「${next.name}」失利，但仍保有原職。`,'bad');S.mood-=15}
        else{log('選舉連任失利，你卸下地方公職。','bad');S.mood-=25;S.politician=null;S.salary=0;S.job=null}
      }
    }
  }else if(p.term>0&&p.term%4===0){
    const next=p.rankIndex<ranks.length-1?ranks[p.rankIndex+1]:null;
    const out=next?next.cost*0.3:0;
    const aim=next&&p.score>=60&&S.money>=out;
    const ch=clamp(0.4+(p.score-60)*0.01+S.renown*0.003+S.eq*0.002-(aim?0.05:0)+(aim?0:0.2),0.15,0.85);
    if(aim)S.money-=out;
    if(Math.random()<ch){
      if(aim){p.rankIndex++;S.salary=rankPay(ranks[p.rankIndex]);log(`選舉年！你自籌 ${fmt(out)} 元競選，當選「${ranks[p.rankIndex].name}」！`,'big');S.mood+=30;S.renown+=8}
      else log('選舉年，你順利連任。','good');
    }else{
      if(aim){log(`選舉年！你花了 ${fmt(out)} 元挑戰更IVE 職專課程位，不幸落選，但仍保有原職。`,'bad');S.mood-=15}
      else{log('選舉年，你連任失敗，下台一鞠躬。','bad');S.mood-=25;S.politician=null;S.salary=0}
    }
  }

// kind: 'conscript' 輔警／民安隊培訓 | 'alt' 替代役 | 'vol' 紀律部隊
function enlist(kind){
  dropJob(true);S.militaryDone=true;S.retired=false;
  let idx=0,rank,left=1;
  if(kind==='conscript')rank={...MILITARY_RANKS[0],m:CONSCRIPT_M};
  else if(kind==='alt')rank={name:'替代役男',m:CONSCRIPT_M,years:1};
  else{idx=S.eduLevel>=3?6:3;rank={...MILITARY_RANKS[idx]};left=0}
  S.military={kind,rank,rankIndex:idx,yearsServed:0,yearsInRank:0,performance:60,volunteer:kind==='vol',left,budget:200000000,morale:70,readiness:70};
  S.salary=Math.round(rank.m*12*S.cpi);S.working=true;
  log(kind==='conscript'?'你投考服輔警／民安隊培訓，成為一名學警，役期 1 年。':kind==='alt'?'你分發到服務機關服替代役，役期 1 年。':`你考取紀律部隊，以${rank.name}起步，決心在紀律部隊長期發展。`,'big');
  normalize();render();
}

// 年度結算：doNextYear → workIncome() 會呼叫它，回傳當年紀律部隊收入
function militaryYear(){
  const m=S.military;
  const kind=m.kind||(m.volunteer?'vol':'conscript');m.kind=kind;
  if(m.left===undefined)m.left=kind==='vol'?0:Math.max(0,1-(m.yearsServed||0));
  const sen=kind==='vol'?1+Math.min(m.yearsInRank,m.rank.years)*0.012:1;
  const pay=Math.round(m.rank.m*sen*12*S.cpi);
  m.yearsServed++;m.yearsInRank++;S.salary=pay;
  log(`紀律部隊薪資 ${fmt(pay)} 元（${m.rank.name}${kind==='vol'?'，同階第 '+m.yearsInRank+' 年':''}）。`);
  if(kind==='vol'){
    S.pubYears++;S.lastSalary=pay/S.cpi;
    if(m.rankIndex>=12){
      m.budget=(m.budget||200000000)+Math.round((m.rankIndex-10)*180000000*S.cpi);
      m.morale=clamp((m.morale||70)+ri(-2,2),0,100);
      m.readiness=clamp((m.readiness||70)+ri(-2,2),0,100);
    }
    m.performance=clamp(m.performance+rnd(-4,14)+S.health*0.04+S.iq*0.02+S.eq*0.02+((m.readiness||70)-70)*0.08,0,100);
    const cap=S.eduLevel>=3?MILITARY_RANKS.length-1:5;
    if(m.yearsInRank>=m.rank.years&&m.performance>58&&m.rankIndex<cap){
      m.rankIndex++;m.rank={...MILITARY_RANKS[m.rankIndex]};m.yearsInRank=0;m.capped=false;
      if(m.rankIndex>=12&&!m.budget)m.budget=400000000;
      const g=m.rankIndex>=12;
      const isCmd=m.rankIndex>=15;
      log(`表現優異，晉升為「${m.rank.name}」${isCmd?'，執掌軍種大權，位極人臣！':g?'，將星閃耀！':''}`,'big');
      S.mood+=isCmd?35:g?25:15;S.renown+=isCmd?12:g?5:1;
    }else if(m.rankIndex>=cap&&m.rankIndex<MILITARY_RANKS.length-1&&!m.capped){
      m.capped=true;log('你已升到員佐級人員最高階；想晉升督察級以上長官，需要大學學歷。','bad');
    }
    if(Math.random()<0.04){S.health-=ri(4,10);log('一次操演中你受了傷，休養了一陣子。','bad')}
  }else{
    if(kind==='conscript'){S.health+=3;S.eq+=1;S.moral+=1;S.mood-=3;log('一年的紀律部隊磨練，體能與紀律都進步了。','good');
      if(Math.random()<0.05){S.health-=ri(3,8);log('訓練中受了點傷。','bad')}}
    else{S.moral+=6;S.eq+=4;S.mood+=2;log('你在服務機關貢獻所長，道德 +6、情商 +4。','good')}
    m.left--;
    if(m.left<=0){
      log(kind==='conscript'?'一年輔警／民安隊培訓期滿，你光榮榮休／離任。':'一年替代役期滿，你順利役畢。','big');
      S.military=null;S.salary=0;S.working=false;S.mood+=8;S.pendingOffer=true;
      queueJob();
    }
  }
  return pay;
}

    <p class="note" style="margin-top:0;margin-bottom:8px">剩餘行動點：<b style="color:var(--amber)">${S.ap}</b>。勤力溫習各科與參加課外活動可提升升學競爭力；若長期逃學或操行過低，將面臨被學校勒令退學（輟學）的風險！</p>

    <div class="sec">📚 科目修讀與補習強化（消耗 1 行動點）</div>
    <div class="acts-list" id="stuSubjList">
      ${subjNames.map(([k,nm])=>`<div class="it ${S.ap<1?'off':''}" data-subj="${k}">
        <div class="l"><div class="nm">${nm} <span style="color:var(--sky);font-size:11.5px">(${Math.round(st.subjects[k])}分)</span></div><div class="ds">專攻此科提升成績與智商，降低輟學風險</div></div>
        <div class="dg">溫習 −1 AP</div>
      </div>`).join('')}
    </div>

    <div class="sec">🏅 校園課外活動與校隊（消耗 1 行動點）</div>
    <div class="btnrow" style="margin-top:0">
      <button data-stu-act="club" ${S.ap<1?'disabled':''}>${st.club?`社團訓練 (${st.club})`:'加入校園學會／校隊'}</button>
      <button data-stu-act="comp" ${S.ap<1?'disabled':''}>參加學界公開賽</button>
      <button data-stu-act="skip" class="warn" ${S.ap<1?'disabled':''}>偷懶逃學打機</button>
    </div>

    ${S.age>=15?`<div class="sec">🚪 學籍異動</div>
    <div class="btnrow" style="margin-top:0">
      <button data-stu-act="dropout" class="warn">主動申請退學（輟學投身社會）</button>
    </div>`:''}`;

  const redo=()=>{normalize();render();openStudentModal()};
  sheet({title:'🎒 校園生活與學業管理',body:html,buttons:[{text:'關閉'}],onMount(){
    $('stuSubjList').addEventListener('click',e=>{
      const it=e.target.closest('.it');if(!it||it.classList.contains('off'))return;
      if(S.ap<1)return toast('行動點不足');
      const k=it.dataset.subj;
      S.ap--;
      const gain=ri(4,9);
      st.subjects[k]=clamp(st.subjects[k]+gain,0,100);
      st.gpa=Math.round((st.subjects.chi+st.subjects.eng+st.subjects.math+st.subjects.elective)/4);
      st.dropoutRisk=clamp(st.dropoutRisk-6,0,100);
      S.iq+=2;S.mood-=2;
      log(`你專心溫習科目，該科成績提升 +${gain} 分（目前平均分 ${st.gpa}）。`,'good');
      redo();
    });
    document.querySelectorAll('[data-stu-act]').forEach(b=>{b.onclick=()=>{
      const act=b.dataset.stuAct;
      if(act==='dropout'){
        closeSheet();
        leaveSchool(`你在 ${S.age} 歲決定主動輟學離開校園，提前踏入社會謀生。`,'bad');
        normalize();render();return;
      }
      if(S.ap<1)return toast('行動點不足');
      S.ap--;
      if(act==='club'){
        if(!st.club)st.club=pick(clubs);
        S.eq+=4;S.health+=2;S.mood+=6;st.conduct=clamp(st.conduct+4,0,100);st.dropoutRisk=clamp(st.dropoutRisk-4,0,100);
        log(`你參加了「${st.club}」的課外活動，結識不少同學，情商與操行提升！`,'good');
      }else if(act==='comp'){
        const win=Math.random()<clamp((st.gpa-45)*0.012+S.iq*0.003,0.15,0.85);
        if(win){S.renown+=5;S.iq+=3;S.mood+=15;st.gpa=clamp(st.gpa+4,0,100);log('你在全港學界公開賽奪得獎項，為校爭光！','big');}
        else{S.eq+=2;S.mood-=3;log('你在學界比賽中雖未獲獎，但累積了寶貴經驗。');}
      }else if(act==='skip'){
        S.mood+=12;st.conduct=clamp(st.conduct-12,0,100);st.gpa=clamp(st.gpa-5,0,100);st.dropoutRisk=clamp(st.dropoutRisk+16,0,100);
        log('你翹課去機舖／商場閒逛，被訓導主任記過，輟學風險大幅上升！','bad');
        if(st.dropoutRisk>=85){
          closeSheet();
          leaveSchool('因長期逃學且操行嚴重不合格，你被學校正式勒令退學（輟學）！','bad');
          normalize();render();return;
        }
      }
      redo();
    }});
  }});
}

// 2. 監獄犯人專屬 Modal（工場勞動、申請保釋／刑期覆核、高風險越獄）
function openPrisonModal(){
  const p=S.prison;if(!p)return;
  const fac=p.facility||'赤柱監獄';
  const bailCost=Math.round((p.totalYears||2)*450000*S.cpi);
  const escChance=clamp(0.08+(S.iq-50)*0.003+(S.health-50)*0.003-(p.yearsLeft*0.015),0.05,0.32);
  const html=`
    <div class="bizstat">
      <div class="b"><div class="l">服刑院所</div><div class="v" style="font-size:12px">${fac}</div></div>
      <div class="b"><div class="l">裁定罪名</div><div class="v" style="font-size:11px;color:var(--rust)">${p.reason}</div></div>
      <div class="b"><div class="l">剩餘刑期</div><div class="v">${p.yearsLeft} 年</div></div>
      <div class="b"><div class="l">懲教署行為評分</div><div class="v">${p.behavior||50} / 100</div></div>
    </div>
    <p class="note" style="margin-top:0;margin-bottom:8px">剩餘行動點：<b style="color:var(--amber)">${S.ap}</b>。在囚期間你可以安分在工場工作賺取微薄工資並累積行為分，或委託大律師申請保釋上訴；亦可冒死策劃越獄！</p>

    <div class="sec">🔨 獄中日常與工作（消耗 1 行動點）</div>
    <div class="btnrow" style="margin-top:0">
      <button data-pr="work" class="pri" ${S.ap<1?'disabled':''}>懲教署工場勞動 (+評分/微薄薪資)</button>
      <button data-pr="study" ${S.ap<1?'disabled':''}>報讀遙距課程 (+智商/行為分)</button>
      <button data-pr="gym" ${S.ap<1?'disabled':''}>監獄操場鍛鍊 (+健康/體能)</button>
    </div>

    <div class="sec">⚖️ 司法保釋與提早釋放</div>
    <div class="btnrow" style="margin-top:0">
      <button data-pr="bail" ${S.money<bailCost||p.bailTried?'disabled':''}>聘請資深大律師申請保釋 (${fmt(bailCost)})</button>
      <button data-pr="parole" ${(p.behavior||50)<80||p.yearsLeft<=1?'disabled':''}>申請刑期覆核提早釋放 (需評分≥80)</button>
    </div>

    <div class="sec">🚨 高風險地下行動（消耗 1 行動點）</div>
    <div class="btnrow" style="margin-top:0">
      <button data-pr="escape" class="warn" ${S.ap<1?'disabled':''}>🗝️ 策劃越獄逃亡（預估成功率 ${Math.round(escChance*100)}%）</button>
    </div>
    <p class="note">警告：越獄屬於極嚴重罪行！一旦失手被懲教署緊急應變部隊擒獲，將即時加判 3～6 年監禁並打入單獨囚禁室！</p>`;

  const redo=()=>{normalize();render();openPrisonModal()};
  sheet({title:'🔒 懲教署在囚人士管理',body:html,buttons:[{text:'關閉'}],onMount(){
    document.querySelectorAll('[data-pr]').forEach(b=>{b.onclick=()=>{
      const op=b.dataset.pr;
      if(op==='work'){
        if(S.ap<1)return toast('行動點不足');
        S.ap--;
        const wage=Math.round(ri(1200,3200)*S.cpi);
        S.money+=wage;
        p.behavior=clamp((p.behavior||50)+10,0,100);
        S.moral+=1;
        log(`你在${fac}的工業工場認真製作路牌與制服，獲發在囚工資 $${wage.toLocaleString()}，行為評分 +10。`,'good');
        redo();return;
      }
      if(op==='study'){
        if(S.ap<1)return toast('行動點不足');
        S.ap--;
        p.behavior=clamp((p.behavior||50)+12,0,100);
        S.iq+=3;S.moral+=2;
        log('你在囚室內苦讀都會大學遙距課程並撰寫悔過書，懲教署行為評分大幅提升！','good');
        redo();return;
      }
      if(op==='gym'){
        if(S.ap<1)return toast('行動點不足');
        S.ap--;
        S.health+=6;S.mood+=4;
        log('你在監獄操場堅持做掌上壓與跑步，體能保持在巔峰狀態。','good');
        redo();return;
      }
      if(op==='bail'){
        if(S.money<bailCost)return toast('現金不足支付保釋金與律師費');
        S.money-=bailCost;p.bailTried=true;
        const ok=Math.random()<clamp(0.32+S.eq*0.003+(S.origin==='rich'?0.15:0),0.20,0.68);
        if(ok){
          log(`⚖️ 高等法院法官接納資深大律師陳詞，批准你以 ${fmt(bailCost)} 元保釋外出候審／上訴得直撤銷餘下刑期！`,'big');
          S.prison=null;S.mood+=22;S.pendingOffer=true;
          closeSheet();normalize();render();queueJob();
        }else{
          log(`法官認為你有潛逃風險，駁回保釋申請，律師費已耗去 ${fmt(bailCost)} 元。`,'bad');
          redo();
        }
        return;
      }
      if(op==='parole'){
        if((p.behavior||50)<80)return toast('行為評分不足 80 分');
        if(Math.random()<0.52){
          log('長期監禁刑期覆核委員會批准你的申請，你獲提早監管釋放！','big');
          S.prison=null;S.mood+=18;S.pendingOffer=true;
          closeSheet();normalize();render();queueJob();
        }else{
          p.behavior-=10;
          log('刑期覆核申請未獲批准，需繼續在院所服刑。','bad');
          redo();
        }
        return;
      }
      if(op==='escape'){
        if(S.ap<1)return toast('行動點不足');
        S.ap--;
        if(Math.random()<escChance){
          log(`🚨 驚天大越獄！你趁夜間換班摸黑翻越${fac}高牆並跳海游離，成功逃出生天，成為全港通緝犯！`,'big');
          S.prison=null;S.moral-=20;S.renown+=15;S.mood+=25;
          closeSheet();normalize();render();
        }else{
          const extra=ri(3,6);
          p.yearsLeft+=extra;p.behavior=10;S.health-=ri(10,20);S.mood-=25;
          log(`🚓 越獄失敗！探照燈與警鐘大作，你被懲教署「黑豹部隊」當場制伏並負傷，法庭加判監禁 ${extra} 年！`,'bad');
          redo();
        }
      }
    }});
  }});
}

function openCareer(){
  if(S.over)return;
  let html='';const buttons=[];

    const p=S.prison;
    html=`<div class="row"><span class="k">服刑院所</span><span class="v">${p.facility||'赤柱監獄'}</span></div>

    buttons.push({text:'申請刑期覆核提早釋放',disabled:(p.behavior||50)<80||p.yearsLeft<=1,onClick:()=>{
      if(Math.random()<0.48){log('長期監禁刑期覆核委員會批准你的申請，你獲提早監管釋放！','big');S.prison=null;S.mood+=15;S.pendingOffer=true;normalize();render();queueJob()}

      <div class="row"><span class="k">考績表現</span><span class="v">${Math.round(m.performance)}</span></div>
      ${m.rankIndex>=12?`<div class="row"><span class="k">防務預算 / 戰備</span><span class="v">${fmt(m.budget||0)} / ${Math.round(m.readiness||70)}</span></div>`:''}
      <p class="note">${m.volunteer?'紀律部隊：晉升至助理處長以上可開啟「司令部軍務與大型政府採購管理」（含演習、換裝與油水回扣），處長級首長之後更可晉升「軍種副司令 → 軍種司令 → 保安局局長（紀律部隊最高首長）」！':'輔警／民安隊培訓：服役滿 1 年自動榮休／離任。想留下來，現在可以轉紀律部隊。'}</p>`;
    if(m.volunteer&&m.rankIndex>=12)buttons.push({text:m.rankIndex>=14?'⚔️ 司令部軍政與油水':'🎖️ 首長級長官防務與預算',cls:'pri',onClick:()=>{setTimeout(openMilitaryManagement,60)}});

      <div class="sec">💼 工作項目與上司指令（消耗 1 行動點）</div>
      <div class="btnrow" style="margin-top:0">
        <button data-wk="project" class="pri" ${S.ap<1?'disabled':''}>📊 承接重點工作項目</button>
        <button data-wk="order" ${S.ap<1?'disabled':''}>📋 執行上司緊急命令</button>
        <button data-wk="overtime" ${S.ap<1?'disabled':''}>🌙 深夜 OT 衝刺表現</button>

      ${isMgr?`<div class="sec">👔 管理階層專屬權限（部門管理）</div>
      <div class="btnrow" style="margin-top:0">
        <button data-wk="mgr_lead" class="pri" ${S.ap<1?'disabled':''}>👥 督導團隊與分配資源</button>
        <button data-wk="mgr_bonus" ${S.ap<1?'disabled':''}>💰 向董事會爭取部門花紅</button>
        <button data-wk="mgr_cut" class="warn" ${S.ap<1?'disabled':''}>✂️ 精簡人手削減開支</button>

      <p class="note">完成工作項目與上司命令可大幅累積 KPI 與年資加成，加速晉升至「管理階層」解鎖部門管理與爭取高額花紅！</p>`;
    buttons.push({text:'換工作',cls:'pri',onClick:()=>{setTimeout(openJobSearch,60)}});

function voluntaryDischarge(){
  const years=S.military.yearsServed;const rank=S.military.rank.name;
  S.military=null;S.working=false;S.salary=0;S.mood+=5;S.pendingOffer=true;
  log(`你以${rank}的職級榮休／離任，結束 ${years} 年的紀律部隊生涯。`,'big');
  normalize();render();queueJob();
}
function careerYear(){
  const ladder=CAREER_LADDERS[S.job.id];
  S.workYears=(S.workYears||0)+1;
  const perf=rnd(-5,15)+S.iq*0.04+S.eq*0.04+S.mood*0.02+S.renown*0.02;
  if(ladder&&perf>12&&S.jobPosition<ladder.length-1&&S.workYears>=(S.jobPosition+1)*2){
    S.jobPosition++;S.salary=jobPay(S.job,S.jobPosition,S.workYears);
    log(`工作表現出色，升職為「${ladder[S.jobPosition]}」，年薪 ${fmt(S.salary)} 元。`,'big');S.mood+=12;
  }else{S.salary=jobPay(S.job,S.jobPosition,S.workYears);log(`你工作一年，薪水 ${fmt(S.salary)} 元。`)}
  return S.salary;
}
function civilYearlyReview(){
  const c=S.civil;
  c.budget+=30+c.rankIndex*20+ri(0,20);c.yir++;
  const perf=c.score+c.perfBonus+c.budget*0.05+rnd(-10,15);
  const need=CIVIL_YEARS[c.rankIndex]||99;
  if(perf>75&&c.rankIndex<CIVIL_RANKS.length-1&&c.yir>=need){
    c.rankIndex++;c.rank={...CIVIL_RANKS[c.rankIndex]};c.yir=0;
    log(`政府公務員／政務主任考核優秀，升任「${c.rank.name}」，年薪 ${fmt(rankPay(c.rank))} 元。`,'big');S.mood+=12;
  }else if(perf>50){log('政府公務員／政務主任考核通過。')}
  else{c.score=clamp(c.score-5,0,100);log('政府公務員／政務主任考核成績不理想。','bad');S.mood-=6}
  const pay=rankPay(c.rank);S.salary=pay;S.pubYears++;S.lastSalary=pay/S.cpi;
  log(`政府公務員／政務主任薪資 ${fmt(pay)} 元。`);
  return pay;
}
function workIncome(){
  if(S.military)return militaryYear();
  if(S.politician)return politicianYear();
  if(S.civil)return civilYearlyReview();
  if(S.job)return careerYear();
  return 0;
}
function pensionAnnual(){
  let p=0;
  if(S.insuredYears>=15)p+=S.insuredYears*0.0155*(S.insuredSum/S.insuredYears)*S.cpi;
  if(S.pubYears>=15)p+=Math.min(0.75,S.pubYears*0.02)*S.lastSalary*S.cpi;
  return Math.round(p);
}
function retire(why){
  if(S.job||S.civil||S.politician){
    log(`${why||'你退休了'}開始享受退休生活。`,'big');
    S.job=null;S.civil=null;S.politician=null;S.salary=0;S.working=false;S.jobPosition=0;S.workYears=0;S.payMod=1;
  }
  S.retired=true;
}
function payoutPensions(){
  if(S.pensionPaid)return;S.pensionPaid=true;
  const lump=Math.round(S.laborPension*S.cpi);
  if(lump>0){S.money+=lump;log(`強積金 (MPF) 個人帳戶一筆過提取 ${fmt(lump)} 元。`,'good');S.laborPension=0}
  if(S.insuredYears>0&&S.insuredYears<15){const l2=Math.round(S.insuredYears*(S.insuredSum/S.insuredYears)/12*S.cpi);S.money+=l2;log(`公積金年資未滿，領取一筆過退休金 ${fmt(l2)} 元。`,'good')}
  if(S.pubYears>0&&S.pubYears<15){const l3=Math.round(S.pubYears*S.lastSalary/13*S.cpi);S.money+=l3;log(`政府公務員／政務主任年資未滿，領取一筆過退休酬金 ${fmt(l3)} 元。`,'good')}
  const pn=pensionAnnual();if(pn>0)log(`之後每年可領年金約 ${fmt(pn)} 元。`,'big');
}

/* ══════ 人物年度 ══════ */
function parentDies(w){
  w.alive=false;S.mood-=25;S.moral+=2;
  const cost=Math.round(200000*S.cpi);S.money-=cost;
  log(`${w.role}${w.name}過世了（享年 ${w.age} 歲）。喪葬費用 ${fmt(cost)} 元。`,'bad');
  const other=w===S.people.dad?S.people.mom:S.people.dad;
  if(!other||other.absent||!other.alive){
    const est=Math.round(S.parentWealth*S.cpi*rnd(0.7,1.2));
    if(est>0){const tax=estateTax(est,false,1);S.money+=est-tax;S.parentWealth=0;log(`你繼承了父母的遺產 ${fmt(est-tax)} 元${tax?`（已繳遺產稅 ${fmt(tax)}）`:''}。`,'big')}
    if(S.home==='parents')S.home='rent';
  }
  normalize();
}
function ageUpPeople(){
  const p=S.people;
  [p.dad,p.mom].forEach(w=>{
    if(w.absent||!w.alive)return;
    w.age++;if(w.age>=65)w.job='退休';
    if(Math.random()<deathChance(w.age,w.gender,62))parentDies(w);else w.rel=clamp(w.rel-1,0,100);
  });
  p.friends.forEach(f=>{
    if(!f.alive)return;
    f.age++;if(f.age>=22&&!f.job&&f.age<65)f.job=pick(JOB_POOL);if(f.age>=65)f.job='退休';
    f.rel=clamp(f.rel-2,0,100);
    if(Math.random()<deathChance(f.age,f.gender,65)){f.alive=false;f.rel=0;log(`朋友${f.name}離開了人世。`,'bad');S.mood-=8}
  });
  p.children.forEach(c=>{
    if(!c.alive)return;
    c.age++;childLifeChoices(c);
    if(c.age>=22&&!c.job&&c.age<65&&c.alive&&!c.major)c.job=pick(WORK_POOL);
    if(c.age>=65)c.job='退休';c.rel=clamp(c.rel-1,0,100);
  });
  const pr=S.partner;
  if(pr){
    pr.age++;if(pr.age>=22&&!pr.job&&pr.age<65){pr.job=pick(JOB_POOL);if(!pr.inc)pr.inc=incFor(pr.job)}
    if(pr.age>=65)pr.job='退休';pr.rel=clamp(pr.rel-1,0,100);
    if(Math.random()<deathChance(pr.age,pr.gender,65)){log(`${pr.name}離開了人世。`,'bad');S.partner=null;S.married=false;S.mood-=40}
    else if(!S.married&&pr.rel<25&&Math.random()<0.5){log(`${pr.name}覺得你們不適合，提出了分手。`,'bad');S.partner=null;S.mood-=20}
    else if(S.married&&pr.rel<15&&Math.random()<0.3){doDivorce(`${pr.name}提出離婚，婚姻走到了盡頭`)}
  }
}
function childLifeChoices(c){
  if(c.age===18&&!c.job&&!c.major){
    if(Math.random()<0.55){c.major=pick(['biz','tech','art','edu','college']);log(`${c.name} 考上了大學，就讀${MAJORS.find(m=>m.id===c.major).name}。`,'good')}
    else{c.job=pick(WORK_POOL);log(`${c.name} 決定不升學，開始工作，成為了一名${c.job}。`,'good')}
  }
  if(c.major&&!c.job){const m=MAJORS.find(x=>x.id===c.major);if(m&&c.age>=18+m.years){c.job=pick(WORK_POOL);log(`${c.name} 畢業了，開始工作，成為了一名${c.job}。`,'good')}}
  if(c.age>=25&&c.age<=35&&!c.spouse&&Math.random()<0.2){
    const sg=c.gender==='M'?'F':'M';
    const sp=randPerson(sg);
    const sjob=pick(WORK_POOL);
    c.spouse=sp.name;
    c.spouseObj={name:sp.name,gender:sg,age:c.age+ri(-3,3),rel:ri(75,92),alive:true,job:sjob,inc:incFor(sjob)};
    log(`${c.name} 結婚了，對象是${sp.name}（${sjob}）。`,'good');
  }
  if(c.spouse&&c.age>=25&&c.age<=40&&(c.kids||0)<3&&Math.random()<0.15){
    c.kids=(c.kids||0)+1;
    c.kidList=c.kidList||[];
    const kg=Math.random()<.5?'M':'F';
    const kn=c.name.charAt(0)+(kg==='M'?pick(NAME_M):pick(NAME_F));
    c.kidList.push({name:kn,gender:kg,age:0,rel:82,alive:true,job:null,spouse:null,kids:0,major:null});
    log(`${c.name} 迎來了第 ${c.kids} 個孩子「${kn}」，你升格當祖父母了！`,'big');S.mood+=15;
  }
  if(c.kidList&&c.kidList.length){c.kidList.forEach(k=>{if(k.alive)k.age++})}
  if(c.spouseObj&&c.spouseObj.alive)c.spouseObj.age++;
  if(Math.random()<deathChance(c.age,c.gender,70)){c.alive=false;log(`你的孩子${c.name}過世了。白髮人送黑髮人，你悲痛不已。`,'bad');S.mood-=25}
}

function pickHkPrison(years,gender){
  if(gender==='F')return years>=4?'羅湖懲教所（高度設防女子監獄）':'大欖女懲教所';
  if(years>=6)return'赤柱監獄（高度設防）';
  if(years>=3)return'壁屋懲教所';
  return'荔枝角收押所／塘福懲教所';
}
function goPrison(reason,years,fine=0){
  const facility=pickHkPrison(years,S.gender);
  const court=years>=5?'高等法院原訟庭':years>=2?'區域法院':'東區／九龍城裁判法院';
  S.prison={yearsLeft:years,totalYears:years,reason,facility,court,behavior:50};
  S.crimeRecord=S.crimeRecord||[];
  S.crimeRecord.push({age:S.age,reason,years,facility});
  S.working=false;S.job=null;S.civil=null;S.politician=null;S.military=null;S.salary=0;S.jobPosition=0;
  if(fine>0){const f=Math.round(fine*S.cpi);S.money-=f;log(`⚖️ 經${court}審訊，你因「${reason}」罪名成立，判處監禁 ${years} 年（押往【${facility}】服刑），並頒令充公／罰款 $${fmt(f)}！`,'bad')}
  else log(`⚖️ 經${court}審訊，你因「${reason}」罪名成立，判處監禁 ${years} 年，即時押往【${facility}】服刑！`,'bad');
  S.mood-=40;S.moral-=5;S.renown=Math.max(0,S.renown-25);
}
function checkPrison(){
  if(S.prison||S.age<18)return;
  if(S.moral<35&&Math.random()<clamp((35-S.moral)*0.008,0.03,0.22)){
    const pool=CRIMES.filter(c=>!c.cond||c.cond(S));
    const c=pick(pool.length?pool:CRIMES);
    goPrison(c.name,ri(c.minY,c.maxY),c.fine);
  }
}

function illnessYear(){
  if(!S.illness){
    const p=S.age>=35?(0.004+(S.age-35)*0.0008)*(1+(100-S.health)/60):0;
    if(Math.random()<p){S.illness={name:pick(['惡性腫瘤','嚴重心血管疾病','嚴重肝病','腎臟病','腦中風前兆']),stage:0,found:false,giveUp:false}}
    return;
  }
  const ill=S.illness;
  if(ill.giveUp){S.health-=8;return}
  if(!ill.found){S.health-=3+ill.stage;ill.stage+=0.6;
    if(Math.random()<0.3+ill.stage*0.1){ill.found=true;log('你身體不太對勁，去醫院檢查後確診了重病。','bad');queue(offerTreatment)}
  }else{S.health-=4;ill.stage+=0.4;queue(offerTreatment)}
}
function offerTreatment(){
  const ill=S.illness;if(!ill||!ill.found||ill.giveUp||S.over)return;
  const pAgg=clamp(0.9-ill.stage*0.12,0.3,0.9),pCons=clamp(0.3-ill.stage*0.04,0.05,0.3);
  const aggCost=Math.round(300000*S.cpi),consCost=Math.round(80000*S.cpi);

    {text:`積極治療（${fmt(aggCost)}，約 ${Math.round(pAgg*100)}% 康復）`,cls:'pri',onClick:()=>{
      S.money-=aggCost;
      if(Math.random()<pAgg){S.illness=null;S.cured=true;S.health-=8;S.mood-=10;log('歷經手術與長期治療，你戰勝了病魔！','big')}
      else{ill.stage+=1;S.health-=25;S.mood-=15;log('積極治療後，病況仍不樂觀，身體非常虛弱。','bad')}
      normalize();render()}},
    {text:`保守治療（${fmt(consCost)}，約 ${Math.round(pCons*100)}% 康復）`,onClick:()=>{
      S.money-=consCost;
      if(Math.random()<pCons){S.illness=null;S.cured=true;S.health-=5;log('保守治療奇蹟似地有效，你康復了。','big')}
      else{ill.stage+=0.5;S.health-=12;log('保守治療只能勉強控制病情。','bad')}
      normalize();render()}},
    {text:'放棄治療，順其自然',cls:'warn',onClick:()=>{ill.giveUp=true;S.mood-=10;S.moral+=1;log('你決定不再治療，把剩下的日子好好過完。','bad');normalize();render()}},
  ]});
}

function fireEvent(){
  const pool=EVENTS.filter(e=>(!e.min||S.age>=e.min)&&(!e.max||S.age<=e.max)&&(!e.cond||e.cond(S)));
  if(!pool.length)return;const total=pool.reduce((a,b)=>a+(b.w||1),0);let r=Math.random()*total;
  for(const e of pool){r-=(e.w||1);if(r<=0){e.run(S);return}}
}

    {t:'收下 200 萬現金',run:s=>{const b=Math.round(2000000*s.cpi);s.money+=b;s.moral-=15;log(`你收下了財團賄款 ${fmt(b)} 元。`,'bad');if(Math.random()<0.32)goPrison('公職人員索取／接受利益罪（《防止賄賂條例》第4條）',ri(5,10),b*2)}},
    {t:'原封退回並通報廉政公署 (ICAC)',run:s=>{s.moral+=8;s.renown+=4;if(s.civil)s.civil.score+=6;if(s.politician)s.politician.score+=6;log('你當場拒收並通報廉政公署 (ICAC)，清廉形象傳開！','good')}}]},
  {id:'drink_drive',min:20,max:65,cond:s=>s.licenses.driver&&s.assets.cars.length>0,title:'應酬散場已深夜',text:'聚餐喝了幾杯威士忌，代駕要等 40 分鐘，你的車就停在門口，看起來離家只有十分鐘車程。',opts:[
    {t:'心存僥倖自己開車回家',run:s=>{s.moral-=8;if(Math.random()<0.35){goPrison('酒後駕駛及危險駕駛引致他人身體受嚴重傷害罪',ri(1,3),250000)}else{log('你冒險酒駕回到家，雖然沒被攔檢，但實在太危險了。','bad')}}},
    {t:'乖乖叫代駕（花費 1,200）',run:s=>{s.money=Math.max(0,S.money-1200);s.moral+=2;log('你花 1,200 元叫了代駕，平安到家。','good')}}]},
];
function fireChoice(){
  const pool=CHOICES.filter(c=>(!c.min||S.age>=c.min)&&(!c.max||S.age<=c.max)&&(!c.cond||c.cond(S)));
  if(!pool.length)return;
  const c=pick(pool);
  queue(()=>{
    if(S.over)return;
    if(c.cond&&!c.cond(S))return;
    sheet({title:c.title,body:`<p>${c.text}</p>`,closable:false,buttons:c.opts.map(o=>({text:o.t,onClick:()=>{o.run(S);normalize();render()}}))});
  });
}

];
function checkAch(){
  ACH.forEach(([id,name,f])=>{if(!S.ach[id]&&f(S)){S.ach[id]=S.age;log(`🏆 達成成就：${name}`,'big');toast('🏆 '+name)}});
