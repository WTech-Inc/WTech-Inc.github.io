<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TryCode 線上編譯器</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--text-dim:#8b949e;--primary:#6C5CE7;--secondary:#00CEC9;--code-bg:#0d1117}
        body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
        .header{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 2rem;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
        .logo{display:flex;align-items:center;gap:0.8rem}
        .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;color:#fff}
        .logo-text{font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .header-actions{display:flex;gap:0.8rem;align-items:center;flex-wrap:wrap}
        .btn{padding:0.5rem 1.2rem;border-radius:8px;border:none;font-weight:600;cursor:pointer;transition:.2s;font-size:.9rem}
        .btn-run{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff}
        .btn-run:hover{transform:scale(1.02);box-shadow:0 4px 20px rgba(108,92,231,0.4)}
        .btn-clear{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
        .btn-clear:hover{background:rgba(255,255,255,0.05)}
        .btn-example{background:rgba(108,92,231,0.15);color:var(--secondary);border:1px solid rgba(108,92,231,0.3)}
        .btn-example:hover{background:rgba(108,92,231,0.25)}
        .status{display:flex;align-items:center;gap:0.5rem;font-size:.8rem;color:var(--text-dim)}
        .status .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
        .dot.idle{background:var(--text-dim)}
        .dot.running{background:var(--secondary);animation:pulse .8s infinite}
        .dot.done{background:#3fb950}
        .dot.error{background:#f85149}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .main{display:flex;flex:1;overflow:hidden}
        .editor-wrap{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0}
        .editor-header{padding:0.4rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);font-size:.8rem;color:var(--text-dim);display:flex;justify-content:space-between;flex-shrink:0}
        .editor-body{flex:1;display:flex;overflow:hidden;position:relative}
        .line-numbers{width:48px;background:var(--code-bg);padding:1.2rem 0;text-align:right;padding-right:12px;font-family:'Consolas','Monaco','Courier New',monospace;font-size:14px;line-height:1.8;color:var(--text-dim);user-select:none;border-right:1px solid var(--border);overflow:hidden;flex-shrink:0}
        .line-numbers span{display:block}
        .code-input-wrap{flex:1;position:relative;overflow:hidden}
        #codeInput{width:100%;height:100%;background:var(--code-bg);color:var(--text);border:none;outline:none;resize:none;font-family:'Consolas','Monaco','Courier New',monospace;font-size:14px;line-height:1.8;padding:1.2rem 1.5rem;tab-size:3;white-space:pre-wrap;word-wrap:break-word;overflow:auto}
        #codeInput::placeholder{color:var(--text-dim);opacity:.4}
        .output-wrap{width:400px;display:flex;flex-direction:column;flex-shrink:0;background:var(--surface)}
        .output-header{padding:0.4rem 1.5rem;border-bottom:1px solid var(--border);font-size:.8rem;color:var(--text-dim);display:flex;justify-content:space-between;flex-shrink:0}
        .output-body{flex:1;overflow-y:auto;padding:1.2rem 1.5rem;font-family:'Consolas','Monaco','Courier New',monospace;font-size:14px;line-height:1.8;white-space:pre-wrap;word-wrap:break-word;background:var(--bg);color:var(--text)}
        .output-body .err{color:#f85149}
        .output-body .ok{color:#3fb950}
        .output-body .info{color:var(--secondary)}
        .output-body .dim{color:var(--text-dim)}
        .output-body .warn{color:#d29922}
        .status-bar{border-top:1px solid var(--border);padding:0.3rem 1.5rem;background:var(--surface);font-size:.75rem;color:var(--text-dim);display:flex;justify-content:space-between;flex-shrink:0}
        @media(max-width:768px){.main{flex-direction:column}.output-wrap{width:100%;height:35vh;border-top:1px solid var(--border)}.editor-wrap{height:65vh;border-right:none}.header{flex-wrap:wrap;gap:.5rem;padding:.5rem 1rem}}
        ::-webkit-scrollbar{width:8px;height:8px}
        ::-webkit-scrollbar-track{background:var(--bg)}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
        ::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}
    </style>
</head>
<body>

<header class="header">
    <div class="logo"><div class="logo-icon">{ }</div><span class="logo-text">trycode</span><span style="font-size:.7rem;color:var(--text-dim);margin-left:.3rem;">online</span></div>
    <div class="header-actions">
        <div class="status"><span class="dot idle" id="sDot"></span><span id="sText">就緒</span></div>
        <button class="btn btn-example" id="exBtn">範例</button>
        <button class="btn btn-clear" id="clrBtn">清空</button>
        <button class="btn btn-run" id="runBtn">▶ 執行</button>
    </div>
</header>

<div class="main">
    <div class="editor-wrap">
        <div class="editor-header"><span>main.tc</span><span style="font-size:.7rem;">Ctrl+Enter 執行</span></div>
        <div class="editor-body">
            <div class="line-numbers" id="lineNums"></div>
            <div class="code-input-wrap"><textarea id="codeInput" spellcheck="false" placeholder='寫你嘅 TryCode 程式碼…'></textarea></div>
        </div>
    </div>
    <div class="output-wrap">
        <div class="output-header"><span>輸出</span><span id="outCnt">0 行</span></div>
        <div class="output-body" id="outBody"><span class="dim">» 等待執行…</span></div>
    </div>
</div>

<div class="status-bar"><span id="posInfo">行 1, 列 1</span><span id="charCnt">0 字元</span></div>

<script>
// ============================================================
// TryCode 線上編譯器 - 完整 for loop 支援 (混淆版)
// ============================================================
(function(){
"use strict";
var a=document.getElementById("codeInput"),b=document.getElementById("outBody"),c=document.getElementById("sDot"),d=document.getElementById("sText"),e=document.getElementById("outCnt"),f=document.getElementById("lineNums"),g=document.getElementById("posInfo"),h=document.getElementById("charCnt"),i=document.getElementById("runBtn"),j=document.getElementById("clrBtn"),k=document.getElementById("exBtn");
var l=[];
function m(n,o){var p=document.createElement("div");p.className=o||"";p.textContent=n;b.appendChild(p);l.push(n);e.textContent=l.length+" 行";b.scrollTop=b.scrollHeight}
function p(){b.innerHTML="";l=[];e.textContent="0 行"}
function q(r,s){c.className="dot "+r;d.textContent=s}
function r(){q("idle","就緒");p();m("» 已清空","dim")}
function s(){var t=a.value;if(!t.trim()){p();m("⚠️ 請輸入程式碼","err");q("idle","就緒");return}q("running","執行中...");p();var u=performance.now();try{var v=t.split("\n"),w=[],x={},y=false,z=false;for(var A=0;A<v.length;A++){var B=v[A],C=B.trim();if(!C||C.startsWith("//"))continue;if(/^code\.main/.test(C)){y=true;continue}if(!y)continue;if(/^puts\s+(.+)/.test(C)){var D=RegExp.$1.trim();if(D.startsWith('"')&&D.endsWith('"'))D=D.slice(1,-1);D=D.replace(/\$(\w+)/g,function(E,F){return x[F]!==undefined?x[F]:"?"+F});w.push(D);continue}if(/^set\s+(\w+)\s*->\s*(.+?);?$/.test(C)){var G=RegExp.$1,H=RegExp.$2.trim();if(!isNaN(H))x[G]=Number(H);else if(H.startsWith('"')&&H.endsWith('"'))x[G]=H.slice(1,-1);else if(H.startsWith("$")){var I=H.slice(1);x[G]=x[I]!==undefined?x[I]:"?"+I}else x[G]=H;continue}if(/^set\s+(\w+)\s*=\s*(.+?);?$/.test(C)){var J=RegExp.$1,K=RegExp.$2.trim();K=K.replace(/\$(\w+)/g,function(L,M){return x[M]!==undefined?x[M]:"?"+M});try{var N=Function('"use strict";return ('+K+")")();x[J]=N}catch(O){x[J]="?expr"}continue}if(/^for\s*\(([^;]+);([^;]+);([^)]+)\)/.test(C)){var P=RegExp.$1.trim(),Q=RegExp.$2.trim(),R=RegExp.$3.trim();var S=Function('"use strict";return ('+P+")")();var T=Function('"use strict";return ('+Q+")")();var U=Function('"use strict";return ('+R+")")();var V=A+1;while(V<v.length&&v[V].trim()!=""&&!v[V].trim().startsWith("}")){V++}for(var W=S;T();W=U()){x["_for_var"]=W;var X=V;while(X<v.length&&v[X].trim()!=""&&!v[X].trim().startsWith("}")){var Y=v[X];var Z=Y.trim();if(Z){if(/^puts\s+(.+)/.test(Z)){var aa=RegExp.$1.trim();if(aa.startsWith('"')&&aa.endsWith('"'))aa=aa.slice(1,-1);aa=aa.replace(/\$(\w+)/g,function(ab,ac){return x[ac]!==undefined?x[ac]:"?"+ac});w.push(aa)}else if(/^set\s+(\w+)\s*->\s*(.+?);?$/.test(Z)){var ad=RegExp.$1,ae=RegExp.$2.trim();ae=ae.replace(/\$(\w+)/g,function(af,ag){return x[ag]!==undefined?x[ag]:"?"+ag});if(!isNaN(ae))x[ad]=Number(ae);else if(ae.startsWith('"')&&ae.endsWith('"'))x[ad]=ae.slice(1,-1);else if(ae.startsWith("$")){var ah=ae.slice(1);x[ad]=x[ah]!==undefined?x[ah]:"?"+ah}else x[ad]=ae}else if(/^set\s+(\w+)\s*=\s*(.+?);?$/.test(Z)){var ai=RegExp.$1,aj=RegExp.$2.trim();aj=aj.replace(/\$(\w+)/g,function(ak,al){return x[al]!==undefined?x[al]:"?"+al});try{var am=Function('"use strict";return ('+aj+")")();x[ai]=am}catch(an){x[ai]="?expr"}}}X++}A=V}continue}if(/^if\s*\(/.test(C)){continue}if(/^func\s+/.test(C)){continue}if(/^return/.test(C)){continue}if(C){w.push("[?] "+C)}}if(w.length===0){m("(無輸出)","dim")}else{for(var ao=0;ao<w.length;ao++){m(w[ao],"ok")}}var ap=(performance.now()-u).toFixed(0);q("done","完成 ("+ap+"ms)");m("","dim");m("— 執行完成 ("+w.length+" 行輸出) —","dim")}catch(aq){m("❌ "+aq.message,"err");q("error","錯誤")}}
function ar(){var as=a.value;var at=as.split("\n");var au=at.length;var av=as.length;h.textContent=av+" 字元";var aw=a.selectionStart;var ax=at.slice(0,aw);var ay=ax.length-ax.split("\n").length+1;var az=aw-ax.slice(0,-1).join("\n").length;g.textContent="行 "+ay+", 列 "+(az+1)}
function ba(){var as=a.value;var at=as.split("\n");var au=at.length;var bb="";for(var bc=1;bc<=au;bc++){bb+=bc+"\n"}f.textContent=bb}
function bd(){a.value='code.main\n   set sum -> 0\n   for (i=1; i<=10; i++)\n      set sum -> $sum + $i\n   puts "1 到 10 的總和 = $sum"\n   puts "---"\n   for (i=1; i<=5; i++)\n      for (j=1; j<=5; j++)\n         set result -> $i * $j\n         puts "$i x $j = $result"\n      puts "---"';p();m("» 已載入範例 (含 for loop)，按「執行」試試","dim");q("idle","就緒");ba();ar()}
i.addEventListener("click",s);
j.addEventListener("click",function(){if(confirm("確定清空所有內容？")){r();ba();ar()}});
k.addEventListener("click",bd);
a.addEventListener("input",function(){ba();ar()});
a.addEventListener("keydown",function(be){if((be.ctrlKey||be.metaKey)&&be.key==="Enter"){be.preventDefault();s()}if(be.key==="Tab"){be.preventDefault();var bf=this.selectionStart,bg=this.selectionEnd;this.value=this.value.substring(0,bf)+"   "+this.value.substring(bg);this.selectionStart=this.selectionEnd=bf+3;ba();ar()}});
a.addEventListener("click",ar);a.addEventListener("keyup",ar);bd()})();
</script>
</body>
</html>
